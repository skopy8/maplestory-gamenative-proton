name: Package MapleStory ARM64EC Recovery to Known-Good 2.2 State 2.5

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Original workflow run ID containing compiled-proton-arm64ec-checkpoint"
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04

    env:
      CUSTOM_VERSION: "11.0-2.5-arm64ec"
      WCP_NAME: "proton-11.0-2.5-arm64ec.wcp"
      RUNTIME_COMMIT: "181cd74cf51db5fd2563ec81359a94db9a2ada32"

    steps:
      # ============================================================
      # 1. DOWNLOAD OUR ALREADY-COMPILED PATCHED PROTON
      # ============================================================

      - name: Download compiled ARM64EC checkpoint
        uses: actions/download-artifact@v4
        with:
          name: compiled-proton-arm64ec-checkpoint
          path: checkpoint
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}

      # ============================================================
      # 2. RESTORE COMPILED PROTON
      #
      # The original checkpoint was deliberately wrapped in a tar
      # so executable permissions and symlinks survive GitHub
      # Actions artifact storage.
      # ============================================================

      - name: Restore compiled Proton checkpoint
        shell: bash
        run: |
          set -euxo pipefail

          CHECKPOINT="checkpoint/compiled-proton-checkpoint.tar"

          echo "=== Checkpoint artifact ==="
          ls -lh checkpoint

          test -f "$CHECKPOINT"

          rm -rf checkpoint_extracted
          mkdir -p checkpoint_extracted

          tar -xf "$CHECKPOINT" \
            -C checkpoint_extracted

          ROOT="$GITHUB_WORKSPACE/checkpoint_extracted"

          test -d "$ROOT/bin"
          test -d "$ROOT/lib"
          test -d "$ROOT/share"

          echo "CHECKPOINT_ROOT=$ROOT" >> "$GITHUB_ENV"

          echo
          echo "=== Restored Proton root ==="
          ls -lah "$ROOT"

          echo
          echo "=== Wine launchers ==="
          ls -lah "$ROOT/bin"

      # ============================================================
      # 3. VALIDATE / RESTORE THE WINE LAUNCHER
      # ============================================================

      - name: Validate checkpoint Wine runtime
        shell: bash
        run: |
          set -euxo pipefail

          ROOT="$CHECKPOINT_ROOT"

          echo "=== bin/wine ==="

          test -L "$ROOT/bin/wine"

          WINE_TARGET="$(readlink "$ROOT/bin/wine")"

          echo "Target: $WINE_TARGET"

          if [ "$WINE_TARGET" != "../lib/wine/aarch64-unix/wine" ]; then
            echo "ERROR: Unexpected bin/wine target"
            exit 1
          fi

          test -f "$ROOT/lib/wine/aarch64-unix/wine"
          test -f "$ROOT/bin/wineserver"

          # Restore executable bits just in case.
          chmod 755 "$ROOT/lib/wine/aarch64-unix/wine"
          chmod 755 "$ROOT/bin/wineserver"

          find "$ROOT/bin" \
            -maxdepth 1 \
            -type f \
            -name 'wine*' \
            -exec chmod 755 {} \;

          test -e "$ROOT/bin/wine"
          test -x "$ROOT/bin/wine"
          test -x "$ROOT/bin/wineserver"
          test -x "$ROOT/lib/wine/aarch64-unix/wine"

          echo
          echo "=== Runtime files ==="

          ls -l \
            "$ROOT/bin/wine" \
            "$ROOT/bin/wineserver" \
            "$ROOT/lib/wine/aarch64-unix/wine"

          echo
          echo "Checkpoint Wine runtime validation PASSED"

      # ============================================================
      # 4. CHECK OUT THE EXACT VC++ RUNTIME PAYLOAD USED BY THE
      #    MAPLESTORY LINUX REFERENCE SETUP
      #
      # Pin the source commit so this controlled test cannot silently
      # change if the upstream repository changes later.
      # ============================================================

      - name: Checkout pinned MapleStory VC runtime payload
        uses: actions/checkout@v4
        with:
          repository: oldschoola/linux_maplestory
          ref: ${{ env.RUNTIME_COMMIT }}
          path: maplestory_reference
          sparse-checkout: |
            files/vc_runtime
            patches/13-apply-runtime-file-patches.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Validate pinned VC runtime payload
        shell: bash
        run: |
          set -euxo pipefail

          ROOT="$GITHUB_WORKSPACE/maplestory_reference/files/vc_runtime"

          SYS32=(
            concrt140.dll
            msvcp140.dll
            msvcp140_1.dll
            msvcp140_2.dll
            msvcp140_atomic_wait.dll
            msvcp140_codecvt_ids.dll
            ucrtbase.dll
            vccorlib140.dll
            vcomp140.dll
            vcruntime140.dll
            vcruntime140_1.dll
            vcruntime140_threads.dll
          )

          WOW64=(
            concrt140.dll
            msvcp140.dll
            msvcp140_1.dll
            msvcp140_2.dll
            msvcp140_atomic_wait.dll
            msvcp140_codecvt_ids.dll
            ucrtbase.dll
            vccorlib140.dll
            vcomp140.dll
            vcruntime140.dll
            vcruntime140_threads.dll
          )

          for dll in "${SYS32[@]}"; do
            test -s "$ROOT/system32/$dll"
          done

          for dll in "${WOW64[@]}"; do
            test -s "$ROOT/syswow64/$dll"
          done

          echo "=== Runtime payload commit ==="
          git -C "$GITHUB_WORKSPACE/maplestory_reference" rev-parse HEAD
          test "$(git -C "$GITHUB_WORKSPACE/maplestory_reference" rev-parse HEAD)" = "$RUNTIME_COMMIT"

          echo
          echo "=== system32 payload ==="
          for dll in "${SYS32[@]}"; do
            file "$ROOT/system32/$dll"
            sha256sum "$ROOT/system32/$dll"
          done

          echo
          echo "=== syswow64 payload ==="
          for dll in "${WOW64[@]}"; do
            file "$ROOT/syswow64/$dll"
            sha256sum "$ROOT/syswow64/$dll"
          done

          echo
          echo "Pinned VC runtime payload validation PASSED"

      # ============================================================
      # 5. DOWNLOAD THE CORRECT PROTON 11 ARM64EC PREFIX
      #
      # IMPORTANT:
      # Use prefixPack-arm64ec-11.txz.
      # Do NOT use the generic prefixPack-arm64ec.txz.
      # ============================================================

      - name: Download GameNative Proton 11 ARM64EC prefix
        shell: bash
        run: |
          set -euxo pipefail

          wget \
            https://github.com/GameNative/bionic-prefix-files/raw/main/prefixPack-arm64ec-11.txz \
            -O prefixPack-base.txz

          test -s prefixPack-base.txz

          echo
          echo "=== Base prefix pack ==="

          ls -lh prefixPack-base.txz
          file prefixPack-base.txz
          sha256sum prefixPack-base.txz

      # ============================================================
      # 6. APPLY THE MAPLESTORY REGISTRY FIXES
      #
      # Keep the registry layer from 1.3 unchanged. The only new
      # compatibility variable in 1.6 is vcruntime140_threads.dll.
      # NO Wine rebuild here.
      # ============================================================

      - name: Patch MapleStory registry settings into prefix
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf prefix_work
          mkdir -p prefix_work

          tar -xJf prefixPack-base.txz \
            -C prefix_work

          echo "=== Prefix structure ==="

          find prefix_work \
            -maxdepth 3 \
            -type f \
            -printf '%p\n' \
            > prefix-files-before.txt

          sed -n '1,150p' prefix-files-before.txt

          USER_REG="$(find prefix_work -type f -name user.reg -print -quit)"
          SYSTEM_REG="$(find prefix_work -type f -name system.reg -print -quit)"
          USERDEF_REG="$(find prefix_work -type f -name userdef.reg -print -quit || true)"

          if [ -z "$USER_REG" ]; then
            echo "ERROR: user.reg not found in prefix."
            exit 1
          fi

          if [ -z "$SYSTEM_REG" ]; then
            echo "ERROR: system.reg not found in prefix."
            exit 1
          fi

          echo
          echo "=== Registry hives ==="

          echo "user.reg:    $USER_REG"
          echo "system.reg:  $SYSTEM_REG"
          echo "userdef.reg: ${USERDEF_REG:-not present}"

          python3 - \
            "$USER_REG" \
            "$SYSTEM_REG" \
            "${USERDEF_REG:-}" <<'PY'
          import re
          import sys
          from pathlib import Path

          user_reg = Path(sys.argv[1])
          system_reg = Path(sys.argv[2])
          userdef_arg = sys.argv[3]
          userdef_reg = Path(userdef_arg) if userdef_arg else None


          def string_value(value):
              value = value.replace("\\", "\\\\")
              value = value.replace('"', '\\"')
              return f'"{value}"'


          def value_name(name):
              if name is None:
                  return "@"

              escaped = name.replace("\\", "\\\\")
              escaped = escaped.replace('"', '\\"')

              return f'"{escaped}"'


          def render(name, kind, value):
              prefix = value_name(name) + "="

              if kind == "str":
                  return prefix + string_value(value)

              if kind == "dword":
                  return prefix + f"dword:{value:08x}"

              raise ValueError(f"Unknown value type: {kind}")


          # Wine's internal registry-file format is similar to REGEDIT.
          # These paths are relative to HKCU inside user.reg.

          USER_PATCHES = {
              r"Software\\Wine\\X11 Driver": {
                  "UseTakeFocus": ("str", "N"),
                  "Grab": ("str", "N"),
                  "GrabFullscreen": ("str", "N"),
                  "UseLinuxInputEvents": ("str", "Y"),
              },

              r"Software\\Wine\\DirectInput": {
                  "UseLinuxInputEvents": ("str", "Y"),
                  "KeyboardUseNonExclusive": ("str", "Y"),
                  "MouseUseNonExclusive": ("str", "Y"),
              },

              r"Software\\Wine\\AppDefaults\\MapleStory.exe": {
                  "Version": ("str", "win10"),
              },

              r"Software\\Wine\\AppDefaults\\nxsteam.exe": {
                  "Version": ("str", "win10"),
              },

              r"Software\\Wine\\AppDefaults\\SteamConnectorHelper.exe": {
                  "Version": ("str", "win10"),
              },

              r"Software\\Nexon Launcher": {
                  "Install Directory": ("str", r"C:\Nexon\Launcher"),
                  "Region": ("str", "1"),
                  "User Data": (
                      "str",
                      '{"setup-id":"372e7640-20f4-419c-ada0-4ad0d76c33d9","time":1748271149}',
                  ),
              },

              r"Software\\Wine\\Direct3D": {
                  "cb_access_map_w": ("dword", 1),
                  "CSMT": ("str", "disabled"),
              },
          }


          # These paths are relative to HKLM inside system.reg.

          SYSTEM_PATCHES = {
              r"Software\\Classes\\Applications\\nexon_launcher.exe\\shell\\open": {
                  "FriendlyAppName": ("str", "Nexon Launcher"),
              },

              r"Software\\Classes\\nxl": {
                  None: ("str", "URL:nxl protocol"),
                  "URL Protocol": ("str", ""),
              },

              r"Software\\Classes\\nxl\\DefaultIcon": {
                  None: ("str", r"C:\Nexon\Launcher\nexon_launcher.exe"),
              },

              r"Software\\Classes\\nxl\\shell": {
                  None: ("str", ""),
              },

              r"Software\\Classes\\nxl\\shell\\open": {
                  None: ("str", ""),
                  "Friendly App Name": ("str", "Nexon Launcher"),
              },

              r"Software\\Classes\\nxl\\shell\\open\\command": {
                  None: (
                      "str",
                      r'"C:\Nexon\Launcher\nexon_launcher.exe" "%1"',
                  ),
              },

              r"Software\\Wow6432Node\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\Nexon Nexon Launcher": {
                  "DisplayIcon": (
                      "str",
                      r'"C:\Nexon\Launcher\logo.ico"',
                  ),
                  "DisplayName": (
                      "str",
                      "Nexon Launcher",
                  ),
                  "DisplayVersion": (
                      "str",
                      "2.3.0",
                  ),
                  "EstimatedSize": (
                      "dword",
                      0x2B48,
                  ),
                  "HelpLink": (
                      "str",
                      r'"http://www.nexon.net/legal/terms-of-use/"',
                  ),
                  "InstallLocation": (
                      "str",
                      r'"C:\Nexon\Launcher"',
                  ),
                  "NoModify": (
                      "dword",
                      1,
                  ),
                  "NoRepair": (
                      "dword",
                      1,
                  ),
                  "Publisher": (
                      "str",
                      "Nexon",
                  ),
                  "QuietUninstallString": (
                      "str",
                      r'"C:\Nexon\Launcher\uninstall.exe" /S',
                  ),
                  "UninstallString": (
                      "str",
                      r'"C:\Nexon\Launcher\uninstall.exe"',
                  ),
                  "URLInfoAbout": (
                      "str",
                      r'"http://www.nexon.net"',
                  ),
                  "URLUpdateInfo": (
                      "str",
                      r'"http://www.nexon.net"',
                  ),
                  "VersionMajor": (
                      "dword",
                      2,
                  ),
                  "VersionMinor": (
                      "dword",
                      3,
                  ),
              },
          }


          section_re = re.compile(r"^\[([^\]]+)\](?:\s+.*)?$")


          def find_section(lines, section):
              for index, line in enumerate(lines):
                  match = section_re.match(line)

                  if match and match.group(1) == section:
                      start = index

                      end = len(lines)

                      for next_index in range(index + 1, len(lines)):
                          if section_re.match(lines[next_index]):
                              end = next_index
                              break

                      return start, end

              return None


          def patch_hive(path, patches):
              print(f"Patching {path}")

              text = path.read_text(
                  encoding="utf-8",
                  errors="strict",
              )

              lines = text.splitlines()

              for section, values in patches.items():

                  current = find_section(lines, section)

                  if current is None:
                      if lines and lines[-1] != "":
                          lines.append("")

                      # Modification time is optional in Wine registry v2.
                      lines.append(f"[{section}]")

                      for name, (kind, value) in values.items():
                          lines.append(
                              render(
                                  name,
                                  kind,
                                  value,
                              )
                          )

                      continue

                  for name, (kind, value) in values.items():

                      desired = render(
                          name,
                          kind,
                          value,
                      )

                      token = value_name(name) + "="

                      start, end = find_section(
                          lines,
                          section,
                      )

                      replaced = False

                      for line_index in range(
                          start + 1,
                          end,
                      ):
                          if lines[line_index].startswith(token):
                              lines[line_index] = desired
                              replaced = True
                              break

                      if not replaced:
                          lines.insert(
                              end,
                              desired,
                          )

              path.write_text(
                  "\n".join(lines) + "\n",
                  encoding="utf-8",
              )


          def verify_hive(path, patches):
              text = path.read_text(
                  encoding="utf-8",
                  errors="strict",
              )

              for section, values in patches.items():

                  if f"[{section}]" not in text:
                      # Existing Wine-generated sections may include
                      # modification timestamps after the closing bracket.
                      section_found = False

                      for line in text.splitlines():
                          match = section_re.match(line)

                          if match and match.group(1) == section:
                              section_found = True
                              break

                      if not section_found:
                          raise RuntimeError(
                              f"Missing registry section {section} in {path}"
                          )

                  for name, (kind, value) in values.items():
                      wanted = render(
                          name,
                          kind,
                          value,
                      )

                      if wanted not in text:
                          raise RuntimeError(
                              f"Missing registry value {wanted} in {path}"
                          )

              print(f"Verified {path}")


          patch_hive(
              user_reg,
              USER_PATCHES,
          )

          patch_hive(
              system_reg,
              SYSTEM_PATCHES,
          )

          # Keep default-user settings consistent if this hive exists.
          if userdef_reg and userdef_reg.exists():
              patch_hive(
                  userdef_reg,
                  USER_PATCHES,
              )

          verify_hive(
              user_reg,
              USER_PATCHES,
          )

          verify_hive(
              system_reg,
              SYSTEM_PATCHES,
          )

          if userdef_reg and userdef_reg.exists():
              verify_hive(
                  userdef_reg,
                  USER_PATCHES,
              )

          print()
          print("MapleStory registry patch validation PASSED")
          PY

          echo
          echo "=== Repacking modified prefix ==="

          tar cJf prefixPack.txz \
            -C prefix_work \
            .

          test -s prefixPack.txz

          echo
          echo "=== Modified prefix pack ==="

          ls -lh prefixPack.txz
          sha256sum prefixPack.txz

          echo
          echo "=== Modified prefix contents ==="

          tar tJf prefixPack.txz \
            > modified-prefix-files.txt

          grep -E \
            '(^|/)(user|userdef|system)\.reg$' \
            modified-prefix-files.txt

          echo
          echo "Prefix registry patch PASSED"

      # ============================================================
      # 7. ADD ONLY vcruntime140_threads.dll TO THE PACKAGED PREFIX
      #
      # Known-good 1.6 runtime variable:
      #   - system32/vcruntime140_threads.dll
      #   - syswow64/vcruntime140_threads.dll
      #
      # We deliberately do NOT replace ucrtbase.dll or the rest of the
      # VC runtime set yet. Earlier MapleStory logs already showed several
      # v14 runtime DLLs loading, while vcruntime140_threads.dll was not
      # observed. This keeps the experiment narrow and reversible.
      # ============================================================

      - name: Add vcruntime140_threads.dll to packaged prefix
        shell: bash
        run: |
          set -euxo pipefail

          PAYLOAD="$GITHUB_WORKSPACE/maplestory_reference/files/vc_runtime"

          rm -rf prefix_runtime_work
          mkdir -p prefix_runtime_work

          tar -xJf prefixPack.txz \
            -C prefix_runtime_work

          DRIVE_C="$(find prefix_runtime_work -type d -name drive_c -print -quit)"

          if [ -z "$DRIVE_C" ]; then
            echo "ERROR: drive_c not found in prefix pack"
            exit 1
          fi

          mkdir -p \
            "$DRIVE_C/windows/system32" \
            "$DRIVE_C/windows/syswow64"

          cp -f \
            "$PAYLOAD/system32/vcruntime140_threads.dll" \
            "$DRIVE_C/windows/system32/vcruntime140_threads.dll"

          cp -f \
            "$PAYLOAD/syswow64/vcruntime140_threads.dll" \
            "$DRIVE_C/windows/syswow64/vcruntime140_threads.dll"

          cmp -s \
            "$PAYLOAD/system32/vcruntime140_threads.dll" \
            "$DRIVE_C/windows/system32/vcruntime140_threads.dll"

          cmp -s \
            "$PAYLOAD/syswow64/vcruntime140_threads.dll" \
            "$DRIVE_C/windows/syswow64/vcruntime140_threads.dll"

          tar cJf prefixPack.txz \
            -C prefix_runtime_work \
            .

          test -s prefixPack.txz

          echo
          echo "Packaged-prefix vcruntime140_threads.dll injection PASSED"

      # ============================================================
      # 8. STAGE REGISTRY-ONLY RECOVERY FOR THE EXISTING LIVE PREFIX
      #
      # The failed 1.7 nested regedit may have persisted some/all of the
      # ten VC runtime native,builtin overrides into the existing user.reg.
      # 2.0 restored the runtime files before its guest-side cmp failure,
      # but its wine.inf registry recovery never got a chance to run.
      #
      # 2.2 therefore changes ONLY those ten values in the live
      # Software\\Wine\\DllOverrides section. It derives their exact
      # baseline from untouched prefixPack-arm64ec-11.txz at build time.
      #
      # IMPORTANT:
      #   - No nested Wine/regedit invocation.
      #   - No wine.inf mutation.
      #   - No WINEDLLOVERRIDES.
      #   - No live VC runtime copying.
      #   - No esync / DXVK / Turnip changes.
      #   - Recovery intentionally also runs for TestD3D.
      # ============================================================

      - name: Stage 2.2 live-prefix VC DllOverrides recovery
        shell: bash
        run: |
          set -euxo pipefail

          ROOT="$CHECKPOINT_ROOT"
          RECOVERY_ROOT="$ROOT/share/wine/maplestory_registry_recovery_2_2"

          test -x "$ROOT/lib/wine/aarch64-unix/wine"

          rm -rf recovery_registry_base "$RECOVERY_ROOT"
          mkdir -p recovery_registry_base "$RECOVERY_ROOT"

          tar -xJf prefixPack-base.txz \
            -C recovery_registry_base

          BASE_USER_REG="$(find recovery_registry_base -type f -name user.reg -print -quit)"
          test -n "$BASE_USER_REG"
          test -s "$BASE_USER_REG"

          # Extract only the ten values that 1.7 attempted to force.
          # baseline-values.txt contains the exact raw Wine-registry lines
          # present upstream; omitted values are intentionally absent.
          python3 - \
            "$BASE_USER_REG" \
            "$RECOVERY_ROOT/baseline-values.txt" \
            "$RECOVERY_ROOT/baseline-status.txt" <<'PYBASE'
          import re
          import sys
          from pathlib import Path

          user_reg = Path(sys.argv[1])
          values_out = Path(sys.argv[2])
          status_out = Path(sys.argv[3])

          section = r"Software\\Wine\\DllOverrides"
          targets = [
              "concrt140",
              "msvcp140",
              "msvcp140_1",
              "msvcp140_2",
              "msvcp140_atomic_wait",
              "msvcp140_codecvt_ids",
              "ucrtbase",
              "vcomp140",
              "vcruntime140",
              "vcruntime140_1",
          ]
          target_set = set(targets)

          lines = user_reg.read_text(encoding="utf-8", errors="strict").splitlines()
          section_re = re.compile(r"^\[([^\]]+)\](?:\s+.*)?$")
          value_re = re.compile(r'^"([^"]+)"=(.*)$')

          in_section = False
          found = {}

          for line in lines:
              match = section_re.match(line)
              if match:
                  in_section = match.group(1) == section
                  continue

              if not in_section:
                  continue

              match = value_re.match(line)
              if not match:
                  continue

              name = match.group(1).lower()
              if name not in target_set:
                  continue

              if name in found:
                  raise RuntimeError(f"Duplicate upstream DllOverrides value: {name}")

              found[name] = line

          baseline_lines = [found[name] for name in targets if name in found]

          values_out.write_text(
              "\n".join(baseline_lines) + ("\n" if baseline_lines else ""),
              encoding="utf-8",
          )

          status_lines = []
          for name in targets:
              if name in found:
                  status_lines.append(f"present {name} {found[name]}")
              else:
                  status_lines.append(f"absent {name}")

          status_out.write_text("\n".join(status_lines) + "\n", encoding="utf-8")

          print("=== Upstream VC DllOverrides baseline ===")
          print(status_out.read_text(encoding="utf-8"), end="")
          PYBASE

          test -f "$RECOVERY_ROOT/baseline-values.txt"
          test -s "$RECOVERY_ROOT/baseline-status.txt"

          cat > "$RECOVERY_ROOT/repair-user-reg.sh" <<'SHREPAIR'
          #!/bin/sh
          # Restore only the ten MapleStory VC runtime DllOverrides values in
          # a Wine user.reg file. This intentionally uses simple POSIX shell
          # operations available in GameNative's bionic guest.

          USER_REG="$1"
          BASELINE_VALUES="$2"

          if [ -z "$USER_REG" ] || [ -z "$BASELINE_VALUES" ]; then
              echo "[GN-MS-2.2] ERROR: repair helper missing arguments" >&2
              exit 91
          fi

          if [ ! -f "$USER_REG" ]; then
              echo "[GN-MS-2.2] ERROR: user.reg not found: $USER_REG" >&2
              exit 92
          fi

          if [ ! -f "$BASELINE_VALUES" ]; then
              echo "[GN-MS-2.2] ERROR: baseline-values.txt missing: $BASELINE_VALUES" >&2
              exit 93
          fi

          TMP="${USER_REG}.gamenative-2.2.tmp"
          rm -f "$TMP" || exit 94
          : > "$TMP" || exit 94

          IN_SECTION=0
          SECTION_FOUND=0

          while IFS= read -r LINE || [ -n "$LINE" ]; do
              case "$LINE" in
                  '[Software\\Wine\\DllOverrides]'*)
                      printf '%s\n' "$LINE" >> "$TMP" || exit 94
                      if [ -s "$BASELINE_VALUES" ]; then
                          cat "$BASELINE_VALUES" >> "$TMP" || exit 94
                      fi
                      IN_SECTION=1
                      SECTION_FOUND=1
                      continue
                      ;;
                  '['*)
                      IN_SECTION=0
                      ;;
              esac

              if [ "$IN_SECTION" -eq 1 ]; then
                  case "$LINE" in
                      \"[Cc][Oo][Nn][Cc][Rr][Tt]140\"=*|\
                      \"[Mm][Ss][Vv][Cc][Pp]140\"=*|\
                      \"[Mm][Ss][Vv][Cc][Pp]140_1\"=*|\
                      \"[Mm][Ss][Vv][Cc][Pp]140_2\"=*|\
                      \"[Mm][Ss][Vv][Cc][Pp]140_[Aa][Tt][Oo][Mm][Ii][Cc]_[Ww][Aa][Ii][Tt]\"=*|\
                      \"[Mm][Ss][Vv][Cc][Pp]140_[Cc][Oo][Dd][Ee][Cc][Vv][Tt]_[Ii][Dd][Ss]\"=*|\
                      \"[Uu][Cc][Rr][Tt][Bb][Aa][Ss][Ee]\"=*|\
                      \"[Vv][Cc][Oo][Mm][Pp]140\"=*|\
                      \"[Vv][Cc][Rr][Uu][Nn][Tt][Ii][Mm][Ee]140\"=*|\
                      \"[Vv][Cc][Rr][Uu][Nn][Tt][Ii][Mm][Ee]140_1\"=*)
                          # Drop the live value. The exact upstream baseline
                          # value (if one exists) was inserted at section start.
                          continue
                          ;;
                  esac
              fi

              printf '%s\n' "$LINE" >> "$TMP" || exit 94
          done < "$USER_REG"

          # If the live hive had no DllOverrides section but upstream has one
          # or more of our target values, append only those baseline values.
          if [ "$SECTION_FOUND" -eq 0 ] && [ -s "$BASELINE_VALUES" ]; then
              printf '\n[Software\\\\Wine\\\\DllOverrides]\n' >> "$TMP" || exit 94
              cat "$BASELINE_VALUES" >> "$TMP" || exit 94
          fi

          # Preserve user.reg's existing inode/mode by truncating and rewriting
          # the original file instead of replacing it with mv.
          cat "$TMP" > "$USER_REG" || exit 95
          rm -f "$TMP" || exit 95

          exit 0
          SHREPAIR

          chmod 755 "$RECOVERY_ROOT/repair-user-reg.sh"
          sh -n "$RECOVERY_ROOT/repair-user-reg.sh"

          # ----------------------------------------------------------
          # Build-time simulation of the exact repair helper.
          # Create a synthetic live user.reg with all ten 1.7 values forced
          # to native,builtin plus an unrelated sentinel override, run the
          # helper, then verify the ten values exactly match upstream and the
          # sentinel survives.
          # ----------------------------------------------------------

          cp "$BASE_USER_REG" recovery-user-reg-test.reg

          python3 - recovery-user-reg-test.reg <<'PYCONTAM'
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          section = r"Software\\Wine\\DllOverrides"
          forced = {
              "concrt140": "native,builtin",
              "msvcp140": "native,builtin",
              "msvcp140_1": "native,builtin",
              "msvcp140_2": "native,builtin",
              "msvcp140_atomic_wait": "native,builtin",
              "msvcp140_codecvt_ids": "native,builtin",
              "ucrtbase": "native,builtin",
              "vcomp140": "native,builtin",
              "vcruntime140": "native,builtin",
              "vcruntime140_1": "native,builtin",
              "gamenative_2_2_sentinel": "builtin",
          }

          lines = path.read_text(encoding="utf-8").splitlines()
          section_re = re.compile(r"^\[([^\]]+)\](?:\s+.*)?$")

          start = None
          end = None
          for i, line in enumerate(lines):
              m = section_re.match(line)
              if m and m.group(1) == section:
                  start = i
                  end = len(lines)
                  for j in range(i + 1, len(lines)):
                      if section_re.match(lines[j]):
                          end = j
                          break
                  break

          entries = [f'"{name}"="{value}"' for name, value in forced.items()]

          if start is None:
              if lines and lines[-1] != "":
                  lines.append("")
              lines.append(f"[{section}]")
              lines.extend(entries)
          else:
              target_names = {name.lower() for name in forced}
              kept = []
              for line in lines[start + 1:end]:
                  m = re.match(r'^"([^"]+)"=', line)
                  if m and m.group(1).lower() in target_names:
                      continue
                  kept.append(line)
              lines[start + 1:end] = entries + kept

          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PYCONTAM

          "$RECOVERY_ROOT/repair-user-reg.sh" \
            recovery-user-reg-test.reg \
            "$RECOVERY_ROOT/baseline-values.txt"

          python3 - \
            "$BASE_USER_REG" \
            recovery-user-reg-test.reg <<'PYVERIFY'
          import re
          import sys
          from pathlib import Path

          targets = [
              "concrt140",
              "msvcp140",
              "msvcp140_1",
              "msvcp140_2",
              "msvcp140_atomic_wait",
              "msvcp140_codecvt_ids",
              "ucrtbase",
              "vcomp140",
              "vcruntime140",
              "vcruntime140_1",
          ]
          section = r"Software\\Wine\\DllOverrides"

          def read_values(path):
              lines = Path(path).read_text(encoding="utf-8").splitlines()
              section_re = re.compile(r"^\[([^\]]+)\](?:\s+.*)?$")
              value_re = re.compile(r'^"([^"]+)"=(.*)$')
              in_section = False
              values = {}
              for line in lines:
                  m = section_re.match(line)
                  if m:
                      in_section = m.group(1) == section
                      continue
                  if not in_section:
                      continue
                  m = value_re.match(line)
                  if m:
                      values[m.group(1).lower()] = line
              return values

          base = read_values(sys.argv[1])
          repaired = read_values(sys.argv[2])

          for name in targets:
              if base.get(name) != repaired.get(name):
                  raise RuntimeError(
                      f"Repair mismatch for {name}: upstream={base.get(name)!r} repaired={repaired.get(name)!r}"
                  )

          sentinel = repaired.get("gamenative_2_2_sentinel")
          if sentinel != '"gamenative_2_2_sentinel"="builtin"':
              raise RuntimeError(f"Unrelated sentinel was not preserved: {sentinel!r}")

          print("Synthetic live-user.reg recovery simulation PASSED")
          PYVERIFY

          # Preserve the original Wine launcher as wine.real and install the
          # thin one-time live-registry recovery wrapper.
          test -L "$ROOT/bin/wine"
          test "$(readlink "$ROOT/bin/wine")" = "../lib/wine/aarch64-unix/wine"

          rm -f "$ROOT/bin/wine.real"
          ln -s ../lib/wine/aarch64-unix/wine "$ROOT/bin/wine.real"
          rm -f "$ROOT/bin/wine"

          cat > "$ROOT/bin/wine" <<'SHWRAP'
          #!/bin/sh
          # GameNative MapleStory 216150 registry-only recovery shim (2.2).
          # Repair the ten VC DllOverrides values potentially persisted by the
          # failed 1.7 regedit attempt, then immediately launch the real Wine.

          # Do not use command substitution. GameNative's LD_PRELOAD evshim
          # writes startup messages to stdout and can corrupt captured output.
          case "$0" in
              /*)
                  SCRIPT_PATH="$0"
                  ;;
              */*)
                  SCRIPT_PATH="$PWD/$0"
                  ;;
              *)
                  echo "[GN-MS-2.2] ERROR: Wine wrapper was invoked without a path: $0" >&2
                  exit 50
                  ;;
          esac

          SCRIPT_DIR="${SCRIPT_PATH%/*}"
          ROOT_DIR="${SCRIPT_DIR%/*}"
          REAL_WINE="$SCRIPT_DIR/wine.real"
          RECOVERY_ROOT="$ROOT_DIR/share/wine/maplestory_registry_recovery_2_2"
          REPAIR_SCRIPT="$RECOVERY_ROOT/repair-user-reg.sh"
          BASELINE_VALUES="$RECOVERY_ROOT/baseline-values.txt"

          if [ ! -x "$REAL_WINE" ]; then
              echo "[GN-MS-2.2] ERROR: real Wine launcher missing: $REAL_WINE" >&2
              exit 52
          fi

          PREFIX="${WINEPREFIX:-}"

          if [ -n "$PREFIX" ]; then
              USER_REG="$PREFIX/user.reg"
              MARKER="$PREFIX/.gamenative-maplestory-dlloverrides-recovery-2.2"

              if [ -f "$USER_REG" ]; then
                  if [ ! -f "$MARKER" ]; then
                      if [ ! -x "$REPAIR_SCRIPT" ] || [ ! -f "$BASELINE_VALUES" ]; then
                          echo "[GN-MS-2.2] ERROR: packaged registry recovery payload missing" >&2
                          exit 90
                      fi

                      echo "[GN-MS-2.2] Restoring VC DllOverrides baseline in $USER_REG" >&2

                      "$REPAIR_SCRIPT" "$USER_REG" "$BASELINE_VALUES" || exit $?

                      {
                          echo "GameNative MapleStory VC DllOverrides recovery 2.2"
                          echo "Recovered=concrt140,msvcp140,msvcp140_1,msvcp140_2,msvcp140_atomic_wait,msvcp140_codecvt_ids,ucrtbase,vcomp140,vcruntime140,vcruntime140_1"
                          echo "Source=untouched prefixPack-arm64ec-11.txz baseline"
                          echo "RuntimeFiles=unchanged by 2.2 live recovery"
                          echo "WineInf=unchanged"
                      } > "$MARKER" || exit 96

                      echo "[GN-MS-2.2] Registry recovery complete; VC DllOverrides match Proton 11 baseline" >&2
                  else
                      echo "[GN-MS-2.2] Registry recovery marker already present" >&2
                  fi
              else
                  # A genuinely new prefix will use the already-patched
                  # prefixPack.txz; do not block Wine initialization.
                  echo "[GN-MS-2.2] user.reg not ready; deferring live registry recovery" >&2
              fi
          fi

          exec "$REAL_WINE" "$@"
          SHWRAP

          chmod 755 "$ROOT/bin/wine"

          echo
          echo "=== Validate 2.2 registry recovery wrapper ==="

          test -f "$ROOT/bin/wine"
          test ! -L "$ROOT/bin/wine"
          test -x "$ROOT/bin/wine"
          test -L "$ROOT/bin/wine.real"
          test -e "$ROOT/bin/wine.real"
          test -x "$ROOT/bin/wine.real"
          test "$(readlink "$ROOT/bin/wine.real")" = "../lib/wine/aarch64-unix/wine"

          sh -n "$ROOT/bin/wine"
          sh -n "$RECOVERY_ROOT/repair-user-reg.sh"

          grep -Fq 'Restoring VC DllOverrides baseline' "$ROOT/bin/wine"
          grep -Fq 'Registry recovery complete; VC DllOverrides match Proton 11 baseline' "$ROOT/bin/wine"
          grep -Fq 'repair-user-reg.sh' "$ROOT/bin/wine"
          grep -Fq 'exec "$REAL_WINE" "$@"' "$ROOT/bin/wine"

          if grep -Fq 'TestD3D.exe' "$ROOT/bin/wine"; then
              echo "ERROR: 2.2 must not bypass registry recovery for TestD3D"
              exit 1
          fi

          if grep -Fq 'WINEDLLOVERRIDES' "$ROOT/bin/wine"; then
              echo "ERROR: WINEDLLOVERRIDES leaked into 2.2"
              exit 1
          fi

          if grep -Fq 'regedit /S' "$ROOT/bin/wine"; then
              echo "ERROR: nested regedit leaked into 2.2"
              exit 1
          fi

          if grep -Eq '(^|[[:space:]])cmp([[:space:]]|$)' "$ROOT/bin/wine"; then
              echo "ERROR: guest wrapper depends on cmp"
              exit 1
          fi

          if grep -Fq 'SCRIPT_DIR=$(' "$ROOT/bin/wine" || \
             grep -Fq 'ROOT_DIR=$(' "$ROOT/bin/wine"; then
              echo "ERROR: wrapper contains stdout-capturing path command substitution"
              exit 1
          fi

          echo
          echo "2.2 live-prefix registry-only recovery wrapper PASSED"

      # ============================================================
      # 9. STAGE 2.5 UNCONDITIONAL RUNTIME-FILE RECOVERY
      #
      # 2.4 proved that the complete VC runtime payload can poison the
      # persistent ARM64EC prefix before NXSteam starts. 2.5 therefore
      # performs no compatibility experiment at all. Before ANY Wine launch
      # type (TestD3D, NXSteam, or anything else using this WCP), restore the
      # 12 system32 + 11 syswow64 filenames touched by the full-runtime tests
      # to the exact packaged 2.2 baseline.
      #
      # The packaged 2.2 baseline is:
      #   - untouched Proton 11 runtime files where they originally existed
      #   - absent files remain absent
      #   - only vcruntime140_threads.dll remains intentionally added
      #
      # The already-proven 2.2 registry-recovery wrapper is preserved as the
      # inner launcher, so this outer shim changes runtime files only.
      # ============================================================

      - name: Stage 2.5 unconditional runtime-file recovery
        shell: bash
        run: |
          set -euxo pipefail

          ROOT="$CHECKPOINT_ROOT"
          PAYLOAD="$GITHUB_WORKSPACE/maplestory_reference/files/vc_runtime"
          BASE_ROOT="$ROOT/share/wine/maplestory_runtime_recovery_2_5"

          test -x "$ROOT/bin/wine"
          test ! -L "$ROOT/bin/wine"
          test -L "$ROOT/bin/wine.real"
          test -x "$ROOT/bin/wine.real"

          rm -rf "$BASE_ROOT" runtime_baseline_prefix_2_5 runtime_recovery_test_2_5
          mkdir -p \
            "$BASE_ROOT/system32" \
            "$BASE_ROOT/syswow64" \
            runtime_baseline_prefix_2_5

          cat > "$BASE_ROOT/system32-targets.txt" <<'EOF_SYS32'
          concrt140.dll
          msvcp140.dll
          msvcp140_1.dll
          msvcp140_2.dll
          msvcp140_atomic_wait.dll
          msvcp140_codecvt_ids.dll
          ucrtbase.dll
          vccorlib140.dll
          vcomp140.dll
          vcruntime140.dll
          vcruntime140_1.dll
          vcruntime140_threads.dll
          EOF_SYS32

          cat > "$BASE_ROOT/syswow64-targets.txt" <<'EOF_WOW64'
          concrt140.dll
          msvcp140.dll
          msvcp140_1.dll
          msvcp140_2.dll
          msvcp140_atomic_wait.dll
          msvcp140_codecvt_ids.dll
          ucrtbase.dll
          vccorlib140.dll
          vcomp140.dll
          vcruntime140.dll
          vcruntime140_threads.dll
          EOF_WOW64

          # Capture the exact packaged 2.2 runtime-file state. prefixPack.txz
          # already contains the MapleStory registry settings and ONLY the
          # vcruntime140_threads.dll addition from the known-good 1.6/2.2 path.
          tar -xJf prefixPack.txz -C runtime_baseline_prefix_2_5
          BASE_DRIVE_C="$(find runtime_baseline_prefix_2_5 -type d -name drive_c -print -quit)"
          test -n "$BASE_DRIVE_C"

          while IFS= read -r DLL; do
            test -n "$DLL"
            SRC="$BASE_DRIVE_C/windows/system32/$DLL"
            if [ -f "$SRC" ]; then
              cp -a "$SRC" "$BASE_ROOT/system32/$DLL"
            fi
          done < "$BASE_ROOT/system32-targets.txt"

          while IFS= read -r DLL; do
            test -n "$DLL"
            SRC="$BASE_DRIVE_C/windows/syswow64/$DLL"
            if [ -f "$SRC" ]; then
              cp -a "$SRC" "$BASE_ROOT/syswow64/$DLL"
            fi
          done < "$BASE_ROOT/syswow64-targets.txt"

          cat > "$BASE_ROOT/restore-known-good-2.2-runtime.sh" <<'SHRESTORE'
          #!/bin/sh
          # Restore the exact known-good 2.2 runtime-file baseline for every
          # VC runtime filename touched by the 1.7-2.4 experiments.
          # POSIX shell only: no cmp, sha256sum, python, regedit, or Wine.

          PREFIX="$1"
          ROOT="$2"

          if [ -z "$PREFIX" ] || [ -z "$ROOT" ]; then
              echo "[GN-MS-2.5] ERROR: runtime recovery helper missing arguments" >&2
              exit 81
          fi

          SYS32="$PREFIX/drive_c/windows/system32"
          WOW64="$PREFIX/drive_c/windows/syswow64"
          mkdir -p "$SYS32" "$WOW64" || exit 82

          while IFS= read -r DLL || [ -n "$DLL" ]; do
              [ -n "$DLL" ] || continue
              SRC="$ROOT/system32/$DLL"
              DEST="$SYS32/$DLL"
              rm -f "$DEST" || exit 83
              if [ -f "$SRC" ]; then
                  cp "$SRC" "$DEST" || exit 84
                  chmod 644 "$DEST" 2>/dev/null || true
                  [ -s "$DEST" ] || exit 85
              fi
          done < "$ROOT/system32-targets.txt"

          while IFS= read -r DLL || [ -n "$DLL" ]; do
              [ -n "$DLL" ] || continue
              SRC="$ROOT/syswow64/$DLL"
              DEST="$WOW64/$DLL"
              rm -f "$DEST" || exit 86
              if [ -f "$SRC" ]; then
                  cp "$SRC" "$DEST" || exit 87
                  chmod 644 "$DEST" 2>/dev/null || true
                  [ -s "$DEST" ] || exit 88
              fi
          done < "$ROOT/syswow64-targets.txt"

          exit 0
          SHRESTORE

          chmod 755 "$BASE_ROOT/restore-known-good-2.2-runtime.sh"
          sh -n "$BASE_ROOT/restore-known-good-2.2-runtime.sh"

          # ----------------------------------------------------------
          # Build-time recovery simulation.
          # Deliberately contaminate a copy of the exact 2.2 prefix with the
          # complete reference runtime payload, then run the exact Android-side
          # recovery helper and compare every touched filename against 2.2.
          # ----------------------------------------------------------
          cp -a runtime_baseline_prefix_2_5 runtime_recovery_test_2_5
          TEST_DRIVE_C="$(find runtime_recovery_test_2_5 -type d -name drive_c -print -quit)"
          test -n "$TEST_DRIVE_C"
          TEST_PREFIX="${TEST_DRIVE_C%/drive_c}"

          mkdir -p "$TEST_DRIVE_C/windows/system32" "$TEST_DRIVE_C/windows/syswow64"

          while IFS= read -r DLL; do
            test -s "$PAYLOAD/system32/$DLL"
            cp -f "$PAYLOAD/system32/$DLL" "$TEST_DRIVE_C/windows/system32/$DLL"
          done < "$BASE_ROOT/system32-targets.txt"

          while IFS= read -r DLL; do
            test -s "$PAYLOAD/syswow64/$DLL"
            cp -f "$PAYLOAD/syswow64/$DLL" "$TEST_DRIVE_C/windows/syswow64/$DLL"
          done < "$BASE_ROOT/syswow64-targets.txt"

          "$BASE_ROOT/restore-known-good-2.2-runtime.sh" "$TEST_PREFIX" "$BASE_ROOT"

          while IFS= read -r DLL; do
            EXPECTED="$BASE_DRIVE_C/windows/system32/$DLL"
            GOT="$TEST_DRIVE_C/windows/system32/$DLL"
            if [ -f "$EXPECTED" ]; then
              test -f "$GOT"
              cmp -s "$EXPECTED" "$GOT"
            else
              test ! -e "$GOT"
            fi
          done < "$BASE_ROOT/system32-targets.txt"

          while IFS= read -r DLL; do
            EXPECTED="$BASE_DRIVE_C/windows/syswow64/$DLL"
            GOT="$TEST_DRIVE_C/windows/syswow64/$DLL"
            if [ -f "$EXPECTED" ]; then
              test -f "$GOT"
              cmp -s "$EXPECTED" "$GOT"
            else
              test ! -e "$GOT"
            fi
          done < "$BASE_ROOT/syswow64-targets.txt"

          echo "2.5 runtime recovery helper simulation PASSED"

          # Preserve the proven 2.2 registry-only wrapper as the inner Wine
          # launcher. The 2.5 outer wrapper performs only runtime recovery.
          mv "$ROOT/bin/wine" "$ROOT/bin/wine.2.2-registry"
          chmod 755 "$ROOT/bin/wine.2.2-registry"

          cat > "$ROOT/bin/wine" <<'SHWRAP25'
          #!/bin/sh
          # GameNative MapleStory known-good-state recovery shim (2.5).
          # Restore the exact 2.2 runtime-file baseline before ANY Wine launch,
          # then hand off to the unchanged 2.2 registry-recovery wrapper.

          # Do not use command substitution. GameNative's LD_PRELOAD evshim
          # writes startup messages to stdout and can corrupt captured output.
          case "$0" in
              /*)
                  SCRIPT_PATH="$0"
                  ;;
              */*)
                  SCRIPT_PATH="$PWD/$0"
                  ;;
              *)
                  echo "[GN-MS-2.5] ERROR: Wine wrapper was invoked without a path: $0" >&2
                  exit 50
                  ;;
          esac

          SCRIPT_DIR="${SCRIPT_PATH%/*}"
          ROOT_DIR="${SCRIPT_DIR%/*}"
          INNER_WINE="$SCRIPT_DIR/wine.2.2-registry"
          BASE_ROOT="$ROOT_DIR/share/wine/maplestory_runtime_recovery_2_5"
          RESTORE_HELPER="$BASE_ROOT/restore-known-good-2.2-runtime.sh"

          if [ ! -x "$INNER_WINE" ]; then
              echo "[GN-MS-2.5] ERROR: 2.2 registry wrapper missing: $INNER_WINE" >&2
              exit 52
          fi

          PREFIX="${WINEPREFIX:-}"

          if [ -n "$PREFIX" ]; then
              MARKER="$PREFIX/.gamenative-maplestory-runtime-recovery-2.5"

              if [ ! -x "$RESTORE_HELPER" ]; then
                  echo "[GN-MS-2.5] ERROR: packaged runtime recovery helper missing" >&2
                  exit 80
              fi

              # Intentionally restore on EVERY top-level Wine invocation.
              # There is no test/app-ID/marker gate, so a later failed experiment
              # cannot leave a stale marker that suppresses recovery.
              echo "[GN-MS-2.5] Restoring exact known-good 2.2 runtime-file baseline in $PREFIX" >&2
              "$RESTORE_HELPER" "$PREFIX" "$BASE_ROOT" || exit $?

              # Remove only experiment markers whose on-disk state has now
              # explicitly been undone by this recovery.
              rm -f \
                "$PREFIX/.gamenative-maplestory-full-vc-runtime-2.4" \
                "$PREFIX/.gamenative-maplestory-vc-runtime-1.7" \
                "$PREFIX/.gamenative-maplestory-full-vc-runtime-1.8" \
                "$PREFIX/.gamenative-maplestory-full-vc-runtime-1.9" \
                2>/dev/null || true

              {
                  echo "GameNative MapleStory runtime recovery 2.5"
                  echo "RecoveredTo=known-good 2.2 runtime-file baseline"
                  echo "System32Targets=12"
                  echo "SysWOW64Targets=11"
                  echo "DllOverrides=handled by inner 2.2 registry recovery"
                  echo "WineInf=unchanged"
                  echo "Esync=unchanged"
              } > "$MARKER" || exit 89

              echo "[GN-MS-2.5] Runtime recovery complete; exact 2.2 file state restored" >&2
          fi

          exec "$INNER_WINE" "$@"
          SHWRAP25

          chmod 755 "$ROOT/bin/wine"

          echo
          echo "=== Validate 2.5 outer recovery wrapper ==="

          test -f "$ROOT/bin/wine"
          test ! -L "$ROOT/bin/wine"
          test -x "$ROOT/bin/wine"
          test -f "$ROOT/bin/wine.2.2-registry"
          test ! -L "$ROOT/bin/wine.2.2-registry"
          test -x "$ROOT/bin/wine.2.2-registry"
          test -L "$ROOT/bin/wine.real"
          test -x "$ROOT/bin/wine.real"
          test -x "$BASE_ROOT/restore-known-good-2.2-runtime.sh"

          sh -n "$ROOT/bin/wine"
          sh -n "$ROOT/bin/wine.2.2-registry"
          sh -n "$BASE_ROOT/restore-known-good-2.2-runtime.sh"

          grep -Fq 'Restoring exact known-good 2.2 runtime-file baseline' "$ROOT/bin/wine"
          grep -Fq 'Runtime recovery complete; exact 2.2 file state restored' "$ROOT/bin/wine"
          grep -Fq 'exec "$INNER_WINE" "$@"' "$ROOT/bin/wine"
          grep -Fq 'Registry recovery complete; VC DllOverrides match Proton 11 baseline' "$ROOT/bin/wine.2.2-registry"
          grep -Fq 'exec "$REAL_WINE" "$@"' "$ROOT/bin/wine.2.2-registry"

          if grep -Fq 'TestD3D.exe' "$ROOT/bin/wine"; then
              echo "ERROR: 2.5 runtime recovery must not depend on TestD3D detection"
              exit 1
          fi

          if grep -Fq 'SteamAppId' "$ROOT/bin/wine" || grep -Fq 'SteamGameId' "$ROOT/bin/wine"; then
              echo "ERROR: 2.5 runtime recovery must not depend on Steam app detection"
              exit 1
          fi

          if grep -Fq 'WINEDLLOVERRIDES=' "$ROOT/bin/wine" || \
             grep -Fq 'export WINEDLLOVERRIDES' "$ROOT/bin/wine" || \
             grep -Fq 'WINEDLLOVERRIDES=' "$ROOT/bin/wine.2.2-registry" || \
             grep -Fq 'export WINEDLLOVERRIDES' "$ROOT/bin/wine.2.2-registry"; then
              echo "ERROR: 2.5 must not change WINEDLLOVERRIDES"
              exit 1
          fi

          if grep -Fq 'WINEESYNC=' "$ROOT/bin/wine" || \
             grep -Fq 'export WINEESYNC' "$ROOT/bin/wine" || \
             grep -Fq 'WINEESYNC=' "$ROOT/bin/wine.2.2-registry" || \
             grep -Fq 'export WINEESYNC' "$ROOT/bin/wine.2.2-registry"; then
              echo "ERROR: 2.5 must not change esync"
              exit 1
          fi

          if grep -Fq 'regedit /S' "$ROOT/bin/wine" || \
             grep -Fq 'regedit /S' "$ROOT/bin/wine.2.2-registry"; then
              echo "ERROR: nested regedit leaked into 2.5"
              exit 1
          fi

          if grep -Eq '(^|[[:space:]])cmp([[:space:]]|$)' "$ROOT/bin/wine" || \
             grep -Eq '(^|[[:space:]])cmp([[:space:]]|$)' "$BASE_ROOT/restore-known-good-2.2-runtime.sh"; then
              echo "ERROR: Android-side 2.5 recovery depends on cmp"
              exit 1
          fi

          if grep -Fq 'SCRIPT_DIR=$(' "$ROOT/bin/wine" || \
             grep -Fq 'ROOT_DIR=$(' "$ROOT/bin/wine"; then
              echo "ERROR: 2.5 outer wrapper contains stdout-capturing path command substitution"
              exit 1
          fi

          echo
          echo "2.5 unconditional runtime-file recovery wrapper PASSED"

      # ============================================================
      # 10. CREATE NEW 2.5 GAMENATIVE PROFILE
      # ============================================================

      - name: Generate GameNative Proton profile
        shell: bash
        run: |
          set -euxo pipefail

          cat > profile.json <<'EOF'
          {
            "type": "Proton",
            "versionName": "11.0-2.5-arm64ec",
            "versionCode": 2,
            "description": "Proton 11 ARM64EC - MapleStory 2.5 pure recovery: unconditionally restore exact known-good 2.2 VC runtime-file baseline, then retain 2.2 DllOverrides recovery; no new compatibility experiment",
            "files": [],
            "wine": {
              "binPath": "bin",
              "libPath": "lib",
              "prefixPack": "prefixPack.txz"
            }
          }
          EOF

          cat profile.json

          grep -Fq \
            '"versionName": "11.0-2.5-arm64ec"' \
            profile.json

          echo "Profile validation PASSED"

      # ============================================================
      # 11. BUILD THE NEW WCP
      # ============================================================

      - name: Build WCP
        shell: bash
        run: |
          set -euxo pipefail

          ROOT="$CHECKPOINT_ROOT"

          cp prefixPack.txz \
            "$ROOT/prefixPack.txz"

          cp profile.json \
            "$ROOT/profile.json"

          cd "$ROOT"

          tar cJf \
            "$GITHUB_WORKSPACE/$WCP_NAME" \
            bin \
            lib \
            share \
            prefixPack.txz \
            profile.json

          ls -lh "$GITHUB_WORKSPACE/$WCP_NAME"

      # ============================================================
      # 12. VALIDATE FINAL 2.5 WCP
      # ============================================================

      - name: Validate final WCP
        shell: bash
        run: |
          set -euxo pipefail

          WCP="$GITHUB_WORKSPACE/$WCP_NAME"

          test -f "$WCP"
          test -s "$WCP"
          xz -t "$WCP"

          tar tJf "$WCP" > wcp-files.txt

          for f in \
            bin/wine \
            bin/wine.2.2-registry \
            bin/wine.real \
            bin/wineserver \
            lib/wine/aarch64-unix/wine \
            share/wine/maplestory_registry_recovery_2_2/baseline-values.txt \
            share/wine/maplestory_registry_recovery_2_2/baseline-status.txt \
            share/wine/maplestory_registry_recovery_2_2/repair-user-reg.sh \
            share/wine/maplestory_runtime_recovery_2_5/system32-targets.txt \
            share/wine/maplestory_runtime_recovery_2_5/syswow64-targets.txt \
            share/wine/maplestory_runtime_recovery_2_5/restore-known-good-2.2-runtime.sh \
            prefixPack.txz \
            profile.json
          do
            grep -Fxq "$f" wcp-files.txt
            echo "FOUND: $f"
          done

          tar xJOf "$WCP" profile.json > packaged-profile.json
          grep -Fq \
            '"versionName": "11.0-2.5-arm64ec"' \
            packaged-profile.json

          rm -rf wcp_validation
          mkdir -p wcp_validation

          tar xJf "$WCP" \
            -C wcp_validation \
            bin/wine \
            bin/wine.2.2-registry \
            bin/wine.real \
            bin/wineserver \
            lib/wine/aarch64-unix/wine \
            share/wine/maplestory_registry_recovery_2_2/baseline-values.txt \
            share/wine/maplestory_registry_recovery_2_2/baseline-status.txt \
            share/wine/maplestory_registry_recovery_2_2/repair-user-reg.sh \
            share/wine/maplestory_runtime_recovery_2_5

          test -f wcp_validation/bin/wine
          test ! -L wcp_validation/bin/wine
          test -x wcp_validation/bin/wine
          test -f wcp_validation/bin/wine.2.2-registry
          test ! -L wcp_validation/bin/wine.2.2-registry
          test -x wcp_validation/bin/wine.2.2-registry
          test -L wcp_validation/bin/wine.real
          test -e wcp_validation/bin/wine.real
          test -x wcp_validation/bin/wine.real
          test "$(readlink wcp_validation/bin/wine.real)" = "../lib/wine/aarch64-unix/wine"
          test -x wcp_validation/bin/wineserver
          test -x wcp_validation/lib/wine/aarch64-unix/wine
          test -x wcp_validation/share/wine/maplestory_registry_recovery_2_2/repair-user-reg.sh
          test -x wcp_validation/share/wine/maplestory_runtime_recovery_2_5/restore-known-good-2.2-runtime.sh

          sh -n wcp_validation/bin/wine
          sh -n wcp_validation/bin/wine.2.2-registry
          sh -n wcp_validation/share/wine/maplestory_registry_recovery_2_2/repair-user-reg.sh
          sh -n wcp_validation/share/wine/maplestory_runtime_recovery_2_5/restore-known-good-2.2-runtime.sh

          grep -Fq 'Restoring exact known-good 2.2 runtime-file baseline' wcp_validation/bin/wine
          grep -Fq 'Runtime recovery complete; exact 2.2 file state restored' wcp_validation/bin/wine
          grep -Fq 'exec "$INNER_WINE" "$@"' wcp_validation/bin/wine
          grep -Fq 'Restoring VC DllOverrides baseline' wcp_validation/bin/wine.2.2-registry
          grep -Fq 'Registry recovery complete; VC DllOverrides match Proton 11 baseline' wcp_validation/bin/wine.2.2-registry
          grep -Fq 'exec "$REAL_WINE" "$@"' wcp_validation/bin/wine.2.2-registry

          if grep -Fq 'TestD3D.exe' wcp_validation/bin/wine; then
              echo "ERROR: packaged 2.5 runtime recovery depends on TestD3D detection"
              exit 1
          fi

          if grep -Fq 'SteamAppId' wcp_validation/bin/wine || \
             grep -Fq 'SteamGameId' wcp_validation/bin/wine; then
              echo "ERROR: packaged 2.5 runtime recovery depends on Steam app detection"
              exit 1
          fi

          if grep -Fq 'WINEDLLOVERRIDES=' wcp_validation/bin/wine || \
             grep -Fq 'export WINEDLLOVERRIDES' wcp_validation/bin/wine || \
             grep -Fq 'WINEDLLOVERRIDES=' wcp_validation/bin/wine.2.2-registry || \
             grep -Fq 'export WINEDLLOVERRIDES' wcp_validation/bin/wine.2.2-registry; then
              echo "ERROR: packaged 2.5 wrapper changes WINEDLLOVERRIDES"
              exit 1
          fi

          if grep -Fq 'WINEESYNC=' wcp_validation/bin/wine || \
             grep -Fq 'export WINEESYNC' wcp_validation/bin/wine || \
             grep -Fq 'WINEESYNC=' wcp_validation/bin/wine.2.2-registry || \
             grep -Fq 'export WINEESYNC' wcp_validation/bin/wine.2.2-registry; then
              echo "ERROR: packaged 2.5 wrapper changes esync"
              exit 1
          fi

          if grep -Fq 'regedit /S' wcp_validation/bin/wine || \
             grep -Fq 'regedit /S' wcp_validation/bin/wine.2.2-registry; then
              echo "ERROR: packaged 2.5 wrapper contains nested regedit"
              exit 1
          fi

          if grep -Eq '(^|[[:space:]])cmp([[:space:]]|$)' wcp_validation/bin/wine || \
             grep -Eq '(^|[[:space:]])cmp([[:space:]]|$)' wcp_validation/share/wine/maplestory_runtime_recovery_2_5/restore-known-good-2.2-runtime.sh; then
              echo "ERROR: packaged Android-side 2.5 recovery depends on cmp"
              exit 1
          fi

          echo "=== Packaged upstream DllOverrides baseline ==="
          cat wcp_validation/share/wine/maplestory_registry_recovery_2_2/baseline-status.txt

          # No wine.inf recovery/deployment mechanism is allowed.
          grep -Fxq 'share/wine/wine.inf' wcp-files.txt
          tar xJOf "$WCP" share/wine/wine.inf > packaged-wine.inf

          if grep -Fq 'GameNativeMapleStory216150Recovery' packaged-wine.inf; then
              echo "ERROR: live registry recovery leaked into wine.inf"
              exit 1
          fi

          if grep -Fq 'MapleVCRuntime64' packaged-wine.inf || \
             grep -Fq 'MapleVCRuntime32' packaged-wine.inf; then
              echo "ERROR: broken 1.4 runtime CopyFiles integration leaked into 2.5"
              exit 1
          fi

          # The packaged prefix itself must remain exactly the controlled 2.2
          # state: MapleStory registry fixes plus only vcruntime140_threads.dll
          # added to the untouched Proton 11 VC runtime baseline.
          tar xJOf "$WCP" prefixPack.txz > packaged-prefix.txz
          rm -rf packaged_prefix packaged_base_prefix
          mkdir -p packaged_prefix packaged_base_prefix
          tar xJf packaged-prefix.txz -C packaged_prefix
          tar xJf prefixPack-base.txz -C packaged_base_prefix

          PREFIX_DRIVE_C="$(find packaged_prefix -type d -name drive_c -print -quit)"
          BASE_DRIVE_C="$(find packaged_base_prefix -type d -name drive_c -print -quit)"
          USER_REG="$(find packaged_prefix -type f -name user.reg -print -quit)"
          SYSTEM_REG="$(find packaged_prefix -type f -name system.reg -print -quit)"

          test -n "$PREFIX_DRIVE_C"
          test -n "$BASE_DRIVE_C"
          test -n "$USER_REG"
          test -n "$SYSTEM_REG"

          grep -Fq '"UseTakeFocus"="N"' "$USER_REG"
          grep -Fq '"UseLinuxInputEvents"="Y"' "$USER_REG"
          grep -Fq '"KeyboardUseNonExclusive"="Y"' "$USER_REG"
          grep -Fq '"MouseUseNonExclusive"="Y"' "$USER_REG"
          grep -Fq '"Version"="win10"' "$USER_REG"
          grep -Fq '"cb_access_map_w"=dword:00000001' "$USER_REG"
          grep -Fq '"CSMT"="disabled"' "$USER_REG"
          grep -Fq '"URL Protocol"=""' "$SYSTEM_REG"

          SYS32_LIST='concrt140.dll msvcp140.dll msvcp140_1.dll msvcp140_2.dll msvcp140_atomic_wait.dll msvcp140_codecvt_ids.dll ucrtbase.dll vccorlib140.dll vcomp140.dll vcruntime140.dll vcruntime140_1.dll'
          WOW64_LIST='concrt140.dll msvcp140.dll msvcp140_1.dll msvcp140_2.dll msvcp140_atomic_wait.dll msvcp140_codecvt_ids.dll ucrtbase.dll vccorlib140.dll vcomp140.dll vcruntime140.dll'

          for DLL in $SYS32_LIST; do
            BASE="$BASE_DRIVE_C/windows/system32/$DLL"
            GOT="$PREFIX_DRIVE_C/windows/system32/$DLL"
            if [ -f "$BASE" ]; then
              test -f "$GOT"
              cmp -s "$BASE" "$GOT"
            else
              test ! -e "$GOT"
            fi
          done

          for DLL in $WOW64_LIST; do
            BASE="$BASE_DRIVE_C/windows/syswow64/$DLL"
            GOT="$PREFIX_DRIVE_C/windows/syswow64/$DLL"
            if [ -f "$BASE" ]; then
              test -f "$GOT"
              cmp -s "$BASE" "$GOT"
            else
              test ! -e "$GOT"
            fi
          done

          cmp -s \
            "$GITHUB_WORKSPACE/maplestory_reference/files/vc_runtime/system32/vcruntime140_threads.dll" \
            "$PREFIX_DRIVE_C/windows/system32/vcruntime140_threads.dll"

          cmp -s \
            "$GITHUB_WORKSPACE/maplestory_reference/files/vc_runtime/syswow64/vcruntime140_threads.dll" \
            "$PREFIX_DRIVE_C/windows/syswow64/vcruntime140_threads.dll"

          # Validate the packaged 2.5 baseline payload against packaged 2.2.
          RUNTIME_BASE="wcp_validation/share/wine/maplestory_runtime_recovery_2_5"

          while IFS= read -r DLL; do
            EXPECTED="$PREFIX_DRIVE_C/windows/system32/$DLL"
            GOT="$RUNTIME_BASE/system32/$DLL"
            if [ -f "$EXPECTED" ]; then
              test -f "$GOT"
              cmp -s "$EXPECTED" "$GOT"
            else
              test ! -e "$GOT"
            fi
          done < "$RUNTIME_BASE/system32-targets.txt"

          while IFS= read -r DLL; do
            EXPECTED="$PREFIX_DRIVE_C/windows/syswow64/$DLL"
            GOT="$RUNTIME_BASE/syswow64/$DLL"
            if [ -f "$EXPECTED" ]; then
              test -f "$GOT"
              cmp -s "$EXPECTED" "$GOT"
            else
              test ! -e "$GOT"
            fi
          done < "$RUNTIME_BASE/syswow64-targets.txt"

          echo "Packaged 2.5 known-good-state validation PASSED"

          sha256sum "$WCP"

          echo "=========================================="
          echo "2.5 WCP validation PASSED"
          echo "=========================================="

      # ============================================================
      # 13. UPLOAD 2.5 WCP
      # ============================================================

      - name: Upload MapleStory 2.5 recovery WCP
        uses: actions/upload-artifact@v4
        with:
          name: proton-11.0-2.5-arm64ec
          path: proton-11.0-2.5-arm64ec.wcp
          if-no-files-found: error
          retention-days: 30
