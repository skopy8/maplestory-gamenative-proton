name: Package MapleStory ARM64EC Checkpoint

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Workflow run ID containing compiled-proton-arm64ec-checkpoint"
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04

    steps:
      - name: Download compiled ARM64EC checkpoint
        uses: actions/download-artifact@v4
        with:
          name: compiled-proton-arm64ec-checkpoint
          path: checkpoint
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}

      - name: Inspect and extract checkpoint
        shell: bash
        run: |
          set -euxo pipefail

          echo "=== Everything downloaded ==="
          find checkpoint -maxdepth 3 -printf '%M %s %p\n' | sort

          echo
          echo "=== File types ==="
          find checkpoint -type f -print0 | while IFS= read -r -d '' f; do
            echo "---- $f"
            file "$f"
          done

          mkdir -p checkpoint_extracted

          # First see whether the artifact already contains bin/lib/share.
          ROOT=""

          if [ -d "checkpoint/bin" ] &&
             [ -d "checkpoint/lib" ] &&
             [ -d "checkpoint/share" ]; then

            ROOT="$GITHUB_WORKSPACE/checkpoint"

          else
            echo
            echo "=== Looking for archive inside artifact ==="

            ARCHIVE="$(find checkpoint -type f | head -n 1 || true)"

            if [ -z "$ARCHIVE" ]; then
              echo "ERROR: Artifact contains no files."
              exit 1
            fi

            echo "Candidate archive:"
            echo "$ARCHIVE"

            TYPE="$(file -b "$ARCHIVE")"
            echo "Detected type:"
            echo "$TYPE"

            case "$TYPE" in
              *"XZ compressed data"*)
                echo "Extracting XZ-compressed tar archive..."
                tar -xJf "$ARCHIVE" -C checkpoint_extracted
                ;;

              *"Zstandard compressed data"*)
                echo "Extracting Zstandard-compressed tar archive..."
                tar --zstd -xf "$ARCHIVE" -C checkpoint_extracted
                ;;

              *"gzip compressed data"*)
                echo "Extracting gzip-compressed tar archive..."
                tar -xzf "$ARCHIVE" -C checkpoint_extracted
                ;;

              *"POSIX tar archive"*)
                echo "Extracting plain tar archive..."
                tar -xf "$ARCHIVE" -C checkpoint_extracted
                ;;

              *"Zip archive data"*)
                echo "Extracting ZIP archive..."
                unzip -q "$ARCHIVE" -d checkpoint_extracted
                ;;

              *)
                echo "ERROR: Don't know how to extract:"
                echo "$TYPE"
                exit 1
                ;;
            esac

            echo
            echo "=== Extracted structure ==="

            find checkpoint_extracted -maxdepth 4 \
              -printf '%M %s %p\n' \
              > extracted-structure.txt

            sort extracted-structure.txt \
              > extracted-structure-sorted.txt

            head -300 extracted-structure-sorted.txt

            echo
            echo "=== Searching extracted checkpoint for bin/lib/share ==="

            while IFS= read -r candidate; do
              candidate="$(dirname "$candidate")"

              if [ -d "$candidate/lib" ] &&
                 [ -d "$candidate/share" ]; then
                ROOT="$GITHUB_WORKSPACE/$candidate"
                break
              fi
            done < <(find checkpoint_extracted -type d -name bin)
          fi

          if [ -z "$ROOT" ]; then
            echo
            echo "ERROR: Could not locate checkpoint root containing:"
            echo "  bin/"
            echo "  lib/"
            echo "  share/"
            exit 1
          fi

          echo
          echo "=== FOUND CHECKPOINT ROOT ==="
          echo "$ROOT"

          echo "CHECKPOINT_ROOT=$ROOT" >> "$GITHUB_ENV"

          echo
          echo "=== Wine bin directory ==="
          ls -lah "$ROOT/bin"

          echo
          echo "=== Wine-related files ==="
          find "$ROOT/bin" -maxdepth 1 \
            \( -name 'wine*' -o -name 'wineserver*' \) \
            -printf '%M %s %p -> %l\n' |
            sort

      - name: Repair executable permissions
        shell: bash
        run: |
          set -euxo pipefail

          ROOT="$CHECKPOINT_ROOT"

          # GitHub Actions artifacts normally restore files as 0644.
          # Wine launchers must be executable.
          find "$ROOT/bin" -maxdepth 1 -type f -exec chmod 755 {} \;

          echo "=== bin contents AFTER repair ==="
          ls -lah "$ROOT/bin"

      - name: Download ARM64EC prefix
        shell: bash
        run: |
          set -euxo pipefail

          wget \
            https://github.com/GameNative/bionic-prefix-files/raw/main/prefixPack-arm64ec.txz \
            -O prefixPack.txz

          test -s prefixPack.txz

      - name: Generate GameNative Proton profile
        shell: bash
        run: |
          set -euxo pipefail

          cat > profile.json <<'EOF'
          {
            "type": "Proton",
            "versionName": "11.0-1-maplestory-arm64ec",
            "versionCode": 2,
            "description": "Proton 11.0-1 ARM64EC - MapleStory SPI and CharPrev compatibility patches",
            "files": [],
            "wine": {
              "binPath": "bin",
              "libPath": "lib",
              "prefixPack": "prefixPack.txz"
            }
          }
          EOF

          cat profile.json

      - name: Build WCP
        shell: bash
        run: |
          set -euxo pipefail

          ROOT="$CHECKPOINT_ROOT"

          cp prefixPack.txz "$ROOT/"
          cp profile.json "$ROOT/"

          cd "$ROOT"

          tar cJf \
            "$GITHUB_WORKSPACE/proton-11.0-1-maplestory-arm64ec.wcp" \
            bin \
            lib \
            share \
            prefixPack.txz \
            profile.json

          echo "=== Built WCP ==="
          ls -lh "$GITHUB_WORKSPACE/proton-11.0-1-maplestory-arm64ec.wcp"

      - name: Validate Wine launchers
        shell: bash
        run: |
          set -euxo pipefail

          WCP="$GITHUB_WORKSPACE/proton-11.0-1-maplestory-arm64ec.wcp"

          test -f "$WCP"

          rm -rf wcp-validation
          mkdir -p wcp-validation

          echo "=== Generate archive listing ==="
          tar tJf "$WCP" > wcp-files.txt

          echo
          echo "=== Check required Wine entries ==="

          grep -Fxq 'bin/wine' wcp-files.txt
          echo "FOUND: bin/wine"

          grep -Fxq 'bin/wineserver' wcp-files.txt
          echo "FOUND: bin/wineserver"

          grep -Fxq 'lib/wine/aarch64-unix/wine' wcp-files.txt
          echo "FOUND: lib/wine/aarch64-unix/wine"

          echo
          echo "=== Extract launcher and target ==="

          tar xJf "$WCP" \
            -C wcp-validation \
            bin/wine \
            bin/wineserver \
            lib/wine/aarch64-unix/wine

          echo
          echo "=== Extracted files ==="

          ls -l \
            wcp-validation/bin/wine \
            wcp-validation/bin/wineserver \
            wcp-validation/lib/wine/aarch64-unix/wine

          echo
          echo "=== Validate wine symlink ==="

          test -L wcp-validation/bin/wine

          WINE_TARGET="$(readlink wcp-validation/bin/wine)"
          echo "Target: $WINE_TARGET"

          if [ "$WINE_TARGET" != "../lib/wine/aarch64-unix/wine" ]; then
            echo "ERROR: Unexpected bin/wine target: $WINE_TARGET"
            exit 1
          fi

          test -e wcp-validation/bin/wine
          echo "bin/wine resolves successfully"

          test -x wcp-validation/bin/wine
          echo "bin/wine executable"

          test -x wcp-validation/bin/wineserver
          echo "bin/wineserver executable"

          test -x wcp-validation/lib/wine/aarch64-unix/wine
          echo "Wine target executable"

          echo
          echo "=== File types ==="

          file wcp-validation/bin/wineserver
          file wcp-validation/lib/wine/aarch64-unix/wine

          echo
          echo "Wine launcher validation PASSED"

      - name: Validate final WCP
        shell: bash
        run: |
          set -euxo pipefail

          WCP="$GITHUB_WORKSPACE/proton-11.0-1-maplestory-arm64ec.wcp"

          echo "=== WCP size ==="
          ls -lh "$WCP"

          echo
          echo "=== Test archive integrity ==="
          xz -t "$WCP"

          echo
          echo "=== Generate archive lists ==="
          tar tJf "$WCP" > wcp-files.txt
          tar tvJf "$WCP" > wcp-files-long.txt

          echo
          echo "=== Profile inside WCP ==="
          tar xJOf "$WCP" profile.json

          echo
          echo "=== Required files ==="

          for f in \
            bin/wine \
            bin/wineserver \
            lib/wine/aarch64-unix/wine \
            prefixPack.txz \
            profile.json
          do
            grep -Fxq "$f" wcp-files.txt
            echo "FOUND: $f"
          done

          echo
          echo "=== Launcher entries ==="

          grep -E \
            'bin/(wine|wineserver)|lib/wine/aarch64-unix/wine' \
            wcp-files-long.txt || true

          echo
          echo "=== Archive statistics ==="
          echo "Total entries: $(wc -l < wcp-files.txt)"
          du -h "$WCP"

          echo
          echo "WCP validation PASSED"

      - name: Upload corrected WCP
        uses: actions/upload-artifact@v4
        with:
          name: proton-11.0-1-maplestory-arm64ec
          path: proton-11.0-1-maplestory-arm64ec.wcp
          if-no-files-found: error
          retention-days: 30
