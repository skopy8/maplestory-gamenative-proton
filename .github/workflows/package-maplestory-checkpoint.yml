name: Package MapleStory ARM64EC Direct Runtime Test 1.6

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Original workflow run ID containing compiled-proton-arm64ec-checkpoint"
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04

    env:
      CUSTOM_VERSION: "11.0-1.6-arm64ec"
      WCP_NAME: "proton-11.0-1.6-arm64ec.wcp"
      RUNTIME_COMMIT: "181cd74cf51db5fd2563ec81359a94db9a2ada32"

    steps:
      # ============================================================
      # 1. DOWNLOAD OUR ALREADY-COMPILED PATCHED PROTON
      # ============================================================

      - name: Download compiled ARM64EC checkpoint
        uses: actions/download-artifact@v4
        with:
          name: compiled-proton-arm64ec-checkpoint
          path: checkpoint
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}

      # ============================================================
      # 2. RESTORE COMPILED PROTON
      #
      # The original checkpoint was deliberately wrapped in a tar
      # so executable permissions and symlinks survive GitHub
      # Actions artifact storage.
      # ============================================================

      - name: Restore compiled Proton checkpoint
        shell: bash
        run: |
          set -euxo pipefail

          CHECKPOINT="checkpoint/compiled-proton-checkpoint.tar"

          echo "=== Checkpoint artifact ==="
          ls -lh checkpoint

          test -f "$CHECKPOINT"

          rm -rf checkpoint_extracted
          mkdir -p checkpoint_extracted

          tar -xf "$CHECKPOINT" \
            -C checkpoint_extracted

          ROOT="$GITHUB_WORKSPACE/checkpoint_extracted"

          test -d "$ROOT/bin"
          test -d "$ROOT/lib"
          test -d "$ROOT/share"

          echo "CHECKPOINT_ROOT=$ROOT" >> "$GITHUB_ENV"

          echo
          echo "=== Restored Proton root ==="
          ls -lah "$ROOT"

          echo
          echo "=== Wine launchers ==="
          ls -lah "$ROOT/bin"

      # ============================================================
      # 3. VALIDATE / RESTORE THE WINE LAUNCHER
      # ============================================================

      - name: Validate checkpoint Wine runtime
        shell: bash
        run: |
          set -euxo pipefail

          ROOT="$CHECKPOINT_ROOT"

          echo "=== bin/wine ==="

          test -L "$ROOT/bin/wine"

          WINE_TARGET="$(readlink "$ROOT/bin/wine")"

          echo "Target: $WINE_TARGET"

          if [ "$WINE_TARGET" != "../lib/wine/aarch64-unix/wine" ]; then
            echo "ERROR: Unexpected bin/wine target"
            exit 1
          fi

          test -f "$ROOT/lib/wine/aarch64-unix/wine"
          test -f "$ROOT/bin/wineserver"

          # Restore executable bits just in case.
          chmod 755 "$ROOT/lib/wine/aarch64-unix/wine"
          chmod 755 "$ROOT/bin/wineserver"

          find "$ROOT/bin" \
            -maxdepth 1 \
            -type f \
            -name 'wine*' \
            -exec chmod 755 {} \;

          test -e "$ROOT/bin/wine"
          test -x "$ROOT/bin/wine"
          test -x "$ROOT/bin/wineserver"
          test -x "$ROOT/lib/wine/aarch64-unix/wine"

          echo
          echo "=== Runtime files ==="

          ls -l \
            "$ROOT/bin/wine" \
            "$ROOT/bin/wineserver" \
            "$ROOT/lib/wine/aarch64-unix/wine"

          echo
          echo "Checkpoint Wine runtime validation PASSED"

      # ============================================================
      # 4. CHECK OUT THE EXACT VC++ RUNTIME PAYLOAD USED BY THE
      #    MAPLESTORY LINUX REFERENCE SETUP
      #
      # Pin the source commit so this controlled test cannot silently
      # change if the upstream repository changes later.
      # ============================================================

      - name: Checkout pinned MapleStory VC runtime payload
        uses: actions/checkout@v4
        with:
          repository: oldschoola/linux_maplestory
          ref: ${{ env.RUNTIME_COMMIT }}
          path: maplestory_reference
          sparse-checkout: |
            files/vc_runtime
            patches/13-apply-runtime-file-patches.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Validate pinned VC runtime payload
        shell: bash
        run: |
          set -euxo pipefail

          ROOT="$GITHUB_WORKSPACE/maplestory_reference/files/vc_runtime"

          SYS32=(
            concrt140.dll
            msvcp140.dll
            msvcp140_1.dll
            msvcp140_2.dll
            msvcp140_atomic_wait.dll
            msvcp140_codecvt_ids.dll
            ucrtbase.dll
            vccorlib140.dll
            vcomp140.dll
            vcruntime140.dll
            vcruntime140_1.dll
            vcruntime140_threads.dll
          )

          WOW64=(
            concrt140.dll
            msvcp140.dll
            msvcp140_1.dll
            msvcp140_2.dll
            msvcp140_atomic_wait.dll
            msvcp140_codecvt_ids.dll
            ucrtbase.dll
            vccorlib140.dll
            vcomp140.dll
            vcruntime140.dll
            vcruntime140_threads.dll
          )

          for dll in "${SYS32[@]}"; do
            test -s "$ROOT/system32/$dll"
          done

          for dll in "${WOW64[@]}"; do
            test -s "$ROOT/syswow64/$dll"
          done

          echo "=== Runtime payload commit ==="
          git -C "$GITHUB_WORKSPACE/maplestory_reference" rev-parse HEAD
          test "$(git -C "$GITHUB_WORKSPACE/maplestory_reference" rev-parse HEAD)" = "$RUNTIME_COMMIT"

          echo
          echo "=== system32 payload ==="
          for dll in "${SYS32[@]}"; do
            file "$ROOT/system32/$dll"
            sha256sum "$ROOT/system32/$dll"
          done

          echo
          echo "=== syswow64 payload ==="
          for dll in "${WOW64[@]}"; do
            file "$ROOT/syswow64/$dll"
            sha256sum "$ROOT/syswow64/$dll"
          done

          echo
          echo "Pinned VC runtime payload validation PASSED"

      # ============================================================
      # 5. DOWNLOAD THE CORRECT PROTON 11 ARM64EC PREFIX
      #
      # IMPORTANT:
      # Use prefixPack-arm64ec-11.txz.
      # Do NOT use the generic prefixPack-arm64ec.txz.
      # ============================================================

      - name: Download GameNative Proton 11 ARM64EC prefix
        shell: bash
        run: |
          set -euxo pipefail

          wget \
            https://github.com/GameNative/bionic-prefix-files/raw/main/prefixPack-arm64ec-11.txz \
            -O prefixPack-base.txz

          test -s prefixPack-base.txz

          echo
          echo "=== Base prefix pack ==="

          ls -lh prefixPack-base.txz
          file prefixPack-base.txz
          sha256sum prefixPack-base.txz

      # ============================================================
      # 6. APPLY THE MAPLESTORY REGISTRY FIXES
      #
      # Keep the registry layer from 1.3 unchanged. The only new
      # compatibility variable in 1.6 is vcruntime140_threads.dll.
      # NO Wine rebuild here.
      # ============================================================

      - name: Patch MapleStory registry settings into prefix
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf prefix_work
          mkdir -p prefix_work

          tar -xJf prefixPack-base.txz \
            -C prefix_work

          echo "=== Prefix structure ==="

          find prefix_work \
            -maxdepth 3 \
            -type f \
            -printf '%p\n' \
            > prefix-files-before.txt

          sed -n '1,150p' prefix-files-before.txt

          USER_REG="$(find prefix_work -type f -name user.reg -print -quit)"
          SYSTEM_REG="$(find prefix_work -type f -name system.reg -print -quit)"
          USERDEF_REG="$(find prefix_work -type f -name userdef.reg -print -quit || true)"

          if [ -z "$USER_REG" ]; then
            echo "ERROR: user.reg not found in prefix."
            exit 1
          fi

          if [ -z "$SYSTEM_REG" ]; then
            echo "ERROR: system.reg not found in prefix."
            exit 1
          fi

          echo
          echo "=== Registry hives ==="

          echo "user.reg:    $USER_REG"
          echo "system.reg:  $SYSTEM_REG"
          echo "userdef.reg: ${USERDEF_REG:-not present}"

          python3 - \
            "$USER_REG" \
            "$SYSTEM_REG" \
            "${USERDEF_REG:-}" <<'PY'
          import re
          import sys
          from pathlib import Path

          user_reg = Path(sys.argv[1])
          system_reg = Path(sys.argv[2])
          userdef_arg = sys.argv[3]
          userdef_reg = Path(userdef_arg) if userdef_arg else None


          def string_value(value):
              value = value.replace("\\", "\\\\")
              value = value.replace('"', '\\"')
              return f'"{value}"'


          def value_name(name):
              if name is None:
                  return "@"

              escaped = name.replace("\\", "\\\\")
              escaped = escaped.replace('"', '\\"')

              return f'"{escaped}"'


          def render(name, kind, value):
              prefix = value_name(name) + "="

              if kind == "str":
                  return prefix + string_value(value)

              if kind == "dword":
                  return prefix + f"dword:{value:08x}"

              raise ValueError(f"Unknown value type: {kind}")


          # Wine's internal registry-file format is similar to REGEDIT.
          # These paths are relative to HKCU inside user.reg.

          USER_PATCHES = {
              r"Software\\Wine\\X11 Driver": {
                  "UseTakeFocus": ("str", "N"),
                  "Grab": ("str", "N"),
                  "GrabFullscreen": ("str", "N"),
                  "UseLinuxInputEvents": ("str", "Y"),
              },

              r"Software\\Wine\\DirectInput": {
                  "UseLinuxInputEvents": ("str", "Y"),
                  "KeyboardUseNonExclusive": ("str", "Y"),
                  "MouseUseNonExclusive": ("str", "Y"),
              },

              r"Software\\Wine\\AppDefaults\\MapleStory.exe": {
                  "Version": ("str", "win10"),
              },

              r"Software\\Wine\\AppDefaults\\nxsteam.exe": {
                  "Version": ("str", "win10"),
              },

              r"Software\\Wine\\AppDefaults\\SteamConnectorHelper.exe": {
                  "Version": ("str", "win10"),
              },

              r"Software\\Nexon Launcher": {
                  "Install Directory": ("str", r"C:\Nexon\Launcher"),
                  "Region": ("str", "1"),
                  "User Data": (
                      "str",
                      '{"setup-id":"372e7640-20f4-419c-ada0-4ad0d76c33d9","time":1748271149}',
                  ),
              },

              r"Software\\Wine\\Direct3D": {
                  "cb_access_map_w": ("dword", 1),
                  "CSMT": ("str", "disabled"),
              },
          }


          # These paths are relative to HKLM inside system.reg.

          SYSTEM_PATCHES = {
              r"Software\\Classes\\Applications\\nexon_launcher.exe\\shell\\open": {
                  "FriendlyAppName": ("str", "Nexon Launcher"),
              },

              r"Software\\Classes\\nxl": {
                  None: ("str", "URL:nxl protocol"),
                  "URL Protocol": ("str", ""),
              },

              r"Software\\Classes\\nxl\\DefaultIcon": {
                  None: ("str", r"C:\Nexon\Launcher\nexon_launcher.exe"),
              },

              r"Software\\Classes\\nxl\\shell": {
                  None: ("str", ""),
              },

              r"Software\\Classes\\nxl\\shell\\open": {
                  None: ("str", ""),
                  "Friendly App Name": ("str", "Nexon Launcher"),
              },

              r"Software\\Classes\\nxl\\shell\\open\\command": {
                  None: (
                      "str",
                      r'"C:\Nexon\Launcher\nexon_launcher.exe" "%1"',
                  ),
              },

              r"Software\\Wow6432Node\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\Nexon Nexon Launcher": {
                  "DisplayIcon": (
                      "str",
                      r'"C:\Nexon\Launcher\logo.ico"',
                  ),
                  "DisplayName": (
                      "str",
                      "Nexon Launcher",
                  ),
                  "DisplayVersion": (
                      "str",
                      "2.3.0",
                  ),
                  "EstimatedSize": (
                      "dword",
                      0x2B48,
                  ),
                  "HelpLink": (
                      "str",
                      r'"http://www.nexon.net/legal/terms-of-use/"',
                  ),
                  "InstallLocation": (
                      "str",
                      r'"C:\Nexon\Launcher"',
                  ),
                  "NoModify": (
                      "dword",
                      1,
                  ),
                  "NoRepair": (
                      "dword",
                      1,
                  ),
                  "Publisher": (
                      "str",
                      "Nexon",
                  ),
                  "QuietUninstallString": (
                      "str",
                      r'"C:\Nexon\Launcher\uninstall.exe" /S',
                  ),
                  "UninstallString": (
                      "str",
                      r'"C:\Nexon\Launcher\uninstall.exe"',
                  ),
                  "URLInfoAbout": (
                      "str",
                      r'"http://www.nexon.net"',
                  ),
                  "URLUpdateInfo": (
                      "str",
                      r'"http://www.nexon.net"',
                  ),
                  "VersionMajor": (
                      "dword",
                      2,
                  ),
                  "VersionMinor": (
                      "dword",
                      3,
                  ),
              },
          }


          section_re = re.compile(r"^\[([^\]]+)\](?:\s+.*)?$")


          def find_section(lines, section):
              for index, line in enumerate(lines):
                  match = section_re.match(line)

                  if match and match.group(1) == section:
                      start = index

                      end = len(lines)

                      for next_index in range(index + 1, len(lines)):
                          if section_re.match(lines[next_index]):
                              end = next_index
                              break

                      return start, end

              return None


          def patch_hive(path, patches):
              print(f"Patching {path}")

              text = path.read_text(
                  encoding="utf-8",
                  errors="strict",
              )

              lines = text.splitlines()

              for section, values in patches.items():

                  current = find_section(lines, section)

                  if current is None:
                      if lines and lines[-1] != "":
                          lines.append("")

                      # Modification time is optional in Wine registry v2.
                      lines.append(f"[{section}]")

                      for name, (kind, value) in values.items():
                          lines.append(
                              render(
                                  name,
                                  kind,
                                  value,
                              )
                          )

                      continue

                  for name, (kind, value) in values.items():

                      desired = render(
                          name,
                          kind,
                          value,
                      )

                      token = value_name(name) + "="

                      start, end = find_section(
                          lines,
                          section,
                      )

                      replaced = False

                      for line_index in range(
                          start + 1,
                          end,
                      ):
                          if lines[line_index].startswith(token):
                              lines[line_index] = desired
                              replaced = True
                              break

                      if not replaced:
                          lines.insert(
                              end,
                              desired,
                          )

              path.write_text(
                  "\n".join(lines) + "\n",
                  encoding="utf-8",
              )


          def verify_hive(path, patches):
              text = path.read_text(
                  encoding="utf-8",
                  errors="strict",
              )

              for section, values in patches.items():

                  if f"[{section}]" not in text:
                      # Existing Wine-generated sections may include
                      # modification timestamps after the closing bracket.
                      section_found = False

                      for line in text.splitlines():
                          match = section_re.match(line)

                          if match and match.group(1) == section:
                              section_found = True
                              break

                      if not section_found:
                          raise RuntimeError(
                              f"Missing registry section {section} in {path}"
                          )

                  for name, (kind, value) in values.items():
                      wanted = render(
                          name,
                          kind,
                          value,
                      )

                      if wanted not in text:
                          raise RuntimeError(
                              f"Missing registry value {wanted} in {path}"
                          )

              print(f"Verified {path}")


          patch_hive(
              user_reg,
              USER_PATCHES,
          )

          patch_hive(
              system_reg,
              SYSTEM_PATCHES,
          )

          # Keep default-user settings consistent if this hive exists.
          if userdef_reg and userdef_reg.exists():
              patch_hive(
                  userdef_reg,
                  USER_PATCHES,
              )

          verify_hive(
              user_reg,
              USER_PATCHES,
          )

          verify_hive(
              system_reg,
              SYSTEM_PATCHES,
          )

          if userdef_reg and userdef_reg.exists():
              verify_hive(
                  userdef_reg,
                  USER_PATCHES,
              )

          print()
          print("MapleStory registry patch validation PASSED")
          PY

          echo
          echo "=== Repacking modified prefix ==="

          tar cJf prefixPack.txz \
            -C prefix_work \
            .

          test -s prefixPack.txz

          echo
          echo "=== Modified prefix pack ==="

          ls -lh prefixPack.txz
          sha256sum prefixPack.txz

          echo
          echo "=== Modified prefix contents ==="

          tar tJf prefixPack.txz \
            > modified-prefix-files.txt

          grep -E \
            '(^|/)(user|userdef|system)\.reg$' \
            modified-prefix-files.txt

          echo
          echo "Prefix registry patch PASSED"

      # ============================================================
      # 7. ADD ONLY vcruntime140_threads.dll TO THE PACKAGED PREFIX
      #
      # Controlled 1.5 variable:
      #   - system32/vcruntime140_threads.dll
      #   - syswow64/vcruntime140_threads.dll
      #
      # We deliberately do NOT replace ucrtbase.dll or the rest of the
      # VC runtime set yet. Earlier MapleStory logs already showed several
      # v14 runtime DLLs loading, while vcruntime140_threads.dll was not
      # observed. This keeps the experiment narrow and reversible.
      # ============================================================

      - name: Add vcruntime140_threads.dll to packaged prefix
        shell: bash
        run: |
          set -euxo pipefail

          PAYLOAD="$GITHUB_WORKSPACE/maplestory_reference/files/vc_runtime"

          rm -rf prefix_runtime_work
          mkdir -p prefix_runtime_work

          tar -xJf prefixPack.txz \
            -C prefix_runtime_work

          DRIVE_C="$(find prefix_runtime_work -type d -name drive_c -print -quit)"

          if [ -z "$DRIVE_C" ]; then
            echo "ERROR: drive_c not found in prefix pack"
            exit 1
          fi

          mkdir -p \
            "$DRIVE_C/windows/system32" \
            "$DRIVE_C/windows/syswow64"

          cp -f \
            "$PAYLOAD/system32/vcruntime140_threads.dll" \
            "$DRIVE_C/windows/system32/vcruntime140_threads.dll"

          cp -f \
            "$PAYLOAD/syswow64/vcruntime140_threads.dll" \
            "$DRIVE_C/windows/syswow64/vcruntime140_threads.dll"

          cmp -s \
            "$PAYLOAD/system32/vcruntime140_threads.dll" \
            "$DRIVE_C/windows/system32/vcruntime140_threads.dll"

          cmp -s \
            "$PAYLOAD/syswow64/vcruntime140_threads.dll" \
            "$DRIVE_C/windows/syswow64/vcruntime140_threads.dll"

          tar cJf prefixPack.txz \
            -C prefix_runtime_work \
            .

          test -s prefixPack.txz

          echo
          echo "Packaged-prefix vcruntime140_threads.dll injection PASSED"

      # ============================================================
      # 8. APPLY REGISTRY FIXES TO EXISTING LIVE PREFIX VIA WINE.INF
      # ============================================================

      - name: Inject MapleStory fixes into Wine update INF
        shell: bash
        run: |
          set -euxo pipefail

          ROOT="$CHECKPOINT_ROOT"
          INF="$ROOT/share/wine/wine.inf"

          test -f "$INF"
          cp "$INF" "$GITHUB_WORKSPACE/wine.inf.before"

          python3 - "$INF" <<'PYINF'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")
          lines = text.splitlines()
          section = "GameNativeMapleStory216150"

          if f"[{section}]" in text:
              raise SystemExit(f"ERROR: [{section}] already exists")

          try:
              base_index = lines.index("[BaseInstall]")
          except ValueError:
              raise SystemExit("ERROR: [BaseInstall] not found in wine.inf")

          addreg_index = None
          for i in range(base_index + 1, len(lines)):
              if lines[i].startswith("["):
                  break
              if lines[i].strip() == "AddReg=\\":
                  addreg_index = i
                  break

          if addreg_index is None:
              raise SystemExit("ERROR: [BaseInstall] AddReg block not found")

          lines.insert(addreg_index + 1, f"{section},\\")

          patch = r"""
          ; GameNative MapleStory Steam 216150 compatibility settings
          [GameNativeMapleStory216150]
          HKCU,Software\Wine\X11 Driver,"UseTakeFocus",,"N"
          HKCU,Software\Wine\X11 Driver,"Grab",,"N"
          HKCU,Software\Wine\X11 Driver,"GrabFullscreen",,"N"
          HKCU,Software\Wine\X11 Driver,"UseLinuxInputEvents",,"Y"
          HKCU,Software\Wine\DirectInput,"UseLinuxInputEvents",,"Y"
          HKCU,Software\Wine\DirectInput,"KeyboardUseNonExclusive",,"Y"
          HKCU,Software\Wine\DirectInput,"MouseUseNonExclusive",,"Y"
          HKCU,Software\Wine\AppDefaults\MapleStory.exe,"Version",,"win10"
          HKCU,Software\Wine\AppDefaults\nxsteam.exe,"Version",,"win10"
          HKCU,Software\Wine\AppDefaults\SteamConnectorHelper.exe,"Version",,"win10"
          HKCU,Software\Wine\Direct3D,"cb_access_map_w",0x10001,1
          HKCU,Software\Wine\Direct3D,"CSMT",,"disabled"
          HKCU,Software\Wine\GameNativeMapleStory,"AppliedVersion",,"1.3"
          HKCU,Software\Nexon Launcher,"Install Directory",,"C:\Nexon\Launcher"
          HKCU,Software\Nexon Launcher,"Region",,"1"
          HKLM,Software\Classes\Applications\nexon_launcher.exe\shell\open,"FriendlyAppName",,"Nexon Launcher"
          HKLM,Software\Classes\nxl,,,"URL:nxl protocol"
          HKLM,Software\Classes\nxl,"URL Protocol",,""
          HKLM,Software\Classes\nxl\DefaultIcon,,,"C:\Nexon\Launcher\nexon_launcher.exe"
          HKLM,Software\Classes\nxl\shell,,,""
          HKLM,Software\Classes\nxl\shell\open,,,""
          HKLM,Software\Classes\nxl\shell\open,"Friendly App Name",,"Nexon Launcher"
          """

          output = "\n".join(lines) + "\n" + patch.strip() + "\n"
          path.write_text(output, encoding="utf-8")
          PYINF

          echo
          echo "=== Validate patched wine.inf ==="
          grep -Fq '[GameNativeMapleStory216150]' "$INF"
          grep -Fq 'GameNativeMapleStory216150,\' "$INF"
          grep -Fq 'HKCU,Software\Wine\X11 Driver,"UseTakeFocus",,"N"' "$INF"
          grep -Fq 'HKCU,Software\Wine\AppDefaults\MapleStory.exe,"Version",,"win10"' "$INF"
          grep -Fq 'HKCU,Software\Wine\Direct3D,"cb_access_map_w",0x10001,1' "$INF"
          grep -Fq 'HKCU,Software\Wine\GameNativeMapleStory,"AppliedVersion",,"1.3"' "$INF"

          # Wine prefixes track wine.inf's mtime in .update-timestamp.
          touch "$INF"
          stat "$INF"
          echo "Live-prefix wine.inf patch PASSED"

      # ============================================================
      # 9. STAGE vcruntime140_threads.dll AND WRAP bin/wine
      #
      # 1.4 attempted Wine INF CopyFiles/WineSourceDirs and made Wine
      # itself exit with status 53 before TestD3D or NXSteam started.
      # This build intentionally contains NONE of that CopyFiles logic.
      #
      # The wrapper only deploys the DLL when Steam App 216150 is being
      # launched. GameNative Test Graphics therefore exercises the wrapper
      # path but does not modify the live prefix.
      # ============================================================

      - name: Stage direct MapleStory runtime deployment wrapper
        shell: bash
        run: |
          set -euxo pipefail

          ROOT="$CHECKPOINT_ROOT"
          PAYLOAD="$GITHUB_WORKSPACE/maplestory_reference/files/vc_runtime"
          RUNTIME_ROOT="$ROOT/share/wine/maplestory_vc_runtime"

          test -x "$ROOT/lib/wine/aarch64-unix/wine"

          rm -rf "$RUNTIME_ROOT"
          mkdir -p \
            "$RUNTIME_ROOT/system32" \
            "$RUNTIME_ROOT/syswow64"

          cp -f \
            "$PAYLOAD/system32/vcruntime140_threads.dll" \
            "$RUNTIME_ROOT/system32/vcruntime140_threads.dll"

          cp -f \
            "$PAYLOAD/syswow64/vcruntime140_threads.dll" \
            "$RUNTIME_ROOT/syswow64/vcruntime140_threads.dll"

          test -s "$RUNTIME_ROOT/system32/vcruntime140_threads.dll"
          test -s "$RUNTIME_ROOT/syswow64/vcruntime140_threads.dll"

          # Preserve the original Wine launcher target separately.
          test -L "$ROOT/bin/wine"
          test "$(readlink "$ROOT/bin/wine")" = "../lib/wine/aarch64-unix/wine"

          rm -f "$ROOT/bin/wine.real"
          ln -s ../lib/wine/aarch64-unix/wine "$ROOT/bin/wine.real"

          rm -f "$ROOT/bin/wine"

          cat > "$ROOT/bin/wine" <<'SH'
          #!/bin/sh
          # GameNative MapleStory 216150 vcruntime140_threads shim.

          # IMPORTANT: do not use command substitution here. GameNative's
          # LD_PRELOAD evshim writes startup messages to stdout; $(...) would
          # capture those messages and corrupt SCRIPT_DIR/ROOT_DIR.
          case "$0" in
              /*)
                  SCRIPT_PATH="$0"
                  ;;
              */*)
                  SCRIPT_PATH="$PWD/$0"
                  ;;
              *)
                  echo "[GN-MS-1.6] ERROR: Wine wrapper was invoked without a path: $0" >&2
                  exit 50
                  ;;
          esac

          SCRIPT_DIR="${SCRIPT_PATH%/*}"
          ROOT_DIR="${SCRIPT_DIR%/*}"
          REAL_WINE="$SCRIPT_DIR/wine.real"
          RUNTIME_ROOT="$ROOT_DIR/share/wine/maplestory_vc_runtime"

          if [ ! -x "$REAL_WINE" ]; then
              echo "[GN-MS-1.6] ERROR: real Wine launcher missing: $REAL_WINE" >&2
              exit 52
          fi

          # GameNative may carry the game's Steam IDs even when Test Graphics
          # is being launched, and it appends the game's normal exec arguments
          # after TestD3D.exe. Detect TestD3D explicitly so the cube test never
          # mutates the prefix.
          IS_TEST_D3D=0
          for ARG in "$@"; do
              case "$ARG" in
                  *TestD3D.exe*|*testd3d.exe*)
                      IS_TEST_D3D=1
                      ;;
              esac
          done

          if [ "$IS_TEST_D3D" -eq 0 ]; then
              if [ "${SteamGameId:-}" = "216150" ] || [ "${SteamAppId:-}" = "216150" ]; then
                  PREFIX="${WINEPREFIX:-}"

                  if [ -z "$PREFIX" ]; then
                      echo "[GN-MS-1.6] ERROR: MapleStory launch has no WINEPREFIX" >&2
                      exit 54
                  fi

                  SYS32="$PREFIX/drive_c/windows/system32"
                  WOW64="$PREFIX/drive_c/windows/syswow64"
                  SRC64="$RUNTIME_ROOT/system32/vcruntime140_threads.dll"
                  SRC32="$RUNTIME_ROOT/syswow64/vcruntime140_threads.dll"
                  MARKER="$PREFIX/.gamenative-maplestory-vcruntime140-threads-1.6"

                  if [ ! -s "$SRC64" ] || [ ! -s "$SRC32" ]; then
                      echo "[GN-MS-1.6] ERROR: packaged runtime payload missing" >&2
                      exit 55
                  fi

                  if [ -d "$SYS32" ] && [ -d "$WOW64" ]; then
                      if [ ! -f "$MARKER" ]; then
                          echo "[GN-MS-1.6] Installing vcruntime140_threads.dll into $PREFIX" >&2

                          # rm first so an existing destination symlink cannot
                          # cause cp to overwrite a Wine distribution target.
                          rm -f "$SYS32/vcruntime140_threads.dll" || exit 57
                          rm -f "$WOW64/vcruntime140_threads.dll" || exit 57

                          cp "$SRC64" "$SYS32/vcruntime140_threads.dll" || exit 58
                          cp "$SRC32" "$WOW64/vcruntime140_threads.dll" || exit 58

                          chmod 0644 \
                            "$SYS32/vcruntime140_threads.dll" \
                            "$WOW64/vcruntime140_threads.dll" || exit 59

                          if [ ! -s "$SYS32/vcruntime140_threads.dll" ] || \
                             [ ! -s "$WOW64/vcruntime140_threads.dll" ]; then
                              echo "[GN-MS-1.6] ERROR: runtime copy verification failed" >&2
                              exit 60
                          fi

                          {
                              echo "GameNative MapleStory runtime test 1.6"
                              echo "SteamAppId=216150"
                              echo "Installed=vcruntime140_threads.dll"
                          } > "$MARKER" || exit 61

                          echo "[GN-MS-1.6] Runtime install complete" >&2
                      else
                          echo "[GN-MS-1.6] Runtime marker already present" >&2
                      fi
                  else
                      # New prefixes are already covered by prefixPack.txz.
                      echo "[GN-MS-1.6] drive_c not ready; using packaged-prefix runtime" >&2
                  fi
              fi
          fi

          exec "$REAL_WINE" "$@"
          SH

          chmod 755 "$ROOT/bin/wine"

          echo
          echo "=== Validate wrapper ==="

          test -f "$ROOT/bin/wine"
          test ! -L "$ROOT/bin/wine"
          test -x "$ROOT/bin/wine"

          test -L "$ROOT/bin/wine.real"
          test -e "$ROOT/bin/wine.real"
          test -x "$ROOT/bin/wine.real"
          test "$(readlink "$ROOT/bin/wine.real")" = "../lib/wine/aarch64-unix/wine"

          sh -n "$ROOT/bin/wine"

          grep -Fq 'SteamGameId:-' "$ROOT/bin/wine"
          grep -Fq '216150' "$ROOT/bin/wine"
          grep -Fq 'TestD3D.exe' "$ROOT/bin/wine"
          grep -Fq 'SCRIPT_DIR="${SCRIPT_PATH%/*}"' "$ROOT/bin/wine"
          grep -Fq 'vcruntime140_threads.dll' "$ROOT/bin/wine"
          grep -Fq 'exec "$REAL_WINE" "$@"' "$ROOT/bin/wine"

          if grep -Fq 'SCRIPT_DIR=$(' "$ROOT/bin/wine" ||              grep -Fq 'ROOT_DIR=$(' "$ROOT/bin/wine"; then
              echo "ERROR: wrapper still contains stdout-capturing path command substitution"
              exit 1
          fi

          echo
          echo "Direct runtime deployment wrapper PASSED"

      # ============================================================
      # 10. CREATE NEW 1.5 GAMENATIVE PROFILE
      # ============================================================

      - name: Generate GameNative Proton profile
        shell: bash
        run: |
          set -euxo pipefail

          cat > profile.json <<'EOF'
          {
            "type": "Proton",
            "versionName": "11.0-1.6-arm64ec",
            "versionCode": 2,
            "description": "Proton 11 ARM64EC - MapleStory fixes plus direct vcruntime140_threads deployment, evshim-safe wrapper",
            "files": [],
            "wine": {
              "binPath": "bin",
              "libPath": "lib",
              "prefixPack": "prefixPack.txz"
            }
          }
          EOF

          echo "=== Generated profile ==="

          cat profile.json

          grep -Fq \
            '"versionName": "11.0-1.6-arm64ec"' \
            profile.json

          echo
          echo "Profile validation PASSED"

      # ============================================================
      # 11. BUILD THE NEW WCP
      # ============================================================

      - name: Build WCP
        shell: bash
        run: |
          set -euxo pipefail

          ROOT="$CHECKPOINT_ROOT"

          cp prefixPack.txz \
            "$ROOT/prefixPack.txz"

          cp profile.json \
            "$ROOT/profile.json"

          echo "=== Package inputs ==="

          ls -ld \
            "$ROOT/bin" \
            "$ROOT/lib" \
            "$ROOT/share"

          ls -lh \
            "$ROOT/prefixPack.txz" \
            "$ROOT/profile.json"

          cd "$ROOT"

          tar cJf \
            "$GITHUB_WORKSPACE/$WCP_NAME" \
            bin \
            lib \
            share \
            prefixPack.txz \
            profile.json

          echo
          echo "=== WCP created ==="

          ls -lh "$GITHUB_WORKSPACE/$WCP_NAME"

      # ============================================================
      # 12. VALIDATE FINAL WCP
      # ============================================================

      - name: Validate final WCP
        shell: bash
        run: |
          set -euxo pipefail

          WCP="$GITHUB_WORKSPACE/$WCP_NAME"

          test -f "$WCP"
          test -s "$WCP"

          echo "=== WCP ==="
          ls -lh "$WCP"

          echo
          echo "=== XZ integrity ==="

          xz -t "$WCP"

          echo "XZ integrity PASSED"

          echo
          echo "=== Archive listing ==="

          tar tJf "$WCP" \
            > wcp-files.txt

          for f in \
            bin/wine \
            bin/wine.real \
            bin/wineserver \
            lib/wine/aarch64-unix/wine \
            prefixPack.txz \
            profile.json
          do
            grep -Fxq "$f" wcp-files.txt
            echo "FOUND: $f"
          done

          echo
          echo "=== Packaged profile ==="

          tar xJOf \
            "$WCP" \
            profile.json \
            > packaged-profile.json

          cat packaged-profile.json

          grep -Fq \
            '"versionName": "11.0-1.6-arm64ec"' \
            packaged-profile.json

          echo
          echo "=== Validate Wine launcher chain ==="

          rm -rf wcp_validation
          mkdir -p wcp_validation

          tar xJf "$WCP" \
            -C wcp_validation \
            bin/wine \
            bin/wine.real \
            bin/wineserver \
            lib/wine/aarch64-unix/wine

          test -f wcp_validation/bin/wine
          test ! -L wcp_validation/bin/wine
          test -x wcp_validation/bin/wine

          test -L wcp_validation/bin/wine.real
          test -e wcp_validation/bin/wine.real
          test -x wcp_validation/bin/wine.real
          test "$(readlink wcp_validation/bin/wine.real)" = "../lib/wine/aarch64-unix/wine"

          test -x wcp_validation/bin/wineserver
          test -x wcp_validation/lib/wine/aarch64-unix/wine

          sh -n wcp_validation/bin/wine
          grep -Fq 'SteamGameId:-' wcp_validation/bin/wine
          grep -Fq 'TestD3D.exe' wcp_validation/bin/wine
          grep -Fq 'SCRIPT_DIR="${SCRIPT_PATH%/*}"' wcp_validation/bin/wine
          grep -Fq 'vcruntime140_threads.dll' wcp_validation/bin/wine
          grep -Fq 'exec "$REAL_WINE" "$@"' wcp_validation/bin/wine

          if grep -Fq 'SCRIPT_DIR=$(' wcp_validation/bin/wine ||              grep -Fq 'ROOT_DIR=$(' wcp_validation/bin/wine; then
              echo "ERROR: packaged wrapper still contains stdout-capturing path command substitution"
              exit 1
          fi

          echo "Wine wrapper/launcher validation PASSED"

          echo
          echo "=== Validate patched prefix inside final WCP ==="

          tar xJOf \
            "$WCP" \
            prefixPack.txz \
            > packaged-prefix.txz

          rm -rf packaged_prefix
          mkdir -p packaged_prefix

          tar xJf packaged-prefix.txz \
            -C packaged_prefix

          USER_REG="$(find packaged_prefix -type f -name user.reg -print -quit)"
          SYSTEM_REG="$(find packaged_prefix -type f -name system.reg -print -quit)"

          test -n "$USER_REG"
          test -n "$SYSTEM_REG"

          echo "user.reg:   $USER_REG"
          echo "system.reg: $SYSTEM_REG"

          grep -Fq \
            '"UseTakeFocus"="N"' \
            "$USER_REG"

          grep -Fq \
            '"UseLinuxInputEvents"="Y"' \
            "$USER_REG"

          grep -Fq \
            '"KeyboardUseNonExclusive"="Y"' \
            "$USER_REG"

          grep -Fq \
            '"MouseUseNonExclusive"="Y"' \
            "$USER_REG"

          grep -Fq \
            '"Version"="win10"' \
            "$USER_REG"

          grep -Fq \
            '"cb_access_map_w"=dword:00000001' \
            "$USER_REG"

          grep -Fq \
            '"CSMT"="disabled"' \
            "$USER_REG"

          grep -Fq \
            '"URL Protocol"=""' \
            "$SYSTEM_REG"

          echo
          echo "Packaged MapleStory registry validation PASSED"

          echo
          echo "=== Validate live-prefix wine.inf inside final WCP ==="

          grep -Fxq 'share/wine/wine.inf' wcp-files.txt
          tar xJOf "$WCP" share/wine/wine.inf > packaged-wine.inf
          grep -Fq '[GameNativeMapleStory216150]' packaged-wine.inf
          grep -Fq 'GameNativeMapleStory216150,\' packaged-wine.inf
          grep -Fq 'HKCU,Software\Wine\GameNativeMapleStory,"AppliedVersion",,"1.3"' packaged-wine.inf
          grep -Fq 'HKCU,Software\Wine\AppDefaults\MapleStory.exe,"Version",,"win10"' packaged-wine.inf
          echo "Packaged live-prefix wine.inf validation PASSED"

          echo
          echo "=== Validate direct runtime payload inside final WCP ==="

          for f in \
            share/wine/maplestory_vc_runtime/system32/vcruntime140_threads.dll \
            share/wine/maplestory_vc_runtime/syswow64/vcruntime140_threads.dll
          do
            grep -Fxq "$f" wcp-files.txt
            echo "FOUND: $f"
          done

          # Safety check: the broken 1.4 CopyFiles mechanism must be absent.
          if grep -Fq 'MapleVCRuntime64' packaged-wine.inf; then
            echo "ERROR: MapleVCRuntime64 wine.inf integration leaked into 1.5"
            exit 1
          fi

          if grep -Fq 'MapleVCRuntime32' packaged-wine.inf; then
            echo "ERROR: MapleVCRuntime32 wine.inf integration leaked into 1.5"
            exit 1
          fi

          echo
          echo "=== Validate vcruntime140_threads.dll inside packaged prefix ==="

          PREFIX_DRIVE_C="$(find packaged_prefix -type d -name drive_c -print -quit)"
          test -n "$PREFIX_DRIVE_C"

          test -s \
            "$PREFIX_DRIVE_C/windows/system32/vcruntime140_threads.dll"

          test -s \
            "$PREFIX_DRIVE_C/windows/syswow64/vcruntime140_threads.dll"

          echo "Packaged/direct runtime validation PASSED"

          echo
          echo "=== Final SHA256 ==="

          sha256sum "$WCP"

          echo
          echo "=========================================="
          echo "WCP validation PASSED"
          echo "=========================================="

      # ============================================================
      # 13. UPLOAD 1.5 WCP
      # ============================================================

      - name: Upload MapleStory direct-runtime WCP
        uses: actions/upload-artifact@v4
        with:
          name: proton-11.0-1.6-arm64ec
          path: proton-11.0-1.6-arm64ec.wcp
          if-no-files-found: error
          retention-days: 30
