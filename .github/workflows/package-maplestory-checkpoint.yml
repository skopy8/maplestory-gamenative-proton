name: Package MapleStory ARM64EC Full VC Runtime Env Override Test 1.8

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Original workflow run ID containing compiled-proton-arm64ec-checkpoint"
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04

    env:
      CUSTOM_VERSION: "11.0-1.8-arm64ec"
      WCP_NAME: "proton-11.0-1.8-arm64ec.wcp"
      RUNTIME_COMMIT: "181cd74cf51db5fd2563ec81359a94db9a2ada32"

    steps:
      # ============================================================
      # 1. DOWNLOAD OUR ALREADY-COMPILED PATCHED PROTON
      # ============================================================

      - name: Download compiled ARM64EC checkpoint
        uses: actions/download-artifact@v4
        with:
          name: compiled-proton-arm64ec-checkpoint
          path: checkpoint
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}

      # ============================================================
      # 2. RESTORE COMPILED PROTON
      #
      # The original checkpoint was deliberately wrapped in a tar
      # so executable permissions and symlinks survive GitHub
      # Actions artifact storage.
      # ============================================================

      - name: Restore compiled Proton checkpoint
        shell: bash
        run: |
          set -euxo pipefail

          CHECKPOINT="checkpoint/compiled-proton-checkpoint.tar"

          echo "=== Checkpoint artifact ==="
          ls -lh checkpoint

          test -f "$CHECKPOINT"

          rm -rf checkpoint_extracted
          mkdir -p checkpoint_extracted

          tar -xf "$CHECKPOINT" \
            -C checkpoint_extracted

          ROOT="$GITHUB_WORKSPACE/checkpoint_extracted"

          test -d "$ROOT/bin"
          test -d "$ROOT/lib"
          test -d "$ROOT/share"

          echo "CHECKPOINT_ROOT=$ROOT" >> "$GITHUB_ENV"

          echo
          echo "=== Restored Proton root ==="
          ls -lah "$ROOT"

          echo
          echo "=== Wine launchers ==="
          ls -lah "$ROOT/bin"

      # ============================================================
      # 3. VALIDATE / RESTORE THE WINE LAUNCHER
      # ============================================================

      - name: Validate checkpoint Wine runtime
        shell: bash
        run: |
          set -euxo pipefail

          ROOT="$CHECKPOINT_ROOT"

          echo "=== bin/wine ==="

          test -L "$ROOT/bin/wine"

          WINE_TARGET="$(readlink "$ROOT/bin/wine")"

          echo "Target: $WINE_TARGET"

          if [ "$WINE_TARGET" != "../lib/wine/aarch64-unix/wine" ]; then
            echo "ERROR: Unexpected bin/wine target"
            exit 1
          fi

          test -f "$ROOT/lib/wine/aarch64-unix/wine"
          test -f "$ROOT/bin/wineserver"

          # Restore executable bits just in case.
          chmod 755 "$ROOT/lib/wine/aarch64-unix/wine"
          chmod 755 "$ROOT/bin/wineserver"

          find "$ROOT/bin" \
            -maxdepth 1 \
            -type f \
            -name 'wine*' \
            -exec chmod 755 {} \;

          test -e "$ROOT/bin/wine"
          test -x "$ROOT/bin/wine"
          test -x "$ROOT/bin/wineserver"
          test -x "$ROOT/lib/wine/aarch64-unix/wine"

          echo
          echo "=== Runtime files ==="

          ls -l \
            "$ROOT/bin/wine" \
            "$ROOT/bin/wineserver" \
            "$ROOT/lib/wine/aarch64-unix/wine"

          echo
          echo "Checkpoint Wine runtime validation PASSED"

      # ============================================================
      # 4. CHECK OUT THE EXACT VC++ RUNTIME PAYLOAD USED BY THE
      #    MAPLESTORY LINUX REFERENCE SETUP
      #
      # Pin the source commit so this controlled test cannot silently
      # change if the upstream repository changes later.
      # ============================================================

      - name: Checkout pinned MapleStory VC runtime payload
        uses: actions/checkout@v4
        with:
          repository: oldschoola/linux_maplestory
          ref: ${{ env.RUNTIME_COMMIT }}
          path: maplestory_reference
          sparse-checkout: |
            files/vc_runtime
            patches/13-apply-runtime-file-patches.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Validate pinned VC runtime payload
        shell: bash
        run: |
          set -euxo pipefail

          ROOT="$GITHUB_WORKSPACE/maplestory_reference/files/vc_runtime"

          SYS32=(
            concrt140.dll
            msvcp140.dll
            msvcp140_1.dll
            msvcp140_2.dll
            msvcp140_atomic_wait.dll
            msvcp140_codecvt_ids.dll
            ucrtbase.dll
            vccorlib140.dll
            vcomp140.dll
            vcruntime140.dll
            vcruntime140_1.dll
            vcruntime140_threads.dll
          )

          WOW64=(
            concrt140.dll
            msvcp140.dll
            msvcp140_1.dll
            msvcp140_2.dll
            msvcp140_atomic_wait.dll
            msvcp140_codecvt_ids.dll
            ucrtbase.dll
            vccorlib140.dll
            vcomp140.dll
            vcruntime140.dll
            vcruntime140_threads.dll
          )

          for dll in "${SYS32[@]}"; do
            test -s "$ROOT/system32/$dll"
          done

          for dll in "${WOW64[@]}"; do
            test -s "$ROOT/syswow64/$dll"
          done

          echo "=== Runtime payload commit ==="
          git -C "$GITHUB_WORKSPACE/maplestory_reference" rev-parse HEAD
          test "$(git -C "$GITHUB_WORKSPACE/maplestory_reference" rev-parse HEAD)" = "$RUNTIME_COMMIT"

          echo
          echo "=== system32 payload ==="
          for dll in "${SYS32[@]}"; do
            file "$ROOT/system32/$dll"
            sha256sum "$ROOT/system32/$dll"
          done

          echo
          echo "=== syswow64 payload ==="
          for dll in "${WOW64[@]}"; do
            file "$ROOT/syswow64/$dll"
            sha256sum "$ROOT/syswow64/$dll"
          done

          echo
          echo "Pinned VC runtime payload validation PASSED"

      # ============================================================
      # 5. DOWNLOAD THE CORRECT PROTON 11 ARM64EC PREFIX
      #
      # IMPORTANT:
      # Use prefixPack-arm64ec-11.txz.
      # Do NOT use the generic prefixPack-arm64ec.txz.
      # ============================================================

      - name: Download GameNative Proton 11 ARM64EC prefix
        shell: bash
        run: |
          set -euxo pipefail

          wget \
            https://github.com/GameNative/bionic-prefix-files/raw/main/prefixPack-arm64ec-11.txz \
            -O prefixPack-base.txz

          test -s prefixPack-base.txz

          echo
          echo "=== Base prefix pack ==="

          ls -lh prefixPack-base.txz
          file prefixPack-base.txz
          sha256sum prefixPack-base.txz

      # ============================================================
      # 6. APPLY THE MAPLESTORY REGISTRY FIXES
      #
      # Keep the known-good MapleStory compatibility registry layer.
      # Do NOT add persistent VC-runtime DllOverrides here; 1.8 applies
      # those per launch through WINEDLLOVERRIDES instead.
      # NO Wine rebuild here.
      # ============================================================

      - name: Patch MapleStory registry settings into prefix
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf prefix_work
          mkdir -p prefix_work

          tar -xJf prefixPack-base.txz \
            -C prefix_work

          echo "=== Prefix structure ==="

          find prefix_work \
            -maxdepth 3 \
            -type f \
            -printf '%p\n' \
            > prefix-files-before.txt

          sed -n '1,150p' prefix-files-before.txt

          USER_REG="$(find prefix_work -type f -name user.reg -print -quit)"
          SYSTEM_REG="$(find prefix_work -type f -name system.reg -print -quit)"
          USERDEF_REG="$(find prefix_work -type f -name userdef.reg -print -quit || true)"

          if [ -z "$USER_REG" ]; then
            echo "ERROR: user.reg not found in prefix."
            exit 1
          fi

          if [ -z "$SYSTEM_REG" ]; then
            echo "ERROR: system.reg not found in prefix."
            exit 1
          fi

          echo
          echo "=== Registry hives ==="

          echo "user.reg:    $USER_REG"
          echo "system.reg:  $SYSTEM_REG"
          echo "userdef.reg: ${USERDEF_REG:-not present}"

          python3 - \
            "$USER_REG" \
            "$SYSTEM_REG" \
            "${USERDEF_REG:-}" <<'PY'
          import re
          import sys
          from pathlib import Path

          user_reg = Path(sys.argv[1])
          system_reg = Path(sys.argv[2])
          userdef_arg = sys.argv[3]
          userdef_reg = Path(userdef_arg) if userdef_arg else None


          def string_value(value):
              value = value.replace("\\", "\\\\")
              value = value.replace('"', '\\"')
              return f'"{value}"'


          def value_name(name):
              if name is None:
                  return "@"

              escaped = name.replace("\\", "\\\\")
              escaped = escaped.replace('"', '\\"')

              return f'"{escaped}"'


          def render(name, kind, value):
              prefix = value_name(name) + "="

              if kind == "str":
                  return prefix + string_value(value)

              if kind == "dword":
                  return prefix + f"dword:{value:08x}"

              raise ValueError(f"Unknown value type: {kind}")


          # Wine's internal registry-file format is similar to REGEDIT.
          # These paths are relative to HKCU inside user.reg.

          USER_PATCHES = {
              r"Software\\Wine\\X11 Driver": {
                  "UseTakeFocus": ("str", "N"),
                  "Grab": ("str", "N"),
                  "GrabFullscreen": ("str", "N"),
                  "UseLinuxInputEvents": ("str", "Y"),
              },

              r"Software\\Wine\\DirectInput": {
                  "UseLinuxInputEvents": ("str", "Y"),
                  "KeyboardUseNonExclusive": ("str", "Y"),
                  "MouseUseNonExclusive": ("str", "Y"),
              },

              r"Software\\Wine\\AppDefaults\\MapleStory.exe": {
                  "Version": ("str", "win10"),
              },

              r"Software\\Wine\\AppDefaults\\nxsteam.exe": {
                  "Version": ("str", "win10"),
              },

              r"Software\\Wine\\AppDefaults\\SteamConnectorHelper.exe": {
                  "Version": ("str", "win10"),
              },

              r"Software\\Nexon Launcher": {
                  "Install Directory": ("str", r"C:\Nexon\Launcher"),
                  "Region": ("str", "1"),
                  "User Data": (
                      "str",
                      '{"setup-id":"372e7640-20f4-419c-ada0-4ad0d76c33d9","time":1748271149}',
                  ),
              },

              r"Software\\Wine\\Direct3D": {
                  "cb_access_map_w": ("dword", 1),
                  "CSMT": ("str", "disabled"),
              },

          }


          # These paths are relative to HKLM inside system.reg.

          SYSTEM_PATCHES = {
              r"Software\\Classes\\Applications\\nexon_launcher.exe\\shell\\open": {
                  "FriendlyAppName": ("str", "Nexon Launcher"),
              },

              r"Software\\Classes\\nxl": {
                  None: ("str", "URL:nxl protocol"),
                  "URL Protocol": ("str", ""),
              },

              r"Software\\Classes\\nxl\\DefaultIcon": {
                  None: ("str", r"C:\Nexon\Launcher\nexon_launcher.exe"),
              },

              r"Software\\Classes\\nxl\\shell": {
                  None: ("str", ""),
              },

              r"Software\\Classes\\nxl\\shell\\open": {
                  None: ("str", ""),
                  "Friendly App Name": ("str", "Nexon Launcher"),
              },

              r"Software\\Classes\\nxl\\shell\\open\\command": {
                  None: (
                      "str",
                      r'"C:\Nexon\Launcher\nexon_launcher.exe" "%1"',
                  ),
              },

              r"Software\\Wow6432Node\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\Nexon Nexon Launcher": {
                  "DisplayIcon": (
                      "str",
                      r'"C:\Nexon\Launcher\logo.ico"',
                  ),
                  "DisplayName": (
                      "str",
                      "Nexon Launcher",
                  ),
                  "DisplayVersion": (
                      "str",
                      "2.3.0",
                  ),
                  "EstimatedSize": (
                      "dword",
                      0x2B48,
                  ),
                  "HelpLink": (
                      "str",
                      r'"http://www.nexon.net/legal/terms-of-use/"',
                  ),
                  "InstallLocation": (
                      "str",
                      r'"C:\Nexon\Launcher"',
                  ),
                  "NoModify": (
                      "dword",
                      1,
                  ),
                  "NoRepair": (
                      "dword",
                      1,
                  ),
                  "Publisher": (
                      "str",
                      "Nexon",
                  ),
                  "QuietUninstallString": (
                      "str",
                      r'"C:\Nexon\Launcher\uninstall.exe" /S',
                  ),
                  "UninstallString": (
                      "str",
                      r'"C:\Nexon\Launcher\uninstall.exe"',
                  ),
                  "URLInfoAbout": (
                      "str",
                      r'"http://www.nexon.net"',
                  ),
                  "URLUpdateInfo": (
                      "str",
                      r'"http://www.nexon.net"',
                  ),
                  "VersionMajor": (
                      "dword",
                      2,
                  ),
                  "VersionMinor": (
                      "dword",
                      3,
                  ),
              },
          }


          section_re = re.compile(r"^\[([^\]]+)\](?:\s+.*)?$")


          def find_section(lines, section):
              for index, line in enumerate(lines):
                  match = section_re.match(line)

                  if match and match.group(1) == section:
                      start = index

                      end = len(lines)

                      for next_index in range(index + 1, len(lines)):
                          if section_re.match(lines[next_index]):
                              end = next_index
                              break

                      return start, end

              return None


          def patch_hive(path, patches):
              print(f"Patching {path}")

              text = path.read_text(
                  encoding="utf-8",
                  errors="strict",
              )

              lines = text.splitlines()

              for section, values in patches.items():

                  current = find_section(lines, section)

                  if current is None:
                      if lines and lines[-1] != "":
                          lines.append("")

                      # Modification time is optional in Wine registry v2.
                      lines.append(f"[{section}]")

                      for name, (kind, value) in values.items():
                          lines.append(
                              render(
                                  name,
                                  kind,
                                  value,
                              )
                          )

                      continue

                  for name, (kind, value) in values.items():

                      desired = render(
                          name,
                          kind,
                          value,
                      )

                      token = value_name(name) + "="

                      start, end = find_section(
                          lines,
                          section,
                      )

                      replaced = False

                      for line_index in range(
                          start + 1,
                          end,
                      ):
                          if lines[line_index].startswith(token):
                              lines[line_index] = desired
                              replaced = True
                              break

                      if not replaced:
                          lines.insert(
                              end,
                              desired,
                          )

              path.write_text(
                  "\n".join(lines) + "\n",
                  encoding="utf-8",
              )


          def verify_hive(path, patches):
              text = path.read_text(
                  encoding="utf-8",
                  errors="strict",
              )

              for section, values in patches.items():

                  if f"[{section}]" not in text:
                      # Existing Wine-generated sections may include
                      # modification timestamps after the closing bracket.
                      section_found = False

                      for line in text.splitlines():
                          match = section_re.match(line)

                          if match and match.group(1) == section:
                              section_found = True
                              break

                      if not section_found:
                          raise RuntimeError(
                              f"Missing registry section {section} in {path}"
                          )

                  for name, (kind, value) in values.items():
                      wanted = render(
                          name,
                          kind,
                          value,
                      )

                      if wanted not in text:
                          raise RuntimeError(
                              f"Missing registry value {wanted} in {path}"
                          )

              print(f"Verified {path}")


          patch_hive(
              user_reg,
              USER_PATCHES,
          )

          patch_hive(
              system_reg,
              SYSTEM_PATCHES,
          )

          # Keep default-user settings consistent if this hive exists.
          if userdef_reg and userdef_reg.exists():
              patch_hive(
                  userdef_reg,
                  USER_PATCHES,
              )

          verify_hive(
              user_reg,
              USER_PATCHES,
          )

          verify_hive(
              system_reg,
              SYSTEM_PATCHES,
          )

          if userdef_reg and userdef_reg.exists():
              verify_hive(
                  userdef_reg,
                  USER_PATCHES,
              )

          print()
          print("MapleStory registry patch validation PASSED")
          PY

          echo
          echo "=== Repacking modified prefix ==="

          tar cJf prefixPack.txz \
            -C prefix_work \
            .

          test -s prefixPack.txz

          echo
          echo "=== Modified prefix pack ==="

          ls -lh prefixPack.txz
          sha256sum prefixPack.txz

          echo
          echo "=== Modified prefix contents ==="

          tar tJf prefixPack.txz \
            > modified-prefix-files.txt

          grep -E \
            '(^|/)(user|userdef|system)\.reg$' \
            modified-prefix-files.txt

          echo
          echo "Prefix registry patch PASSED"

      # ============================================================
      # 7. ADD THE COMPLETE PINNED VC++ RUNTIME TO THE PACKAGED PREFIX
      #
      # This mirrors the exact system32/syswow64 file lists used by the
      # pinned linux_maplestory runtime-install script.
      # ============================================================

      - name: Add complete VC runtime to packaged prefix
        shell: bash
        run: |
          set -euxo pipefail

          PAYLOAD="$GITHUB_WORKSPACE/maplestory_reference/files/vc_runtime"

          SYS32=(
            concrt140.dll
            msvcp140.dll
            msvcp140_1.dll
            msvcp140_2.dll
            msvcp140_atomic_wait.dll
            msvcp140_codecvt_ids.dll
            ucrtbase.dll
            vccorlib140.dll
            vcomp140.dll
            vcruntime140.dll
            vcruntime140_1.dll
            vcruntime140_threads.dll
          )

          WOW64=(
            concrt140.dll
            msvcp140.dll
            msvcp140_1.dll
            msvcp140_2.dll
            msvcp140_atomic_wait.dll
            msvcp140_codecvt_ids.dll
            ucrtbase.dll
            vccorlib140.dll
            vcomp140.dll
            vcruntime140.dll
            vcruntime140_threads.dll
          )

          rm -rf prefix_runtime_work
          mkdir -p prefix_runtime_work

          tar -xJf prefixPack.txz \
            -C prefix_runtime_work

          DRIVE_C="$(find prefix_runtime_work -type d -name drive_c -print -quit)"

          if [ -z "$DRIVE_C" ]; then
            echo "ERROR: drive_c not found in prefix pack"
            exit 1
          fi

          mkdir -p \
            "$DRIVE_C/windows/system32" \
            "$DRIVE_C/windows/syswow64"

          for dll in "${SYS32[@]}"; do
            rm -f "$DRIVE_C/windows/system32/$dll"
            cp -f "$PAYLOAD/system32/$dll" "$DRIVE_C/windows/system32/$dll"
            chmod 0644 "$DRIVE_C/windows/system32/$dll"
            cmp -s "$PAYLOAD/system32/$dll" "$DRIVE_C/windows/system32/$dll"
          done

          for dll in "${WOW64[@]}"; do
            rm -f "$DRIVE_C/windows/syswow64/$dll"
            cp -f "$PAYLOAD/syswow64/$dll" "$DRIVE_C/windows/syswow64/$dll"
            chmod 0644 "$DRIVE_C/windows/syswow64/$dll"
            cmp -s "$PAYLOAD/syswow64/$dll" "$DRIVE_C/windows/syswow64/$dll"
          done

          tar cJf prefixPack.txz \
            -C prefix_runtime_work \
            .

          test -s prefixPack.txz

          echo
          echo "Packaged-prefix full VC runtime injection PASSED"

      # ============================================================
      # 8. STAGE THE FULL VC RUNTIME AND WRAP bin/wine
      #
      # IMPORTANT:
      #   - No wine.inf edits.
      #   - No WineSourceDirs / CopyFiles integration.
      #   - No nested Wine/regedit process.
      #   - No esync changes.
      #   - TestD3D bypasses all MapleStory prefix mutation and VC overrides.
      #
      # On the first real Steam App 216150 launch, the wrapper copies the
      # complete runtime directly into the active $WINEPREFIX. On every real
      # MapleStory launch it then adds ONLY the reference VC-runtime override
      # subset to WINEDLLOVERRIDES using native-first/builtin-fallback (n,b),
      # preserving any overrides GameNative already supplied.
      # ============================================================

      - name: Stage full VC runtime env-override wrapper
        shell: bash
        run: |
          set -euxo pipefail

          ROOT="$CHECKPOINT_ROOT"
          PAYLOAD="$GITHUB_WORKSPACE/maplestory_reference/files/vc_runtime"
          RUNTIME_ROOT="$ROOT/share/wine/maplestory_vc_runtime"

          test -x "$ROOT/lib/wine/aarch64-unix/wine"

          # This build intentionally leaves the checkpoint wine.inf untouched.
          if grep -Fq '[GameNativeMapleStory216150]' "$ROOT/share/wine/wine.inf"; then
            echo "ERROR: checkpoint wine.inf unexpectedly contains the old live-registry injection"
            exit 1
          fi

          if grep -Fq 'MapleVCRuntime64' "$ROOT/share/wine/wine.inf" || \
             grep -Fq 'MapleVCRuntime32' "$ROOT/share/wine/wine.inf"; then
            echo "ERROR: broken 1.4 CopyFiles integration is present"
            exit 1
          fi

          rm -rf "$RUNTIME_ROOT"
          mkdir -p \
            "$RUNTIME_ROOT/system32" \
            "$RUNTIME_ROOT/syswow64"

          SYS32=(
            concrt140.dll
            msvcp140.dll
            msvcp140_1.dll
            msvcp140_2.dll
            msvcp140_atomic_wait.dll
            msvcp140_codecvt_ids.dll
            ucrtbase.dll
            vccorlib140.dll
            vcomp140.dll
            vcruntime140.dll
            vcruntime140_1.dll
            vcruntime140_threads.dll
          )

          WOW64=(
            concrt140.dll
            msvcp140.dll
            msvcp140_1.dll
            msvcp140_2.dll
            msvcp140_atomic_wait.dll
            msvcp140_codecvt_ids.dll
            ucrtbase.dll
            vccorlib140.dll
            vcomp140.dll
            vcruntime140.dll
            vcruntime140_threads.dll
          )

          for dll in "${SYS32[@]}"; do
            cp -f "$PAYLOAD/system32/$dll" "$RUNTIME_ROOT/system32/$dll"
            test -s "$RUNTIME_ROOT/system32/$dll"
          done

          for dll in "${WOW64[@]}"; do
            cp -f "$PAYLOAD/syswow64/$dll" "$RUNTIME_ROOT/syswow64/$dll"
            test -s "$RUNTIME_ROOT/syswow64/$dll"
          done

          # Preserve the original Wine launcher target separately.
          test -L "$ROOT/bin/wine"
          test "$(readlink "$ROOT/bin/wine")" = "../lib/wine/aarch64-unix/wine"

          rm -f "$ROOT/bin/wine.real"
          ln -s ../lib/wine/aarch64-unix/wine "$ROOT/bin/wine.real"

          rm -f "$ROOT/bin/wine"

          cat > "$ROOT/bin/wine" <<'SH'
          #!/bin/sh
          # GameNative MapleStory 216150 full VC-runtime shim (1.8).

          # Do not use command substitution for path discovery. GameNative's
          # LD_PRELOAD evshim writes startup messages to stdout.
          case "$0" in
              /*)
                  SCRIPT_PATH="$0"
                  ;;
              */*)
                  SCRIPT_PATH="$PWD/$0"
                  ;;
              *)
                  echo "[GN-MS-1.8] ERROR: Wine wrapper was invoked without a path: $0" >&2
                  exit 50
                  ;;
          esac

          SCRIPT_DIR="${SCRIPT_PATH%/*}"
          ROOT_DIR="${SCRIPT_DIR%/*}"
          REAL_WINE="$SCRIPT_DIR/wine.real"
          RUNTIME_ROOT="$ROOT_DIR/share/wine/maplestory_vc_runtime"

          if [ ! -x "$REAL_WINE" ]; then
              echo "[GN-MS-1.8] ERROR: real Wine launcher missing: $REAL_WINE" >&2
              exit 52
          fi

          # GameNative may carry Steam IDs and normal game arguments into its
          # graphics test. Never mutate a prefix or apply VC overrides during
          # TestD3D.
          IS_TEST_D3D=0
          for ARG in "$@"; do
              case "$ARG" in
                  *TestD3D.exe*|*testd3d.exe*)
                      IS_TEST_D3D=1
                      ;;
              esac
          done

          if [ "$IS_TEST_D3D" -eq 0 ]; then
              if [ "${SteamGameId:-}" = "216150" ] || [ "${SteamAppId:-}" = "216150" ]; then
                  PREFIX="${WINEPREFIX:-}"

                  if [ -z "$PREFIX" ]; then
                      echo "[GN-MS-1.8] ERROR: MapleStory launch has no WINEPREFIX" >&2
                      exit 54
                  fi

                  SYS32="$PREFIX/drive_c/windows/system32"
                  WOW64="$PREFIX/drive_c/windows/syswow64"
                  MARKER="$PREFIX/.gamenative-maplestory-full-vc-runtime-1.8"

                  if [ -d "$SYS32" ] && [ -d "$WOW64" ]; then
                      if [ ! -f "$MARKER" ]; then
                          echo "[GN-MS-1.8] Installing complete VC runtime into $PREFIX" >&2

                          SYS32_LIST='concrt140.dll msvcp140.dll msvcp140_1.dll msvcp140_2.dll msvcp140_atomic_wait.dll msvcp140_codecvt_ids.dll ucrtbase.dll vccorlib140.dll vcomp140.dll vcruntime140.dll vcruntime140_1.dll vcruntime140_threads.dll'
                          WOW64_LIST='concrt140.dll msvcp140.dll msvcp140_1.dll msvcp140_2.dll msvcp140_atomic_wait.dll msvcp140_codecvt_ids.dll ucrtbase.dll vccorlib140.dll vcomp140.dll vcruntime140.dll vcruntime140_threads.dll'

                          for DLL in $SYS32_LIST; do
                              SRC="$RUNTIME_ROOT/system32/$DLL"
                              DST="$SYS32/$DLL"
                              if [ ! -s "$SRC" ]; then
                                  echo "[GN-MS-1.8] ERROR: missing packaged system32 runtime: $DLL" >&2
                                  exit 55
                              fi
                              rm -f "$DST" || exit 57
                              cp "$SRC" "$DST" || exit 58
                              chmod 0644 "$DST" || exit 59
                              [ -s "$DST" ] || exit 60
                          done

                          for DLL in $WOW64_LIST; do
                              SRC="$RUNTIME_ROOT/syswow64/$DLL"
                              DST="$WOW64/$DLL"
                              if [ ! -s "$SRC" ]; then
                                  echo "[GN-MS-1.8] ERROR: missing packaged syswow64 runtime: $DLL" >&2
                                  exit 55
                              fi
                              rm -f "$DST" || exit 57
                              cp "$SRC" "$DST" || exit 58
                              chmod 0644 "$DST" || exit 59
                              [ -s "$DST" ] || exit 60
                          done

                          {
                              echo "GameNative MapleStory full VC runtime test 1.8"
                              echo "SteamAppId=216150"
                              echo "system32=12 runtime DLLs"
                              echo "syswow64=11 runtime DLLs"
                              echo "DllOverrides=WINEDLLOVERRIDES reference VC subset n,b"
                          } > "$MARKER" || exit 63

                          echo "[GN-MS-1.8] Full VC runtime install complete" >&2
                      else
                          echo "[GN-MS-1.8] Full VC runtime marker already present" >&2
                      fi
                  else
                      # A newly seeded prefix already contains the runtime in
                      # prefixPack.txz. Do not attempt nested Wine setup here.
                      echo "[GN-MS-1.8] drive_c not ready; using packaged-prefix runtime" >&2
                  fi

                  # Exact VC-runtime override subset from the pinned reference
                  # registry patch, expressed as per-launch Wine environment
                  # overrides. vccorlib140 and vcruntime140_threads are copied
                  # but intentionally are not forced because the reference
                  # override patch does not force them.
                  VC_OVERRIDES='concrt140=n,b;msvcp140=n,b;msvcp140_1=n,b;msvcp140_2=n,b;msvcp140_atomic_wait=n,b;msvcp140_codecvt_ids=n,b;ucrtbase=n,b;vcomp140=n,b;vcruntime140=n,b;vcruntime140_1=n,b'

                  if [ -n "${WINEDLLOVERRIDES:-}" ]; then
                      WINEDLLOVERRIDES="${WINEDLLOVERRIDES};${VC_OVERRIDES}"
                  else
                      WINEDLLOVERRIDES="$VC_OVERRIDES"
                  fi

                  export WINEDLLOVERRIDES
                  echo "[GN-MS-1.8] VC runtime WINEDLLOVERRIDES enabled" >&2
              fi
          fi

          exec "$REAL_WINE" "$@"
          SH

          chmod 755 "$ROOT/bin/wine"

          echo
          echo "=== Validate wrapper ==="

          test -f "$ROOT/bin/wine"
          test ! -L "$ROOT/bin/wine"
          test -x "$ROOT/bin/wine"

          test -L "$ROOT/bin/wine.real"
          test -e "$ROOT/bin/wine.real"
          test -x "$ROOT/bin/wine.real"
          test "$(readlink "$ROOT/bin/wine.real")" = "../lib/wine/aarch64-unix/wine"

          sh -n "$ROOT/bin/wine"

          grep -Fq 'SteamGameId:-' "$ROOT/bin/wine"
          grep -Fq '216150' "$ROOT/bin/wine"
          grep -Fq 'TestD3D.exe' "$ROOT/bin/wine"
          grep -Fq 'SCRIPT_DIR="${SCRIPT_PATH%/*}"' "$ROOT/bin/wine"
          grep -Fq 'vcruntime140_threads.dll' "$ROOT/bin/wine"
          grep -Fq 'ucrtbase.dll' "$ROOT/bin/wine"
          grep -Fq 'WINEDLLOVERRIDES' "$ROOT/bin/wine"
          grep -Fq 'vcruntime140_1=n,b' "$ROOT/bin/wine"
          grep -Fq 'VC runtime WINEDLLOVERRIDES enabled' "$ROOT/bin/wine"
          grep -Fq 'exec "$REAL_WINE" "$@"' "$ROOT/bin/wine"

          if grep -Fq 'regedit /S' "$ROOT/bin/wine"; then
              echo "ERROR: 1.8 wrapper still contains nested regedit"
              exit 1
          fi

          if grep -Fq 'SCRIPT_DIR=$(' "$ROOT/bin/wine" || \
             grep -Fq 'ROOT_DIR=$(' "$ROOT/bin/wine"; then
              echo "ERROR: wrapper contains stdout-capturing path command substitution"
              exit 1
          fi

          echo
          echo "Full VC runtime env-override wrapper PASSED"

      # ============================================================
      # 9. CREATE NEW 1.8 GAMENATIVE PROFILE
      # ============================================================

      - name: Generate GameNative Proton profile
        shell: bash
        run: |
          set -euxo pipefail

          cat > profile.json <<'EOF'
          {
            "type": "Proton",
            "versionName": "11.0-1.8-arm64ec",
            "versionCode": 2,
            "description": "Proton 11 ARM64EC - MapleStory fixes plus full pinned VC runtime and per-launch reference VC WINEDLLOVERRIDES",
            "files": [],
            "wine": {
              "binPath": "bin",
              "libPath": "lib",
              "prefixPack": "prefixPack.txz"
            }
          }
          EOF

          echo "=== Generated profile ==="

          cat profile.json

          grep -Fq \
            '"versionName": "11.0-1.8-arm64ec"' \
            profile.json

          echo
          echo "Profile validation PASSED"

      # ============================================================
      # 10. BUILD THE NEW WCP
      # ============================================================

      - name: Build WCP
        shell: bash
        run: |
          set -euxo pipefail

          ROOT="$CHECKPOINT_ROOT"

          cp prefixPack.txz \
            "$ROOT/prefixPack.txz"

          cp profile.json \
            "$ROOT/profile.json"

          echo "=== Package inputs ==="

          ls -ld \
            "$ROOT/bin" \
            "$ROOT/lib" \
            "$ROOT/share"

          ls -lh \
            "$ROOT/prefixPack.txz" \
            "$ROOT/profile.json"

          cd "$ROOT"

          tar cJf \
            "$GITHUB_WORKSPACE/$WCP_NAME" \
            bin \
            lib \
            share \
            prefixPack.txz \
            profile.json

          echo
          echo "=== WCP created ==="

          ls -lh "$GITHUB_WORKSPACE/$WCP_NAME"

      # ============================================================
      # 11. VALIDATE FINAL WCP
      # ============================================================

      - name: Validate final WCP
        shell: bash
        run: |
          set -euxo pipefail

          WCP="$GITHUB_WORKSPACE/$WCP_NAME"

          test -f "$WCP"
          test -s "$WCP"

          echo "=== WCP ==="
          ls -lh "$WCP"

          echo
          echo "=== XZ integrity ==="

          xz -t "$WCP"

          echo "XZ integrity PASSED"

          echo
          echo "=== Archive listing ==="

          tar tJf "$WCP" \
            > wcp-files.txt

          for f in \
            bin/wine \
            bin/wine.real \
            bin/wineserver \
            lib/wine/aarch64-unix/wine \
            prefixPack.txz \
            profile.json
          do
            grep -Fxq "$f" wcp-files.txt
            echo "FOUND: $f"
          done

          echo
          echo "=== Packaged profile ==="

          tar xJOf \
            "$WCP" \
            profile.json \
            > packaged-profile.json

          cat packaged-profile.json

          grep -Fq \
            '"versionName": "11.0-1.8-arm64ec"' \
            packaged-profile.json

          echo
          echo "=== Validate Wine launcher chain ==="

          rm -rf wcp_validation
          mkdir -p wcp_validation

          tar xJf "$WCP" \
            -C wcp_validation \
            bin/wine \
            bin/wine.real \
            bin/wineserver \
            lib/wine/aarch64-unix/wine

          test -f wcp_validation/bin/wine
          test ! -L wcp_validation/bin/wine
          test -x wcp_validation/bin/wine

          test -L wcp_validation/bin/wine.real
          test -e wcp_validation/bin/wine.real
          test -x wcp_validation/bin/wine.real
          test "$(readlink wcp_validation/bin/wine.real)" = "../lib/wine/aarch64-unix/wine"

          test -x wcp_validation/bin/wineserver
          test -x wcp_validation/lib/wine/aarch64-unix/wine

          sh -n wcp_validation/bin/wine
          grep -Fq 'SteamGameId:-' wcp_validation/bin/wine
          grep -Fq 'TestD3D.exe' wcp_validation/bin/wine
          grep -Fq 'SCRIPT_DIR="${SCRIPT_PATH%/*}"' wcp_validation/bin/wine
          grep -Fq 'vcruntime140_threads.dll' wcp_validation/bin/wine
          grep -Fq 'ucrtbase.dll' wcp_validation/bin/wine
          grep -Fq 'WINEDLLOVERRIDES' wcp_validation/bin/wine
          grep -Fq 'vcruntime140_1=n,b' wcp_validation/bin/wine
          grep -Fq 'VC runtime WINEDLLOVERRIDES enabled' wcp_validation/bin/wine

          if grep -Fq 'regedit /S' wcp_validation/bin/wine; then
              echo "ERROR: packaged 1.8 wrapper still contains nested regedit"
              exit 1
          fi
          grep -Fq 'exec "$REAL_WINE" "$@"' wcp_validation/bin/wine

          if grep -Fq 'SCRIPT_DIR=$(' wcp_validation/bin/wine ||              grep -Fq 'ROOT_DIR=$(' wcp_validation/bin/wine; then
              echo "ERROR: packaged wrapper still contains stdout-capturing path command substitution"
              exit 1
          fi

          echo "Wine wrapper/launcher validation PASSED"

          echo
          echo "=== Validate patched prefix inside final WCP ==="

          tar xJOf \
            "$WCP" \
            prefixPack.txz \
            > packaged-prefix.txz

          rm -rf packaged_prefix
          mkdir -p packaged_prefix

          tar xJf packaged-prefix.txz \
            -C packaged_prefix

          USER_REG="$(find packaged_prefix -type f -name user.reg -print -quit)"
          SYSTEM_REG="$(find packaged_prefix -type f -name system.reg -print -quit)"

          test -n "$USER_REG"
          test -n "$SYSTEM_REG"

          echo "user.reg:   $USER_REG"
          echo "system.reg: $SYSTEM_REG"

          grep -Fq \
            '"UseTakeFocus"="N"' \
            "$USER_REG"

          grep -Fq \
            '"UseLinuxInputEvents"="Y"' \
            "$USER_REG"

          grep -Fq \
            '"KeyboardUseNonExclusive"="Y"' \
            "$USER_REG"

          grep -Fq \
            '"MouseUseNonExclusive"="Y"' \
            "$USER_REG"

          grep -Fq \
            '"Version"="win10"' \
            "$USER_REG"

          grep -Fq \
            '"cb_access_map_w"=dword:00000001' \
            "$USER_REG"

          grep -Fq \
            '"CSMT"="disabled"' \
            "$USER_REG"

          # 1.8 must not ADD or CHANGE persistent VC-runtime overrides.
          # The upstream GameNative Proton 11 ARM64EC prefix may already carry
          # some DllOverrides of its own, so requiring these values to be absent
          # is incorrect. Compare the final packaged prefix against the exact
          # upstream base prefix instead. Any inherited values are allowed only
          # if they are byte-for-byte the same logical registry values as base.
          rm -rf base_prefix_validation
          mkdir -p base_prefix_validation

          tar xJf prefixPack-base.txz \
            -C base_prefix_validation

          BASE_USER_REG="$(find base_prefix_validation -type f -name user.reg -print -quit)"
          test -n "$BASE_USER_REG"

          python3 - \
            "$BASE_USER_REG" \
            "$USER_REG" <<'PYVCREG'
          import re
          import sys
          from pathlib import Path

          base_path = Path(sys.argv[1])
          final_path = Path(sys.argv[2])

          section_name = r"Software\\Wine\\DllOverrides"
          relevant_names = [
              "concrt140",
              "msvcp140",
              "msvcp140_1",
              "msvcp140_2",
              "msvcp140_atomic_wait",
              "msvcp140_codecvt_ids",
              "ucrtbase",
              "vcomp140",
              "vcruntime140",
              "vcruntime140_1",
          ]

          section_re = re.compile(r"^\[([^\]]+)\](?:\s+.*)?$")
          value_re = re.compile(r'^"([^"]+)"=(.*)$')


          def extract_relevant(path):
              lines = path.read_text(encoding="utf-8", errors="strict").splitlines()
              in_section = False
              result = {}

              for line in lines:
                  match = section_re.match(line)
                  if match:
                      in_section = match.group(1) == section_name
                      continue

                  if not in_section:
                      continue

                  value_match = value_re.match(line)
                  if not value_match:
                      continue

                  name, value = value_match.groups()
                  if name in relevant_names:
                      result[name] = value

              return result


          base_values = extract_relevant(base_path)
          final_values = extract_relevant(final_path)

          print("Base VC DllOverrides:", base_values)
          print("Final VC DllOverrides:", final_values)

          differences = []
          for name in relevant_names:
              base_value = base_values.get(name)
              final_value = final_values.get(name)
              if final_value != base_value:
                  differences.append((name, base_value, final_value))

          if differences:
              print("ERROR: 1.8 changed persistent VC runtime DllOverrides:")
              for name, base_value, final_value in differences:
                  print(f"  {name}: base={base_value!r} final={final_value!r}")
              raise SystemExit(1)

          print("Persistent VC runtime DllOverrides unchanged from upstream base prefix")
          PYVCREG

          grep -Fq \
            '"URL Protocol"=""' \
            "$SYSTEM_REG"

          echo
          echo "Packaged MapleStory registry validation PASSED"

          echo
          echo "=== Validate wine.inf stayed untouched by MapleStory packaging ==="

          grep -Fxq 'share/wine/wine.inf' wcp-files.txt
          tar xJOf "$WCP" share/wine/wine.inf > packaged-wine.inf

          if grep -Fq '[GameNativeMapleStory216150]' packaged-wine.inf; then
            echo "ERROR: old 1.3 live-registry wine.inf injection leaked into 1.8"
            exit 1
          fi

          if grep -Fq 'MapleVCRuntime64' packaged-wine.inf || \
             grep -Fq 'MapleVCRuntime32' packaged-wine.inf; then
            echo "ERROR: broken 1.4 CopyFiles integration leaked into 1.8"
            exit 1
          fi

          echo "wine.inf safety validation PASSED"

          echo
          echo "=== Validate full direct runtime payload inside final WCP ==="

          SYS32=(
            concrt140.dll
            msvcp140.dll
            msvcp140_1.dll
            msvcp140_2.dll
            msvcp140_atomic_wait.dll
            msvcp140_codecvt_ids.dll
            ucrtbase.dll
            vccorlib140.dll
            vcomp140.dll
            vcruntime140.dll
            vcruntime140_1.dll
            vcruntime140_threads.dll
          )

          WOW64=(
            concrt140.dll
            msvcp140.dll
            msvcp140_1.dll
            msvcp140_2.dll
            msvcp140_atomic_wait.dll
            msvcp140_codecvt_ids.dll
            ucrtbase.dll
            vccorlib140.dll
            vcomp140.dll
            vcruntime140.dll
            vcruntime140_threads.dll
          )

          for dll in "${SYS32[@]}"; do
            grep -Fxq "share/wine/maplestory_vc_runtime/system32/$dll" wcp-files.txt
          done

          for dll in "${WOW64[@]}"; do
            grep -Fxq "share/wine/maplestory_vc_runtime/syswow64/$dll" wcp-files.txt
          done

          echo
          echo "=== Validate complete runtime inside packaged prefix ==="

          PREFIX_DRIVE_C="$(find packaged_prefix -type d -name drive_c -print -quit)"
          test -n "$PREFIX_DRIVE_C"

          for dll in "${SYS32[@]}"; do
            test -s "$PREFIX_DRIVE_C/windows/system32/$dll"
          done

          for dll in "${WOW64[@]}"; do
            test -s "$PREFIX_DRIVE_C/windows/syswow64/$dll"
          done

          echo "Packaged/direct full VC runtime validation PASSED"

          echo
          echo "=== Final SHA256 ==="

          sha256sum "$WCP"

          echo
          echo "=========================================="
          echo "WCP validation PASSED"
          echo "=========================================="

      # ============================================================
      # 12. UPLOAD 1.8 WCP
      # ============================================================

      - name: Upload MapleStory full-VC-runtime env-override WCP
        uses: actions/upload-artifact@v4
        with:
          name: proton-11.0-1.8-arm64ec
          path: proton-11.0-1.8-arm64ec.wcp
          if-no-files-found: error
          retention-days: 30
