name: Package MapleStory ARM64EC Checkpoint

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Workflow run ID containing compiled-proton-arm64ec-checkpoint"
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04

    steps:
      - name: Download compiled ARM64EC checkpoint
        uses: actions/download-artifact@v4
        with:
          name: compiled-proton-arm64ec-checkpoint
          path: checkpoint
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}

      - name: Inspect checkpoint
        shell: bash
        run: |
          set -euxo pipefail

          echo "=== Checkpoint top level ==="
          find checkpoint -maxdepth 3 -type d -print | sort | head -200

          echo
          echo "=== Searching for Wine root ==="

          ROOT=""

          if [ -d "checkpoint/bin" ] &&
             [ -d "checkpoint/lib" ] &&
             [ -d "checkpoint/share" ]; then
            ROOT="$GITHUB_WORKSPACE/checkpoint"
          else
            while IFS= read -r candidate; do
              candidate="$(dirname "$candidate")"

              if [ -d "$candidate/lib" ] &&
                 [ -d "$candidate/share" ]; then
                ROOT="$GITHUB_WORKSPACE/$candidate"
                break
              fi
            done < <(find checkpoint -type d -name bin)
          fi

          if [ -z "$ROOT" ]; then
            echo "ERROR: Could not locate checkpoint root containing bin/lib/share"
            exit 1
          fi

          echo "CHECKPOINT_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Found checkpoint root:"
          echo "$ROOT"

          echo
          echo "=== bin contents BEFORE repair ==="
          ls -lah "$ROOT/bin"

      - name: Repair executable permissions
        shell: bash
        run: |
          set -euxo pipefail

          ROOT="$CHECKPOINT_ROOT"

          # GitHub Actions artifacts normally restore files as 0644.
          # Wine launchers must be executable.
          find "$ROOT/bin" -maxdepth 1 -type f -exec chmod 755 {} \;

          echo "=== bin contents AFTER repair ==="
          ls -lah "$ROOT/bin"

      - name: Validate Wine launchers
        shell: bash
        run: |
          set -euxo pipefail

          ROOT="$CHECKPOINT_ROOT"

          echo "=== Wine launcher validation ==="

          test -e "$ROOT/bin/wine"
          test -e "$ROOT/bin/wineserver"

          test -x "$ROOT/bin/wine"
          test -x "$ROOT/bin/wineserver"

          ls -l "$ROOT/bin/wine"
          ls -l "$ROOT/bin/wineserver"

          echo
          file "$ROOT/bin/wine"
          file "$ROOT/bin/wineserver"

          echo
          echo "wine symlink status:"
          if [ -L "$ROOT/bin/wine" ]; then
            readlink "$ROOT/bin/wine"
            readlink -f "$ROOT/bin/wine"
          else
            echo "bin/wine is a regular file"
          fi

          echo
          echo "wineserver symlink status:"
          if [ -L "$ROOT/bin/wineserver" ]; then
            readlink "$ROOT/bin/wineserver"
            readlink -f "$ROOT/bin/wineserver"
          else
            echo "bin/wineserver is a regular file"
          fi

          echo
          echo "=== Broken symlinks, if any ==="
          find "$ROOT" -xtype l -print || true

      - name: Download ARM64EC prefix
        shell: bash
        run: |
          set -euxo pipefail

          wget \
            https://github.com/GameNative/bionic-prefix-files/raw/main/prefixPack-arm64ec.txz \
            -O prefixPack.txz

          test -s prefixPack.txz

      - name: Generate GameNative Proton profile
        shell: bash
        run: |
          set -euxo pipefail

          cat > profile.json <<'EOF'
          {
            "type": "Proton",
            "versionName": "11.0-1-maplestory-arm64ec",
            "versionCode": 2,
            "description": "Proton 11.0-1 ARM64EC - MapleStory SPI and CharPrev compatibility patches",
            "files": [],
            "wine": {
              "binPath": "bin",
              "libPath": "lib",
              "prefixPack": "prefixPack.txz"
            }
          }
          EOF

          cat profile.json

      - name: Build WCP
        shell: bash
        run: |
          set -euxo pipefail

          ROOT="$CHECKPOINT_ROOT"

          cp prefixPack.txz "$ROOT/"
          cp profile.json "$ROOT/"

          cd "$ROOT"

          tar cJf \
            "$GITHUB_WORKSPACE/proton-11.0-1-maplestory-arm64ec.wcp" \
            bin \
            lib \
            share \
            prefixPack.txz \
            profile.json

      - name: Validate final WCP
        shell: bash
        run: |
          set -euxo pipefail

          WCP="proton-11.0-1-maplestory-arm64ec.wcp"

          echo "=== WCP size ==="
          ls -lh "$WCP"

          echo
          echo "=== Profile inside WCP ==="
          tar xJOf "$WCP" profile.json

          echo
          echo "=== Required top-level paths ==="
          tar tJf "$WCP" |
            grep -E '^(bin/|lib/|share/|prefixPack\.txz$|profile\.json$)' |
            head -100

          echo
          echo "=== Wine launchers inside WCP ==="
          tar tvJf "$WCP" |
            grep -E ' bin/(wine|wine64|wineserver)$' || true

          echo
          echo "=== Explicit required-file checks ==="
          tar tJf "$WCP" | grep -qx 'bin/wine'
          tar tJf "$WCP" | grep -qx 'bin/wineserver'

          echo
          echo "WCP validation PASSED"

      - name: Upload corrected WCP
        uses: actions/upload-artifact@v4
        with:
          name: proton-11.0-1-maplestory-arm64ec
          path: proton-11.0-1-maplestory-arm64ec.wcp
          if-no-files-found: error
          retention-days: 30
