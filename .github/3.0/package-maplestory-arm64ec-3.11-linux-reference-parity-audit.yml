          {
              echo
              echo "=== Audit summary ==="
              echo "ReferenceHashCheckStatus=$HASH_CHECK_RC"
              echo "No source files modified."
              echo "No registry values changed."
              echo "No Wine debug enabled."
              echo "OutputFolder=/storage/emulated/0/Download/GN-MS-Parity-3.11"
          } >> "$REPORT"

          echo "[GN-MS-3.11] PARITY AUDIT COMPLETE hash_check_status=$HASH_CHECK_RC"
          echo "[GN-MS-3.11] OUTPUT=/storage/emulated/0/Download/GN-MS-Parity-3.11"
          echo "[GN-MS-3.11] Continuing into TestD3D"

          exec "$INNER_WINE" "$@"
          SHPARITY

          chmod 755 "$ROOT/bin/wine"

          echo
          echo "=== Validate 3.11 parity wrapper ==="

          test -f "$ROOT/bin/wine"
          test ! -L "$ROOT/bin/wine"
          test -x "$ROOT/bin/wine"
          test -x "$INNER_WINE"

          sh -n "$ROOT/bin/wine"
          sh -n "$INNER_WINE"

          grep -Fq 'PARITY AUDIT START trigger=TestD3D' "$ROOT/bin/wine"
          grep -Fq 'GN-MS-Parity-3.11' "$ROOT/bin/wine"
          grep -Fq 'reference-vc-sha256.txt' "$ROOT/bin/wine"
          grep -Fq 'sha256sum -c "$REF_HASHES"' "$ROOT/bin/wine"
          grep -Fq 'Live user.reg parity-relevant lines' "$ROOT/bin/wine"
          grep -Fq 'Live system.reg Nexon protocol lines' "$ROOT/bin/wine"
          grep -Fq 'LD_PRELOAD= "$TOYBOX"' "$ROOT/bin/wine"
          grep -Fq 'exec "$INNER_WINE" "$@"' "$ROOT/bin/wine"
          grep -Fq 'exec "$REAL_WINE" "$@"' "$INNER_WINE"

          # Audit must stay read-only with respect to the live Wine prefix.
          if grep -Fq 'WINEDLLOVERRIDES=' "$ROOT/bin/wine" || \
             grep -Fq 'WINEESYNC=' "$ROOT/bin/wine" || \
             grep -Fq 'WINEDEBUG=' "$ROOT/bin/wine" || \
             grep -Fq 'regedit /S' "$ROOT/bin/wine" || \
             grep -Fq '/proc/' "$ROOT/bin/wine"; then
              echo "ERROR: behavior-changing/process-watching logic leaked into 3.11 wrapper"
              exit 1
          fi

          # No copy command may target the live prefix. The only copies are
          # static reference text files -> Android Downloads.
          if grep -E 'cp .*WINEPREFIX|cp .*DRIVE_C|cp .*WINDOWS' "$ROOT/bin/wine"; then
              echo "ERROR: 3.11 wrapper contains a live-prefix copy mutation"
              exit 1
          fi

          if grep -Fq 'SCRIPT_DIR=$(' "$ROOT/bin/wine"; then
              echo "ERROR: 3.11 wrapper contains stdout-capturing path command substitution"
              exit 1
          fi

          echo "3.11 read-only Linux-reference parity wrapper PASSED"

      # ============================================================
      # 10. CREATE NEW 3.11 GAMENATIVE PROFILE
      # ============================================================

      - name: Generate GameNative Proton profile
        shell: bash
        run: |
          set -euxo pipefail

          cat > profile.json <<'EOF'
          {
            "type": "Proton",
            "versionName": "11.0-3.11-arm64ec",
            "versionCode": 2,
            "description": "MapleStory 3.11 - GE-Proton11-3 ARM64EC game-fixes runtime + known-good 2.2 prefix/runtime/registry state + read-only TestD3D-triggered parity audit against pinned linux_maplestory reference",
            "files": [],
            "wine": {
              "binPath": "bin",
              "libPath": "lib",
              "prefixPack": "prefixPack.txz"
            }
          }
          EOF

          cat profile.json

          grep -Fq \
            '"versionName": "11.0-3.11-arm64ec"' \
            profile.json

          echo "3.11 profile validation PASSED"

      # ============================================================
      # 11. BUILD THE NEW 3.11 WCP
      # ============================================================

      - name: Build WCP
        shell: bash
        run: |
          set -euxo pipefail

          ROOT="$HOME/compiled-files-aarch64"

          cp prefixPack.txz \
            "$ROOT/prefixPack.txz"

          cp profile.json \
            "$ROOT/profile.json"

          cd "$ROOT"

          tar cJf \
            "$GITHUB_WORKSPACE/$WCP_NAME" \
            bin \
            lib \
            share \
            prefixPack.txz \
            profile.json

          ls -lh "$GITHUB_WORKSPACE/$WCP_NAME"

      # ============================================================
      # 12. VALIDATE FINAL 3.11 WCP
      # ============================================================

      - name: Validate final WCP
        shell: bash
        run: |
          set -euxo pipefail

          WCP="$GITHUB_WORKSPACE/$WCP_NAME"

          test -f "$WCP"
          test -s "$WCP"
          xz -t "$WCP"

          tar tJf "$WCP" > wcp-files.txt

          for f in \
            bin/wine \
            bin/wine.2.2-registry \
            bin/wine.real \
            bin/wineserver \
            lib/wine/aarch64-unix/wine \
            share/wine/maplestory_parity_3_11/reference-vc-sha256.txt \
            share/wine/maplestory_parity_3_11/reference-10-nexon-launcher-protocol.reg \
            share/wine/maplestory_parity_3_11/reference-11-wine-direct3d-dll-overrides.reg \
            share/wine/maplestory_parity_3_11/reference-13-apply-runtime-file-patches.sh \
            share/wine/maplestory_parity_3_11/reference-mappings.ini \
            share/wine/maplestory_parity_3_11/reference-apps-settings.db \
            share/wine/maplestory_parity_3_11/reference-commit.txt \
            share/wine/maplestory_registry_recovery_2_2/baseline-values.txt \
            share/wine/maplestory_registry_recovery_2_2/baseline-status.txt \
            share/wine/maplestory_registry_recovery_2_2/repair-user-reg.sh \
            prefixPack.txz \
            profile.json
          do
            grep -Fxq "$f" wcp-files.txt
            echo "FOUND: $f"
          done

          if grep -Fq 'share/wine/maplestory_diag_' wcp-files.txt; then
            echo "ERROR: stale process watcher payload leaked into 3.11"
            exit 1
          fi

          if grep -Fq 'share/wine/maplestory_collector_3_9/' wcp-files.txt; then
            echo "ERROR: stale 3.9 collector helper leaked into 3.11"
            exit 1
          fi

          tar xJOf "$WCP" profile.json > packaged-profile.json
          grep -Fq \
            '"versionName": "11.0-3.11-arm64ec"' \
            packaged-profile.json

          rm -rf wcp_validation
          mkdir -p wcp_validation

          tar xJf "$WCP" \
            -C wcp_validation \
            bin/wine \
            bin/wine.2.2-registry \
            bin/wine.real \
            bin/wineserver \
            lib/wine/aarch64-unix/wine \
            share/wine/maplestory_parity_3_11/reference-vc-sha256.txt \
            share/wine/maplestory_parity_3_11/reference-10-nexon-launcher-protocol.reg \
            share/wine/maplestory_parity_3_11/reference-11-wine-direct3d-dll-overrides.reg \
            share/wine/maplestory_parity_3_11/reference-13-apply-runtime-file-patches.sh \
            share/wine/maplestory_parity_3_11/reference-mappings.ini \
            share/wine/maplestory_parity_3_11/reference-apps-settings.db \
            share/wine/maplestory_parity_3_11/reference-commit.txt \
            share/wine/maplestory_registry_recovery_2_2/baseline-values.txt \
            share/wine/maplestory_registry_recovery_2_2/baseline-status.txt \
            share/wine/maplestory_registry_recovery_2_2/repair-user-reg.sh

          test -f wcp_validation/bin/wine
          test ! -L wcp_validation/bin/wine
          test -x wcp_validation/bin/wine
          test -x wcp_validation/bin/wine.2.2-registry
          test -L wcp_validation/bin/wine.real
          test -e wcp_validation/bin/wine.real
          test -x wcp_validation/bin/wine.real
          test "$(readlink wcp_validation/bin/wine.real)" = "../lib/wine/aarch64-unix/wine"
          test -x wcp_validation/bin/wineserver
          test -x wcp_validation/lib/wine/aarch64-unix/wine
          test -x wcp_validation/share/wine/maplestory_registry_recovery_2_2/repair-user-reg.sh

          sh -n wcp_validation/bin/wine
          sh -n wcp_validation/bin/wine.2.2-registry
          sh -n wcp_validation/share/wine/maplestory_registry_recovery_2_2/repair-user-reg.sh

          test "$(wc -l < wcp_validation/share/wine/maplestory_parity_3_11/reference-vc-sha256.txt)" -eq 23
          grep -Fq 'MapleStory.exe=MapleStory' \
            wcp_validation/share/wine/maplestory_parity_3_11/reference-mappings.ini
          grep -Fq '{"locale":"en_US"}' \
            wcp_validation/share/wine/maplestory_parity_3_11/reference-apps-settings.db
          grep -Fq '[HKEY_CURRENT_USER\Software\Wine\DllOverrides]' \
            wcp_validation/share/wine/maplestory_parity_3_11/reference-11-wine-direct3d-dll-overrides.reg
          grep -Fq '[HKEY_LOCAL_MACHINE\Software\Classes\nxl]' \
            wcp_validation/share/wine/maplestory_parity_3_11/reference-10-nexon-launcher-protocol.reg

          grep -Fq 'PARITY AUDIT START trigger=TestD3D' wcp_validation/bin/wine
          grep -Fq '/storage/emulated/0/Download/GN-MS-Parity-3.11' wcp_validation/bin/wine
          grep -Fq 'reference-vc-sha256.txt' wcp_validation/bin/wine
          grep -Fq 'sha256sum -c "$REF_HASHES"' wcp_validation/bin/wine
          grep -Fq 'LD_PRELOAD= "$TOYBOX"' wcp_validation/bin/wine
          grep -Fq 'exec "$INNER_WINE" "$@"' wcp_validation/bin/wine
          grep -Fq '*TestD3D.exe*' wcp_validation/bin/wine

          if grep -Fq 'WINEDLLOVERRIDES=' wcp_validation/bin/wine || \
             grep -Fq 'WINEESYNC=' wcp_validation/bin/wine || \
             grep -Fq 'WINEDEBUG=' wcp_validation/bin/wine || \
             grep -Fq 'regedit /S' wcp_validation/bin/wine || \
             grep -Fq '/proc/' wcp_validation/bin/wine; then
              echo "ERROR: behavior-changing/process-watching logic leaked into packaged 3.11 parity wrapper"
              exit 1
          fi

          grep -Fq 'Restoring VC DllOverrides baseline' wcp_validation/bin/wine.2.2-registry
          grep -Fq 'Registry recovery complete; VC DllOverrides match Proton 11 baseline' wcp_validation/bin/wine.2.2-registry
          grep -Fq 'exec "$REAL_WINE" "$@"' wcp_validation/bin/wine.2.2-registry

          if grep -Fq 'WINEDLLOVERRIDES=' wcp_validation/bin/wine || \
             grep -Fq 'WINEESYNC=' wcp_validation/bin/wine || \
             grep -Fq 'WINEDEBUG=' wcp_validation/bin/wine || \
             grep -Fq 'regedit /S' wcp_validation/bin/wine; then
              echo "ERROR: behavior-changing Wine setting leaked into packaged 3.11 parity wrapper wrapper"
              exit 1
          fi

          if grep -Eq '(^|[[:space:]])cmp([[:space:]]|$)' wcp_validation/bin/wine; then
              echo "ERROR: packaged 3.8 guest wrapper depends on cmp"
              exit 1
          fi

          echo "=== Packaged upstream DllOverrides baseline ==="
          cat wcp_validation/share/wine/maplestory_registry_recovery_2_2/baseline-status.txt

          # Confirm 2.2 did not mutate wine.inf for live-prefix recovery.
          grep -Fxq 'share/wine/wine.inf' wcp-files.txt
          tar xJOf "$WCP" share/wine/wine.inf > packaged-wine.inf

          if grep -Fq 'GameNativeMapleStory216150Recovery' packaged-wine.inf; then
              echo "ERROR: live registry recovery leaked into wine.inf"
              exit 1
          fi

          if grep -Fq 'MapleVCRuntime64' packaged-wine.inf || \
             grep -Fq 'MapleVCRuntime32' packaged-wine.inf; then
              echo "ERROR: broken 1.4 runtime CopyFiles integration leaked into 3.11"
              exit 1
          fi

          # Packaged prefix remains the controlled 1.6-compatible state for
          # genuinely new prefixes: MapleStory registry fixes plus only
          # vcruntime140_threads.dll added to the untouched VC file baseline.
          tar xJOf "$WCP" prefixPack.txz > packaged-prefix.txz
          rm -rf packaged_prefix packaged_base_prefix
          mkdir -p packaged_prefix packaged_base_prefix
          tar xJf packaged-prefix.txz -C packaged_prefix
          tar xJf prefixPack-base.txz -C packaged_base_prefix

          PREFIX_DRIVE_C="$(find packaged_prefix -type d -name drive_c -print -quit)"
          BASE_DRIVE_C="$(find packaged_base_prefix -type d -name drive_c -print -quit)"
          USER_REG="$(find packaged_prefix -type f -name user.reg -print -quit)"
          SYSTEM_REG="$(find packaged_prefix -type f -name system.reg -print -quit)"

          test -n "$PREFIX_DRIVE_C"
          test -n "$BASE_DRIVE_C"
          test -n "$USER_REG"
          test -n "$SYSTEM_REG"

          grep -Fq '"UseTakeFocus"="N"' "$USER_REG"
          grep -Fq '"UseLinuxInputEvents"="Y"' "$USER_REG"
          grep -Fq '"KeyboardUseNonExclusive"="Y"' "$USER_REG"
          grep -Fq '"MouseUseNonExclusive"="Y"' "$USER_REG"
          grep -Fq '"Version"="win10"' "$USER_REG"
          grep -Fq '"cb_access_map_w"=dword:00000001' "$USER_REG"
          grep -Fq '"CSMT"="disabled"' "$USER_REG"
          grep -Fq '"URL Protocol"=""' "$SYSTEM_REG"

          SYS32_LIST='concrt140.dll msvcp140.dll msvcp140_1.dll msvcp140_2.dll msvcp140_atomic_wait.dll msvcp140_codecvt_ids.dll ucrtbase.dll vccorlib140.dll vcomp140.dll vcruntime140.dll vcruntime140_1.dll'
          WOW64_LIST='concrt140.dll msvcp140.dll msvcp140_1.dll msvcp140_2.dll msvcp140_atomic_wait.dll msvcp140_codecvt_ids.dll ucrtbase.dll vccorlib140.dll vcomp140.dll vcruntime140.dll'

          for DLL in $SYS32_LIST; do
            BASE="$BASE_DRIVE_C/windows/system32/$DLL"
            GOT="$PREFIX_DRIVE_C/windows/system32/$DLL"
            if [ -f "$BASE" ]; then
              test -f "$GOT"
              cmp -s "$BASE" "$GOT"
            else
              test ! -e "$GOT"
            fi
          done

          for DLL in $WOW64_LIST; do
            BASE="$BASE_DRIVE_C/windows/syswow64/$DLL"
            GOT="$PREFIX_DRIVE_C/windows/syswow64/$DLL"
            if [ -f "$BASE" ]; then
              test -f "$GOT"
              cmp -s "$BASE" "$GOT"
            else
              test ! -e "$GOT"
            fi
          done

          cmp -s \
            "$GITHUB_WORKSPACE/maplestory_reference/files/vc_runtime/system32/vcruntime140_threads.dll" \
            "$PREFIX_DRIVE_C/windows/system32/vcruntime140_threads.dll"

          cmp -s \
            "$GITHUB_WORKSPACE/maplestory_reference/files/vc_runtime/syswow64/vcruntime140_threads.dll" \
            "$PREFIX_DRIVE_C/windows/syswow64/vcruntime140_threads.dll"

          echo "Packaged prefix validation PASSED"

          sha256sum "$WCP"

          echo "=========================================="
          echo "3.11 WCP validation PASSED"
          echo "=========================================="

      # ============================================================
      # 13. UPLOAD 3.11 WCP
      # ============================================================

      - name: Upload MapleStory 3.11 Linux Reference Parity Audit WCP
        uses: actions/upload-artifact@v4
        with:
          name: proton-11.0-3.11-arm64ec
          path: proton-11.0-3.11-arm64ec.wcp
          if-no-files-found: error
          retention-days: 30
