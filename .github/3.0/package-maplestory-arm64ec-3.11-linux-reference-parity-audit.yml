                "$USER_REG" >> "$REPORT" 2>&1 || true
          else
              echo "MISSING user.reg" >> "$REPORT"
          fi

          {
              echo
              echo "=== Live system.reg Nexon protocol lines ==="
          } >> "$REPORT"

          if [ -f "$SYSTEM_REG" ]; then
              LD_PRELOAD= "$TOYBOX" grep -n -i -E \
