name: Package MapleStory ARM64EC 3.11 Linux Reference Parity Audit

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful 3.1 workflow run ID containing compiled-proton-arm64ec-ge11.0-3-gamefixes-checkpoint"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  package:
    runs-on: ubuntu-24.04

    env:
      # Reuse the already-compiled GE-Proton11-3 ARM64EC game-fixes runtime.
      # This workflow does NOT rebuild Wine.
      CHECKPOINT_ARTIFACT: "compiled-proton-arm64ec-ge11.0-3-gamefixes-checkpoint"

      # Exact GameNative Proton 11 ARM64EC prefix-pack commit used by 3.1/2.2.
      PREFIX_COMMIT: "450f670aa65243b2e7b5364d9577eb23f17b6855"

      # Same pinned Microsoft runtime payload source used by 2.2/3.1.
      RUNTIME_COMMIT: "181cd74cf51db5fd2563ec81359a94db9a2ada32"

      CUSTOM_VERSION: "11.0-3.11-arm64ec"
      WCP_NAME: "proton-11.0-3.11-arm64ec.wcp"

    steps:
      # ============================================================
      # 1. RESTORE THE SUCCESSFUL 3.1 COMPILED CHECKPOINT
      # ============================================================

      - name: Download 3.1 compiled ARM64EC checkpoint
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.CHECKPOINT_ARTIFACT }}
          path: checkpoint_download
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.source_run_id }}

      - name: Restore and validate 3.1 compiled runtime
        shell: bash
        run: |
          set -euxo pipefail

          CHECKPOINT="$(find checkpoint_download -type f -name 'compiled-proton-checkpoint.tar' -print -quit)"
          test -n "$CHECKPOINT"
          test -s "$CHECKPOINT"

          ROOT="$HOME/compiled-files-aarch64"
          rm -rf "$ROOT"
          mkdir -p "$ROOT"

          tar -C "$ROOT" -xf "$CHECKPOINT"

          test -d "$ROOT/bin"
          test -d "$ROOT/lib"
          test -d "$ROOT/share"
          test -L "$ROOT/bin/wine"
          test "$(readlink "$ROOT/bin/wine")" = "../lib/wine/aarch64-unix/wine"
          test -e "$ROOT/bin/wine"
          test -x "$ROOT/bin/wine"
          test -x "$ROOT/bin/wineserver"
          test -x "$ROOT/lib/wine/aarch64-unix/wine"

          chmod 755 "$ROOT/lib/wine/aarch64-unix/wine"
          chmod 755 "$ROOT/bin/wineserver"
          find "$ROOT/bin" -maxdepth 1 -type f -name 'wine*' -exec chmod 755 {} \;

          echo "=== Reused 3.1 GE-Proton11-3 compiled runtime ==="
          du -sh "$ROOT"
          ls -lah "$ROOT/bin" | sed -n '1,100p'
          sha256sum "$CHECKPOINT"

          echo "3.1 compiled checkpoint restore PASSED"

      # ============================================================
      # From here onward, reproduce the known-good 3.1 packaging state,
      # then add only the observation-only 3.8 MapleStory hot-exit watcher.
      # ============================================================

      - name: Checkout pinned MapleStory VC runtime payload
        uses: actions/checkout@v4
        with:
          repository: oldschoola/linux_maplestory
          ref: ${{ env.RUNTIME_COMMIT }}
          path: maplestory_reference
          sparse-checkout: |
            files/vc_runtime
            patches/10-nexon-launcher-protocol.reg
            patches/11-wine-direct3d-dll-overrides.reg
            patches/13-apply-runtime-file-patches.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Validate pinned VC runtime payload
        shell: bash
        run: |
          set -euxo pipefail

          ROOT="$GITHUB_WORKSPACE/maplestory_reference/files/vc_runtime"

          SYS32=(
            concrt140.dll
            msvcp140.dll
            msvcp140_1.dll
            msvcp140_2.dll
            msvcp140_atomic_wait.dll
            msvcp140_codecvt_ids.dll
            ucrtbase.dll
            vccorlib140.dll
            vcomp140.dll
            vcruntime140.dll
            vcruntime140_1.dll
            vcruntime140_threads.dll
          )

          WOW64=(
            concrt140.dll
            msvcp140.dll
            msvcp140_1.dll
            msvcp140_2.dll
            msvcp140_atomic_wait.dll
            msvcp140_codecvt_ids.dll
            ucrtbase.dll
            vccorlib140.dll
            vcomp140.dll
            vcruntime140.dll
            vcruntime140_threads.dll
          )

          for dll in "${SYS32[@]}"; do
            test -s "$ROOT/system32/$dll"
          done

          for dll in "${WOW64[@]}"; do
            test -s "$ROOT/syswow64/$dll"
          done

          echo "=== Runtime payload commit ==="
          git -C "$GITHUB_WORKSPACE/maplestory_reference" rev-parse HEAD
          test "$(git -C "$GITHUB_WORKSPACE/maplestory_reference" rev-parse HEAD)" = "$RUNTIME_COMMIT"

          echo
          echo "=== system32 payload ==="
          for dll in "${SYS32[@]}"; do
            file "$ROOT/system32/$dll"
            sha256sum "$ROOT/system32/$dll"
          done

          echo
          echo "=== syswow64 payload ==="
          for dll in "${WOW64[@]}"; do
            file "$ROOT/syswow64/$dll"
            sha256sum "$ROOT/syswow64/$dll"
          done

          echo
          echo
          echo "=== Build pinned Linux-reference parity bundle ==="

          PARITY_ROOT="$HOME/compiled-files-aarch64/share/wine/maplestory_parity_3_11"
          rm -rf "$PARITY_ROOT"
          mkdir -p "$PARITY_ROOT"

          cp "$GITHUB_WORKSPACE/maplestory_reference/patches/10-nexon-launcher-protocol.reg" \
            "$PARITY_ROOT/reference-10-nexon-launcher-protocol.reg"

          cp "$GITHUB_WORKSPACE/maplestory_reference/patches/11-wine-direct3d-dll-overrides.reg" \
            "$PARITY_ROOT/reference-11-wine-direct3d-dll-overrides.reg"

          cp "$GITHUB_WORKSPACE/maplestory_reference/patches/13-apply-runtime-file-patches.sh" \
            "$PARITY_ROOT/reference-13-apply-runtime-file-patches.sh"

          printf '%s\n' \
            'MapleStory.exe=MapleStory' \
            'nexon_client.exe=Nexon Launcher' \
            'nexon_updater.exe=Nexon Updater' \
            > "$PARITY_ROOT/reference-mappings.ini"

          printf '%s' '{"locale":"en_US"}' \
            > "$PARITY_ROOT/reference-apps-settings.db"

          printf '%s\n' "$RUNTIME_COMMIT" \
            > "$PARITY_ROOT/reference-commit.txt"

          : > "$PARITY_ROOT/reference-vc-sha256.txt"

          for dll in "${SYS32[@]}"; do
            sha256sum "$ROOT/system32/$dll" \
              | sed "s#  $ROOT/system32/#  system32/#" \
              >> "$PARITY_ROOT/reference-vc-sha256.txt"
          done

          for dll in "${WOW64[@]}"; do
            sha256sum "$ROOT/syswow64/$dll" \
              | sed "s#  $ROOT/syswow64/#  syswow64/#" \
              >> "$PARITY_ROOT/reference-vc-sha256.txt"
          done

          test "$(wc -l < "$PARITY_ROOT/reference-vc-sha256.txt")" -eq 23
          test -s "$PARITY_ROOT/reference-10-nexon-launcher-protocol.reg"
          test -s "$PARITY_ROOT/reference-11-wine-direct3d-dll-overrides.reg"
          test -s "$PARITY_ROOT/reference-13-apply-runtime-file-patches.sh"
          test -s "$PARITY_ROOT/reference-mappings.ini"
          test -s "$PARITY_ROOT/reference-apps-settings.db"
          test -s "$PARITY_ROOT/reference-commit.txt"

          echo "Pinned VC runtime payload validation PASSED"

      # ============================================================
      # 5. DOWNLOAD THE CORRECT PROTON 11 ARM64EC PREFIX
      #
      # IMPORTANT:
      # Use prefixPack-arm64ec-11.txz.
      # Do NOT use the generic prefixPack-arm64ec.txz.
      # ============================================================

      - name: Download GameNative Proton 11 ARM64EC prefix
        shell: bash
        run: |
          set -euxo pipefail

          wget \
            https://raw.githubusercontent.com/GameNative/bionic-prefix-files/450f670aa65243b2e7b5364d9577eb23f17b6855/prefixPack-arm64ec-11.txz \
            -O prefixPack-base.txz

          test -s prefixPack-base.txz

          echo
          echo "=== Base prefix pack ==="

          ls -lh prefixPack-base.txz
          file prefixPack-base.txz
          sha256sum prefixPack-base.txz

      # ============================================================
      # 6. APPLY THE MAPLESTORY REGISTRY FIXES
      #
      # Carry forward the known-good registry layer unchanged.
      # The only runtime payload remains vcruntime140_threads.dll.
      # The Wine rebuild already occurred above; no additional source changes here.
      # ============================================================

      - name: Patch MapleStory registry settings into prefix
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf prefix_work
          mkdir -p prefix_work

          tar -xJf prefixPack-base.txz \
            -C prefix_work

          echo "=== Prefix structure ==="

          find prefix_work \
            -maxdepth 3 \
            -type f \
            -printf '%p\n' \
            > prefix-files-before.txt

          sed -n '1,150p' prefix-files-before.txt

          USER_REG="$(find prefix_work -type f -name user.reg -print -quit)"
          SYSTEM_REG="$(find prefix_work -type f -name system.reg -print -quit)"
          USERDEF_REG="$(find prefix_work -type f -name userdef.reg -print -quit || true)"

          if [ -z "$USER_REG" ]; then
            echo "ERROR: user.reg not found in prefix."
            exit 1
          fi

          if [ -z "$SYSTEM_REG" ]; then
            echo "ERROR: system.reg not found in prefix."
            exit 1
          fi

          echo
          echo "=== Registry hives ==="

          echo "user.reg:    $USER_REG"
          echo "system.reg:  $SYSTEM_REG"
          echo "userdef.reg: ${USERDEF_REG:-not present}"

          python3 - \
            "$USER_REG" \
            "$SYSTEM_REG" \
            "${USERDEF_REG:-}" <<'PY'
          import re
          import sys
          from pathlib import Path

          user_reg = Path(sys.argv[1])
          system_reg = Path(sys.argv[2])
          userdef_arg = sys.argv[3]
          userdef_reg = Path(userdef_arg) if userdef_arg else None


          def string_value(value):
              value = value.replace("\\", "\\\\")
              value = value.replace('"', '\\"')
              return f'"{value}"'


          def value_name(name):
              if name is None:
                  return "@"

              escaped = name.replace("\\", "\\\\")
              escaped = escaped.replace('"', '\\"')

              return f'"{escaped}"'


          def render(name, kind, value):
              prefix = value_name(name) + "="

              if kind == "str":
                  return prefix + string_value(value)

              if kind == "dword":
                  return prefix + f"dword:{value:08x}"

              raise ValueError(f"Unknown value type: {kind}")


          # Wine's internal registry-file format is similar to REGEDIT.
          # These paths are relative to HKCU inside user.reg.

          USER_PATCHES = {
              r"Software\\Wine\\X11 Driver": {
                  "UseTakeFocus": ("str", "N"),
                  "Grab": ("str", "N"),
                  "GrabFullscreen": ("str", "N"),
                  "UseLinuxInputEvents": ("str", "Y"),
              },

              r"Software\\Wine\\DirectInput": {
                  "UseLinuxInputEvents": ("str", "Y"),
                  "KeyboardUseNonExclusive": ("str", "Y"),
                  "MouseUseNonExclusive": ("str", "Y"),
              },

              r"Software\\Wine\\AppDefaults\\MapleStory.exe": {
                  "Version": ("str", "win10"),
              },

              r"Software\\Wine\\AppDefaults\\nxsteam.exe": {
                  "Version": ("str", "win10"),
              },

              r"Software\\Wine\\AppDefaults\\SteamConnectorHelper.exe": {
                  "Version": ("str", "win10"),
              },

              r"Software\\Nexon Launcher": {
                  "Install Directory": ("str", r"C:\Nexon\Launcher"),
                  "Region": ("str", "1"),
                  "User Data": (
                      "str",
                      '{"setup-id":"372e7640-20f4-419c-ada0-4ad0d76c33d9","time":1748271149}',
                  ),
              },

              r"Software\\Wine\\Direct3D": {
                  "cb_access_map_w": ("dword", 1),
                  "CSMT": ("str", "disabled"),
              },
          }


          # These paths are relative to HKLM inside system.reg.

          SYSTEM_PATCHES = {
              r"Software\\Classes\\Applications\\nexon_launcher.exe\\shell\\open": {
                  "FriendlyAppName": ("str", "Nexon Launcher"),
              },

              r"Software\\Classes\\nxl": {
                  None: ("str", "URL:nxl protocol"),
                  "URL Protocol": ("str", ""),
              },

              r"Software\\Classes\\nxl\\DefaultIcon": {
                  None: ("str", r"C:\Nexon\Launcher\nexon_launcher.exe"),
              },

              r"Software\\Classes\\nxl\\shell": {
                  None: ("str", ""),
              },

              r"Software\\Classes\\nxl\\shell\\open": {
                  None: ("str", ""),
                  "Friendly App Name": ("str", "Nexon Launcher"),
              },

              r"Software\\Classes\\nxl\\shell\\open\\command": {
                  None: (
                      "str",
                      r'"C:\Nexon\Launcher\nexon_launcher.exe" "%1"',
                  ),
              },

              r"Software\\Wow6432Node\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\Nexon Nexon Launcher": {
                  "DisplayIcon": (
                      "str",
                      r'"C:\Nexon\Launcher\logo.ico"',
                  ),
                  "DisplayName": (
                      "str",
                      "Nexon Launcher",
                  ),
                  "DisplayVersion": (
                      "str",
                      "2.3.0",
                  ),
                  "EstimatedSize": (
                      "dword",
                      0x2B48,
                  ),
                  "HelpLink": (
                      "str",
                      r'"http://www.nexon.net/legal/terms-of-use/"',
                  ),
                  "InstallLocation": (
                      "str",
                      r'"C:\Nexon\Launcher"',
                  ),
                  "NoModify": (
                      "dword",
                      1,
                  ),
                  "NoRepair": (
                      "dword",
                      1,
                  ),
                  "Publisher": (
                      "str",
                      "Nexon",
                  ),
                  "QuietUninstallString": (
                      "str",
                      r'"C:\Nexon\Launcher\uninstall.exe" /S',
                  ),
                  "UninstallString": (
                      "str",
                      r'"C:\Nexon\Launcher\uninstall.exe"',
                  ),
                  "URLInfoAbout": (
                      "str",
                      r'"http://www.nexon.net"',
                  ),
                  "URLUpdateInfo": (
                      "str",
                      r'"http://www.nexon.net"',
                  ),
                  "VersionMajor": (
                      "dword",
                      2,
                  ),
                  "VersionMinor": (
                      "dword",
                      3,
                  ),
              },
          }


          section_re = re.compile(r"^\[([^\]]+)\](?:\s+.*)?$")


          def find_section(lines, section):
              for index, line in enumerate(lines):
                  match = section_re.match(line)

                  if match and match.group(1) == section:
                      start = index

                      end = len(lines)

                      for next_index in range(index + 1, len(lines)):
                          if section_re.match(lines[next_index]):
                              end = next_index
                              break

                      return start, end

              return None


          def patch_hive(path, patches):
              print(f"Patching {path}")

              text = path.read_text(
                  encoding="utf-8",
                  errors="strict",
              )

              lines = text.splitlines()

              for section, values in patches.items():

                  current = find_section(lines, section)

                  if current is None:
                      if lines and lines[-1] != "":
                          lines.append("")

                      # Modification time is optional in Wine registry v2.
                      lines.append(f"[{section}]")

                      for name, (kind, value) in values.items():
                          lines.append(
                              render(
                                  name,
                                  kind,
                                  value,
                              )
                          )

                      continue

                  for name, (kind, value) in values.items():

                      desired = render(
                          name,
                          kind,
                          value,
                      )

                      token = value_name(name) + "="

                      start, end = find_section(
                          lines,
                          section,
                      )

                      replaced = False

                      for line_index in range(
                          start + 1,
                          end,
                      ):
                          if lines[line_index].startswith(token):
                              lines[line_index] = desired
                              replaced = True
                              break

                      if not replaced:
                          lines.insert(
                              end,
                              desired,
                          )

              path.write_text(
                  "\n".join(lines) + "\n",
                  encoding="utf-8",
              )


          def verify_hive(path, patches):
              text = path.read_text(
                  encoding="utf-8",
                  errors="strict",
              )

              for section, values in patches.items():

                  if f"[{section}]" not in text:
                      # Existing Wine-generated sections may include
                      # modification timestamps after the closing bracket.
                      section_found = False

                      for line in text.splitlines():
                          match = section_re.match(line)

                          if match and match.group(1) == section:
                              section_found = True
                              break

                      if not section_found:
                          raise RuntimeError(
                              f"Missing registry section {section} in {path}"
                          )

                  for name, (kind, value) in values.items():
                      wanted = render(
                          name,
                          kind,
                          value,
                      )

                      if wanted not in text:
                          raise RuntimeError(
                              f"Missing registry value {wanted} in {path}"
                          )

              print(f"Verified {path}")


          patch_hive(
              user_reg,
              USER_PATCHES,
          )

          patch_hive(
              system_reg,
              SYSTEM_PATCHES,
          )

          # Keep default-user settings consistent if this hive exists.
          if userdef_reg and userdef_reg.exists():
              patch_hive(
                  userdef_reg,
                  USER_PATCHES,
              )

          verify_hive(
              user_reg,
              USER_PATCHES,
          )

          verify_hive(
              system_reg,
              SYSTEM_PATCHES,
          )

          if userdef_reg and userdef_reg.exists():
              verify_hive(
                  userdef_reg,
                  USER_PATCHES,
              )

          print()
          print("MapleStory registry patch validation PASSED")
          PY

          echo
          echo "=== Repacking modified prefix ==="

          tar cJf prefixPack.txz \
            -C prefix_work \
            .

          test -s prefixPack.txz

          echo
          echo "=== Modified prefix pack ==="

          ls -lh prefixPack.txz
          sha256sum prefixPack.txz

          echo
          echo "=== Modified prefix contents ==="

          tar tJf prefixPack.txz \
            > modified-prefix-files.txt

          grep -E \
            '(^|/)(user|userdef|system)\.reg$' \
            modified-prefix-files.txt

          echo
          echo "Prefix registry patch PASSED"

      # ============================================================
      # 7. ADD ONLY vcruntime140_threads.dll TO THE PACKAGED PREFIX
      #
      # Known-good 1.6 runtime variable:
      #   - system32/vcruntime140_threads.dll
      #   - syswow64/vcruntime140_threads.dll
      #
      # We deliberately do NOT replace ucrtbase.dll or the rest of the
      # VC runtime set yet. Earlier MapleStory logs already showed several
      # v14 runtime DLLs loading, while vcruntime140_threads.dll was not
      # observed. This keeps the experiment narrow and reversible.
      # ============================================================

      - name: Add vcruntime140_threads.dll to packaged prefix
        shell: bash
        run: |
          set -euxo pipefail

          PAYLOAD="$GITHUB_WORKSPACE/maplestory_reference/files/vc_runtime"

          rm -rf prefix_runtime_work
          mkdir -p prefix_runtime_work

          tar -xJf prefixPack.txz \
            -C prefix_runtime_work

          DRIVE_C="$(find prefix_runtime_work -type d -name drive_c -print -quit)"

          if [ -z "$DRIVE_C" ]; then
            echo "ERROR: drive_c not found in prefix pack"
            exit 1
          fi

          mkdir -p \
            "$DRIVE_C/windows/system32" \
            "$DRIVE_C/windows/syswow64"

          cp -f \
            "$PAYLOAD/system32/vcruntime140_threads.dll" \
            "$DRIVE_C/windows/system32/vcruntime140_threads.dll"

          cp -f \
            "$PAYLOAD/syswow64/vcruntime140_threads.dll" \
            "$DRIVE_C/windows/syswow64/vcruntime140_threads.dll"

          cmp -s \
            "$PAYLOAD/system32/vcruntime140_threads.dll" \
            "$DRIVE_C/windows/system32/vcruntime140_threads.dll"

          cmp -s \
            "$PAYLOAD/syswow64/vcruntime140_threads.dll" \
            "$DRIVE_C/windows/syswow64/vcruntime140_threads.dll"

          tar cJf prefixPack.txz \
            -C prefix_runtime_work \
            .

          test -s prefixPack.txz

          echo
          echo "Packaged-prefix vcruntime140_threads.dll injection PASSED"

      # ============================================================
      # 8. STAGE REGISTRY-ONLY RECOVERY FOR THE EXISTING LIVE PREFIX
      #
      # The failed 1.7 nested regedit may have persisted some/all of the
      # ten VC runtime native,builtin overrides into the existing user.reg.
      # 2.0 restored the runtime files before its guest-side cmp failure,
      # but its wine.inf registry recovery never got a chance to run.
      #
      # 2.2 therefore changes ONLY those ten values in the live
      # Software\\Wine\\DllOverrides section. It derives their exact
      # baseline from untouched prefixPack-arm64ec-11.txz at build time.
      #
      # IMPORTANT:
      #   - No nested Wine/regedit invocation.
      #   - No wine.inf mutation.
      #   - No WINEDLLOVERRIDES.
      #   - No live VC runtime copying.
      #   - No esync / DXVK / Turnip changes.
      #   - Recovery intentionally also runs for TestD3D.
      # ============================================================

      - name: Stage 2.2 live-prefix VC DllOverrides recovery
        shell: bash
        run: |
          set -euxo pipefail

          ROOT="$HOME/compiled-files-aarch64"
          RECOVERY_ROOT="$ROOT/share/wine/maplestory_registry_recovery_2_2"

          test -x "$ROOT/lib/wine/aarch64-unix/wine"

          rm -rf recovery_registry_base "$RECOVERY_ROOT"
          mkdir -p recovery_registry_base "$RECOVERY_ROOT"

          tar -xJf prefixPack-base.txz \
            -C recovery_registry_base

          BASE_USER_REG="$(find recovery_registry_base -type f -name user.reg -print -quit)"
          test -n "$BASE_USER_REG"
          test -s "$BASE_USER_REG"

          # Extract only the ten values that 1.7 attempted to force.
          # baseline-values.txt contains the exact raw Wine-registry lines
          # present upstream; omitted values are intentionally absent.
          python3 - \
            "$BASE_USER_REG" \
            "$RECOVERY_ROOT/baseline-values.txt" \
            "$RECOVERY_ROOT/baseline-status.txt" <<'PYBASE'
          import re
          import sys
          from pathlib import Path

          user_reg = Path(sys.argv[1])
          values_out = Path(sys.argv[2])
          status_out = Path(sys.argv[3])

          section = r"Software\\Wine\\DllOverrides"
          targets = [
              "concrt140",
              "msvcp140",
              "msvcp140_1",
              "msvcp140_2",
              "msvcp140_atomic_wait",
              "msvcp140_codecvt_ids",
              "ucrtbase",
              "vcomp140",
              "vcruntime140",
              "vcruntime140_1",
          ]
          target_set = set(targets)

          lines = user_reg.read_text(encoding="utf-8", errors="strict").splitlines()
          section_re = re.compile(r"^\[([^\]]+)\](?:\s+.*)?$")
          value_re = re.compile(r'^"([^"]+)"=(.*)$')

          in_section = False
          found = {}

          for line in lines:
              match = section_re.match(line)
              if match:
                  in_section = match.group(1) == section
                  continue

              if not in_section:
                  continue

              match = value_re.match(line)
              if not match:
                  continue

              name = match.group(1).lower()
              if name not in target_set:
                  continue

              if name in found:
                  raise RuntimeError(f"Duplicate upstream DllOverrides value: {name}")

              found[name] = line

          baseline_lines = [found[name] for name in targets if name in found]

          values_out.write_text(
              "\n".join(baseline_lines) + ("\n" if baseline_lines else ""),
              encoding="utf-8",
          )

          status_lines = []
          for name in targets:
              if name in found:
                  status_lines.append(f"present {name} {found[name]}")
              else:
                  status_lines.append(f"absent {name}")

          status_out.write_text("\n".join(status_lines) + "\n", encoding="utf-8")

          print("=== Upstream VC DllOverrides baseline ===")
          print(status_out.read_text(encoding="utf-8"), end="")
          PYBASE

          test -f "$RECOVERY_ROOT/baseline-values.txt"
          test -s "$RECOVERY_ROOT/baseline-status.txt"

          cat > "$RECOVERY_ROOT/repair-user-reg.sh" <<'SHREPAIR'
          #!/bin/sh
          # Restore only the ten MapleStory VC runtime DllOverrides values in
          # a Wine user.reg file. This intentionally uses simple POSIX shell
          # operations available in GameNative's bionic guest.

          USER_REG="$1"
          BASELINE_VALUES="$2"

          if [ -z "$USER_REG" ] || [ -z "$BASELINE_VALUES" ]; then
              echo "[GN-MS-2.2] ERROR: repair helper missing arguments" >&2
              exit 91
          fi

          if [ ! -f "$USER_REG" ]; then
              echo "[GN-MS-2.2] ERROR: user.reg not found: $USER_REG" >&2
              exit 92
          fi

          if [ ! -f "$BASELINE_VALUES" ]; then
              echo "[GN-MS-2.2] ERROR: baseline-values.txt missing: $BASELINE_VALUES" >&2
              exit 93
          fi

          TMP="${USER_REG}.gamenative-2.2.tmp"
          rm -f "$TMP" || exit 94
          : > "$TMP" || exit 94

          IN_SECTION=0
          SECTION_FOUND=0

          while IFS= read -r LINE || [ -n "$LINE" ]; do
              case "$LINE" in
                  '[Software\\Wine\\DllOverrides]'*)
                      printf '%s\n' "$LINE" >> "$TMP" || exit 94
                      if [ -s "$BASELINE_VALUES" ]; then
                          cat "$BASELINE_VALUES" >> "$TMP" || exit 94
                      fi
                      IN_SECTION=1
                      SECTION_FOUND=1
                      continue
                      ;;
                  '['*)
                      IN_SECTION=0
                      ;;
              esac

              if [ "$IN_SECTION" -eq 1 ]; then
                  case "$LINE" in
                      \"[Cc][Oo][Nn][Cc][Rr][Tt]140\"=*|\
                      \"[Mm][Ss][Vv][Cc][Pp]140\"=*|\
                      \"[Mm][Ss][Vv][Cc][Pp]140_1\"=*|\
                      \"[Mm][Ss][Vv][Cc][Pp]140_2\"=*|\
                      \"[Mm][Ss][Vv][Cc][Pp]140_[Aa][Tt][Oo][Mm][Ii][Cc]_[Ww][Aa][Ii][Tt]\"=*|\
                      \"[Mm][Ss][Vv][Cc][Pp]140_[Cc][Oo][Dd][Ee][Cc][Vv][Tt]_[Ii][Dd][Ss]\"=*|\
                      \"[Uu][Cc][Rr][Tt][Bb][Aa][Ss][Ee]\"=*|\
                      \"[Vv][Cc][Oo][Mm][Pp]140\"=*|\
                      \"[Vv][Cc][Rr][Uu][Nn][Tt][Ii][Mm][Ee]140\"=*|\
                      \"[Vv][Cc][Rr][Uu][Nn][Tt][Ii][Mm][Ee]140_1\"=*)
                          # Drop the live value. The exact upstream baseline
                          # value (if one exists) was inserted at section start.
                          continue
                          ;;
                  esac
              fi

              printf '%s\n' "$LINE" >> "$TMP" || exit 94
          done < "$USER_REG"

          # If the live hive had no DllOverrides section but upstream has one
          # or more of our target values, append only those baseline values.
          if [ "$SECTION_FOUND" -eq 0 ] && [ -s "$BASELINE_VALUES" ]; then
              printf '\n[Software\\\\Wine\\\\DllOverrides]\n' >> "$TMP" || exit 94
              cat "$BASELINE_VALUES" >> "$TMP" || exit 94
          fi

          # Preserve user.reg's existing inode/mode by truncating and rewriting
          # the original file instead of replacing it with mv.
          cat "$TMP" > "$USER_REG" || exit 95
          rm -f "$TMP" || exit 95

          exit 0
          SHREPAIR

          chmod 755 "$RECOVERY_ROOT/repair-user-reg.sh"
          sh -n "$RECOVERY_ROOT/repair-user-reg.sh"

          # ----------------------------------------------------------
          # Build-time simulation of the exact repair helper.
          # Create a synthetic live user.reg with all ten 1.7 values forced
          # to native,builtin plus an unrelated sentinel override, run the
          # helper, then verify the ten values exactly match upstream and the
          # sentinel survives.
          # ----------------------------------------------------------

          cp "$BASE_USER_REG" recovery-user-reg-test.reg

          python3 - recovery-user-reg-test.reg <<'PYCONTAM'
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          section = r"Software\\Wine\\DllOverrides"
          forced = {
              "concrt140": "native,builtin",
              "msvcp140": "native,builtin",
              "msvcp140_1": "native,builtin",
              "msvcp140_2": "native,builtin",
              "msvcp140_atomic_wait": "native,builtin",
              "msvcp140_codecvt_ids": "native,builtin",
              "ucrtbase": "native,builtin",
              "vcomp140": "native,builtin",
              "vcruntime140": "native,builtin",
              "vcruntime140_1": "native,builtin",
              "gamenative_2_2_sentinel": "builtin",
          }

          lines = path.read_text(encoding="utf-8").splitlines()
          section_re = re.compile(r"^\[([^\]]+)\](?:\s+.*)?$")

          start = None
          end = None
          for i, line in enumerate(lines):
              m = section_re.match(line)
              if m and m.group(1) == section:
                  start = i
                  end = len(lines)
                  for j in range(i + 1, len(lines)):
                      if section_re.match(lines[j]):
                          end = j
                          break
                  break

          entries = [f'"{name}"="{value}"' for name, value in forced.items()]

          if start is None:
              if lines and lines[-1] != "":
                  lines.append("")
              lines.append(f"[{section}]")
              lines.extend(entries)
          else:
              target_names = {name.lower() for name in forced}
              kept = []
              for line in lines[start + 1:end]:
                  m = re.match(r'^"([^"]+)"=', line)
                  if m and m.group(1).lower() in target_names:
                      continue
                  kept.append(line)
              lines[start + 1:end] = entries + kept

          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PYCONTAM

          "$RECOVERY_ROOT/repair-user-reg.sh" \
            recovery-user-reg-test.reg \
            "$RECOVERY_ROOT/baseline-values.txt"

          python3 - \
            "$BASE_USER_REG" \
            recovery-user-reg-test.reg <<'PYVERIFY'
          import re
          import sys
          from pathlib import Path

          targets = [
              "concrt140",
              "msvcp140",
              "msvcp140_1",
              "msvcp140_2",
              "msvcp140_atomic_wait",
              "msvcp140_codecvt_ids",
              "ucrtbase",
              "vcomp140",
              "vcruntime140",
              "vcruntime140_1",
          ]
          section = r"Software\\Wine\\DllOverrides"

          def read_values(path):
              lines = Path(path).read_text(encoding="utf-8").splitlines()
              section_re = re.compile(r"^\[([^\]]+)\](?:\s+.*)?$")
              value_re = re.compile(r'^"([^"]+)"=(.*)$')
              in_section = False
              values = {}
              for line in lines:
                  m = section_re.match(line)
                  if m:
                      in_section = m.group(1) == section
                      continue
                  if not in_section:
                      continue
                  m = value_re.match(line)
                  if m:
                      values[m.group(1).lower()] = line
              return values

          base = read_values(sys.argv[1])
          repaired = read_values(sys.argv[2])

          for name in targets:
              if base.get(name) != repaired.get(name):
                  raise RuntimeError(
                      f"Repair mismatch for {name}: upstream={base.get(name)!r} repaired={repaired.get(name)!r}"
                  )

          sentinel = repaired.get("gamenative_2_2_sentinel")
          if sentinel != '"gamenative_2_2_sentinel"="builtin"':
              raise RuntimeError(f"Unrelated sentinel was not preserved: {sentinel!r}")

          print("Synthetic live-user.reg recovery simulation PASSED")
          PYVERIFY

          # Preserve the original Wine launcher as wine.real and install the
          # thin one-time live-registry recovery wrapper.
          test -L "$ROOT/bin/wine"
          test "$(readlink "$ROOT/bin/wine")" = "../lib/wine/aarch64-unix/wine"

          rm -f "$ROOT/bin/wine.real"
          ln -s ../lib/wine/aarch64-unix/wine "$ROOT/bin/wine.real"
          rm -f "$ROOT/bin/wine"

          cat > "$ROOT/bin/wine" <<'SHWRAP'
          #!/bin/sh
          # GameNative MapleStory 216150 registry-only recovery shim (2.2).
          # Repair the ten VC DllOverrides values potentially persisted by the
          # failed 1.7 regedit attempt, then immediately launch the real Wine.

          # Do not use command substitution. GameNative's LD_PRELOAD evshim
          # writes startup messages to stdout and can corrupt captured output.
          case "$0" in
              /*)
                  SCRIPT_PATH="$0"
                  ;;
              */*)
                  SCRIPT_PATH="$PWD/$0"
                  ;;
              *)
                  echo "[GN-MS-2.2] ERROR: Wine wrapper was invoked without a path: $0" >&2
                  exit 50
                  ;;
          esac

          SCRIPT_DIR="${SCRIPT_PATH%/*}"
          ROOT_DIR="${SCRIPT_DIR%/*}"
          REAL_WINE="$SCRIPT_DIR/wine.real"
          RECOVERY_ROOT="$ROOT_DIR/share/wine/maplestory_registry_recovery_2_2"
          REPAIR_SCRIPT="$RECOVERY_ROOT/repair-user-reg.sh"
          BASELINE_VALUES="$RECOVERY_ROOT/baseline-values.txt"

          if [ ! -x "$REAL_WINE" ]; then
              echo "[GN-MS-2.2] ERROR: real Wine launcher missing: $REAL_WINE" >&2
              exit 52
          fi

          PREFIX="${WINEPREFIX:-}"

          if [ -n "$PREFIX" ]; then
              USER_REG="$PREFIX/user.reg"
              MARKER="$PREFIX/.gamenative-maplestory-dlloverrides-recovery-2.2"

              if [ -f "$USER_REG" ]; then
                  if [ ! -f "$MARKER" ]; then
                      if [ ! -x "$REPAIR_SCRIPT" ] || [ ! -f "$BASELINE_VALUES" ]; then
                          echo "[GN-MS-2.2] ERROR: packaged registry recovery payload missing" >&2
                          exit 90
                      fi

                      echo "[GN-MS-2.2] Restoring VC DllOverrides baseline in $USER_REG" >&2

                      "$REPAIR_SCRIPT" "$USER_REG" "$BASELINE_VALUES" || exit $?

                      {
                          echo "GameNative MapleStory VC DllOverrides recovery 2.2"
                          echo "Recovered=concrt140,msvcp140,msvcp140_1,msvcp140_2,msvcp140_atomic_wait,msvcp140_codecvt_ids,ucrtbase,vcomp140,vcruntime140,vcruntime140_1"
                          echo "Source=untouched prefixPack-arm64ec-11.txz baseline"
                          echo "RuntimeFiles=unchanged by 2.2 live recovery"
                          echo "WineInf=unchanged"
                      } > "$MARKER" || exit 96

                      echo "[GN-MS-2.2] Registry recovery complete; VC DllOverrides match Proton 11 baseline" >&2
                  else
                      echo "[GN-MS-2.2] Registry recovery marker already present" >&2
                  fi
              else
                  # A genuinely new prefix will use the already-patched
                  # prefixPack.txz; do not block Wine initialization.
                  echo "[GN-MS-2.2] user.reg not ready; deferring live registry recovery" >&2
              fi
          fi

          exec "$REAL_WINE" "$@"
          SHWRAP

          chmod 755 "$ROOT/bin/wine"

          echo
          echo "=== Validate 2.2 registry recovery wrapper ==="

          test -f "$ROOT/bin/wine"
          test ! -L "$ROOT/bin/wine"
          test -x "$ROOT/bin/wine"
          test -L "$ROOT/bin/wine.real"
          test -e "$ROOT/bin/wine.real"
          test -x "$ROOT/bin/wine.real"
          test "$(readlink "$ROOT/bin/wine.real")" = "../lib/wine/aarch64-unix/wine"

          sh -n "$ROOT/bin/wine"
          sh -n "$RECOVERY_ROOT/repair-user-reg.sh"

          grep -Fq 'Restoring VC DllOverrides baseline' "$ROOT/bin/wine"
          grep -Fq 'Registry recovery complete; VC DllOverrides match Proton 11 baseline' "$ROOT/bin/wine"
          grep -Fq 'repair-user-reg.sh' "$ROOT/bin/wine"
          grep -Fq 'exec "$REAL_WINE" "$@"' "$ROOT/bin/wine"

          if grep -Fq 'TestD3D.exe' "$ROOT/bin/wine"; then
              echo "ERROR: 2.2 must not bypass registry recovery for TestD3D"
              exit 1
          fi

          if grep -Fq 'WINEDLLOVERRIDES' "$ROOT/bin/wine"; then
              echo "ERROR: WINEDLLOVERRIDES leaked into 2.2"
              exit 1
          fi

          if grep -Fq 'regedit /S' "$ROOT/bin/wine"; then
              echo "ERROR: nested regedit leaked into 2.2"
              exit 1
          fi

          if grep -Eq '(^|[[:space:]])cmp([[:space:]]|$)' "$ROOT/bin/wine"; then
              echo "ERROR: guest wrapper depends on cmp"
              exit 1
          fi

          if grep -Fq 'SCRIPT_DIR=$(' "$ROOT/bin/wine" || \
             grep -Fq 'ROOT_DIR=$(' "$ROOT/bin/wine"; then
              echo "ERROR: wrapper contains stdout-capturing path command substitution"
              exit 1
          fi

          echo
          echo "2.2 live-prefix registry-only recovery wrapper PASSED"

      # ============================================================
      # 9. STAGE 3.11 READ-ONLY LINUX-REFERENCE PARITY AUDIT
      #
      # This package does NOT apply any new Linux-reference changes.
      # It audits the current live GameNative prefix against the exact
      # oldschoola/linux_maplestory reference payload already pinned by
      # RUNTIME_COMMIT.
      #
      # Run TestD3D once. Before TestD3D starts, 3.11 writes:
      #
      #   D:\GN-MS-Parity-3.11\
      #     parity-report.txt
      #     reference-vc-sha256.txt
      #     reference-10-nexon-launcher-protocol.reg
      #     reference-11-wine-direct3d-dll-overrides.reg
      #     reference-13-apply-runtime-file-patches.sh
      #     reference-mappings.ini
      #     reference-apps-settings.db
      #     reference-commit.txt
      #
      # The report checks:
      # - all 23 live VC runtime files vs the pinned Linux reference hashes
      # - presence/hash/size of .mappings.ini and apps-settings.db
      # - relevant live user.reg/system.reg lines for:
      #     X11 + DirectInput + AppDefaults + Direct3D
      #     Nexon protocol registration
      #     VC runtime DllOverrides
      #
      # Normal MapleStory launches remain a clean pass-through.
      #
      # NO Wine compatibility setting is changed:
      # - no WINEDEBUG
      # - no WINEESYNC change
      # - no WINEDLLOVERRIDES
      # - no registry mutation
      # - no runtime DLL mutation
      # - no process watcher
      # - no DXVK/Turnip/graphics change
      # ============================================================

      - name: Stage 3.11 read-only Linux reference parity audit
        shell: bash
        run: |
          set -euxo pipefail

          ROOT="$HOME/compiled-files-aarch64"
          INNER_WINE="$ROOT/bin/wine.2.2-registry"
          PARITY_ROOT="$ROOT/share/wine/maplestory_parity_3_11"

          test -f "$ROOT/bin/wine"
          test ! -L "$ROOT/bin/wine"
          test -x "$ROOT/bin/wine"
          test -L "$ROOT/bin/wine.real"
          test -e "$ROOT/bin/wine.real"
          test -x "$ROOT/bin/wine.real"

          for f in \
            reference-vc-sha256.txt \
            reference-10-nexon-launcher-protocol.reg \
            reference-11-wine-direct3d-dll-overrides.reg \
            reference-13-apply-runtime-file-patches.sh \
            reference-mappings.ini \
            reference-apps-settings.db \
            reference-commit.txt
