          #!/bin/sh
          # GameNative MapleStory 3.11 read-only Linux-reference parity audit.

          case "$0" in
              /*)
                  SCRIPT_PATH="$0"
                  ;;
              */*)
                  SCRIPT_PATH="$PWD/$0"
                  ;;
              *)
                  echo "[GN-MS-3.11] ERROR wrapper invoked without a path: $0"
