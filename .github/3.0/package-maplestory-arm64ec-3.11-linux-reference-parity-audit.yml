              echo "[GN-MS-3.11] ERROR inner 2.2 Wine wrapper missing: $INNER_WINE"
              exit 52
          fi

          IS_TESTD3D=0
          for ARG in "$@"; do
              case "$ARG" in
                  *TestD3D.exe*|*TESTD3D.EXE*|*testd3d.exe*)
                      IS_TESTD3D=1
                      ;;
              esac
          done

