name: Package MapleStory ARM64EC 3.7 MapleStory Hot Exit Monitor

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful 3.1 workflow run ID containing compiled-proton-arm64ec-ge11.0-3-gamefixes-checkpoint"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  package:
    runs-on: ubuntu-24.04

    env:
      # Reuse the already-compiled GE-Proton11-3 ARM64EC game-fixes runtime.
      # This workflow does NOT rebuild Wine.
      CHECKPOINT_ARTIFACT: "compiled-proton-arm64ec-ge11.0-3-gamefixes-checkpoint"

      # Exact GameNative Proton 11 ARM64EC prefix-pack commit used by 3.1/2.2.
      PREFIX_COMMIT: "450f670aa65243b2e7b5364d9577eb23f17b6855"

      # Same pinned Microsoft runtime payload source used by 2.2/3.1.
      RUNTIME_COMMIT: "181cd74cf51db5fd2563ec81359a94db9a2ada32"

      CUSTOM_VERSION: "11.0-3.7-arm64ec"
      WCP_NAME: "proton-11.0-3.7-arm64ec.wcp"

    steps:
      # ============================================================
      # 1. RESTORE THE SUCCESSFUL 3.1 COMPILED CHECKPOINT
      # ============================================================

      - name: Download 3.1 compiled ARM64EC checkpoint
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.CHECKPOINT_ARTIFACT }}
          path: checkpoint_download
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.source_run_id }}

      - name: Restore and validate 3.1 compiled runtime
        shell: bash
        run: |
          set -euxo pipefail

          CHECKPOINT="$(find checkpoint_download -type f -name 'compiled-proton-checkpoint.tar' -print -quit)"
          test -n "$CHECKPOINT"
          test -s "$CHECKPOINT"

          ROOT="$HOME/compiled-files-aarch64"
          rm -rf "$ROOT"
          mkdir -p "$ROOT"

          tar -C "$ROOT" -xf "$CHECKPOINT"

          test -d "$ROOT/bin"
          test -d "$ROOT/lib"
          test -d "$ROOT/share"
          test -L "$ROOT/bin/wine"
          test "$(readlink "$ROOT/bin/wine")" = "../lib/wine/aarch64-unix/wine"
          test -e "$ROOT/bin/wine"
          test -x "$ROOT/bin/wine"
          test -x "$ROOT/bin/wineserver"
          test -x "$ROOT/lib/wine/aarch64-unix/wine"

          chmod 755 "$ROOT/lib/wine/aarch64-unix/wine"
          chmod 755 "$ROOT/bin/wineserver"
          find "$ROOT/bin" -maxdepth 1 -type f -name 'wine*' -exec chmod 755 {} \;

          echo "=== Reused 3.1 GE-Proton11-3 compiled runtime ==="
          du -sh "$ROOT"
          ls -lah "$ROOT/bin" | sed -n '1,100p'
          sha256sum "$CHECKPOINT"

          echo "3.1 compiled checkpoint restore PASSED"

      # ============================================================
      # From here onward, reproduce the known-good 3.1 packaging state,
      # then add only the observation-only 3.7 MapleStory hot-exit watcher.
      # ============================================================

      - name: Checkout pinned MapleStory VC runtime payload
        uses: actions/checkout@v4
        with:
          repository: oldschoola/linux_maplestory
          ref: ${{ env.RUNTIME_COMMIT }}
          path: maplestory_reference
          sparse-checkout: |
            files/vc_runtime
            patches/13-apply-runtime-file-patches.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Validate pinned VC runtime payload
        shell: bash
        run: |
          set -euxo pipefail

          ROOT="$GITHUB_WORKSPACE/maplestory_reference/files/vc_runtime"

          SYS32=(
            concrt140.dll
            msvcp140.dll
            msvcp140_1.dll
            msvcp140_2.dll
            msvcp140_atomic_wait.dll
            msvcp140_codecvt_ids.dll
            ucrtbase.dll
            vccorlib140.dll
            vcomp140.dll
            vcruntime140.dll
            vcruntime140_1.dll
            vcruntime140_threads.dll
          )

          WOW64=(
            concrt140.dll
            msvcp140.dll
            msvcp140_1.dll
            msvcp140_2.dll
            msvcp140_atomic_wait.dll
            msvcp140_codecvt_ids.dll
            ucrtbase.dll
            vccorlib140.dll
            vcomp140.dll
            vcruntime140.dll
            vcruntime140_threads.dll
          )

          for dll in "${SYS32[@]}"; do
            test -s "$ROOT/system32/$dll"
          done

          for dll in "${WOW64[@]}"; do
            test -s "$ROOT/syswow64/$dll"
          done

          echo "=== Runtime payload commit ==="
          git -C "$GITHUB_WORKSPACE/maplestory_reference" rev-parse HEAD
          test "$(git -C "$GITHUB_WORKSPACE/maplestory_reference" rev-parse HEAD)" = "$RUNTIME_COMMIT"

          echo
          echo "=== system32 payload ==="
          for dll in "${SYS32[@]}"; do
            file "$ROOT/system32/$dll"
            sha256sum "$ROOT/system32/$dll"
          done

          echo
          echo "=== syswow64 payload ==="
          for dll in "${WOW64[@]}"; do
            file "$ROOT/syswow64/$dll"
            sha256sum "$ROOT/syswow64/$dll"
          done

          echo
          echo "Pinned VC runtime payload validation PASSED"

      # ============================================================
      # 5. DOWNLOAD THE CORRECT PROTON 11 ARM64EC PREFIX
      #
      # IMPORTANT:
      # Use prefixPack-arm64ec-11.txz.
      # Do NOT use the generic prefixPack-arm64ec.txz.
      # ============================================================

      - name: Download GameNative Proton 11 ARM64EC prefix
        shell: bash
        run: |
          set -euxo pipefail

          wget \
            https://raw.githubusercontent.com/GameNative/bionic-prefix-files/450f670aa65243b2e7b5364d9577eb23f17b6855/prefixPack-arm64ec-11.txz \
            -O prefixPack-base.txz

          test -s prefixPack-base.txz

          echo
          echo "=== Base prefix pack ==="

          ls -lh prefixPack-base.txz
          file prefixPack-base.txz
          sha256sum prefixPack-base.txz

      # ============================================================
      # 6. APPLY THE MAPLESTORY REGISTRY FIXES
      #
      # Carry forward the known-good registry layer unchanged.
      # The only runtime payload remains vcruntime140_threads.dll.
      # The Wine rebuild already occurred above; no additional source changes here.
      # ============================================================

      - name: Patch MapleStory registry settings into prefix
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf prefix_work
          mkdir -p prefix_work

          tar -xJf prefixPack-base.txz \
            -C prefix_work

          echo "=== Prefix structure ==="

          find prefix_work \
            -maxdepth 3 \
            -type f \
            -printf '%p\n' \
            > prefix-files-before.txt

          sed -n '1,150p' prefix-files-before.txt

          USER_REG="$(find prefix_work -type f -name user.reg -print -quit)"
          SYSTEM_REG="$(find prefix_work -type f -name system.reg -print -quit)"
          USERDEF_REG="$(find prefix_work -type f -name userdef.reg -print -quit || true)"

          if [ -z "$USER_REG" ]; then
            echo "ERROR: user.reg not found in prefix."
            exit 1
          fi

          if [ -z "$SYSTEM_REG" ]; then
            echo "ERROR: system.reg not found in prefix."
            exit 1
          fi

          echo
          echo "=== Registry hives ==="

          echo "user.reg:    $USER_REG"
          echo "system.reg:  $SYSTEM_REG"
          echo "userdef.reg: ${USERDEF_REG:-not present}"

          python3 - \
            "$USER_REG" \
            "$SYSTEM_REG" \
            "${USERDEF_REG:-}" <<'PY'
          import re
          import sys
          from pathlib import Path

          user_reg = Path(sys.argv[1])
          system_reg = Path(sys.argv[2])
          userdef_arg = sys.argv[3]
          userdef_reg = Path(userdef_arg) if userdef_arg else None


          def string_value(value):
              value = value.replace("\\", "\\\\")
              value = value.replace('"', '\\"')
              return f'"{value}"'


          def value_name(name):
              if name is None:
                  return "@"

              escaped = name.replace("\\", "\\\\")
              escaped = escaped.replace('"', '\\"')

              return f'"{escaped}"'


          def render(name, kind, value):
              prefix = value_name(name) + "="

              if kind == "str":
                  return prefix + string_value(value)

              if kind == "dword":
                  return prefix + f"dword:{value:08x}"

              raise ValueError(f"Unknown value type: {kind}")


          # Wine's internal registry-file format is similar to REGEDIT.
          # These paths are relative to HKCU inside user.reg.

          USER_PATCHES = {
              r"Software\\Wine\\X11 Driver": {
                  "UseTakeFocus": ("str", "N"),
                  "Grab": ("str", "N"),
                  "GrabFullscreen": ("str", "N"),
                  "UseLinuxInputEvents": ("str", "Y"),
              },

              r"Software\\Wine\\DirectInput": {
                  "UseLinuxInputEvents": ("str", "Y"),
                  "KeyboardUseNonExclusive": ("str", "Y"),
                  "MouseUseNonExclusive": ("str", "Y"),
              },

              r"Software\\Wine\\AppDefaults\\MapleStory.exe": {
                  "Version": ("str", "win10"),
              },

              r"Software\\Wine\\AppDefaults\\nxsteam.exe": {
                  "Version": ("str", "win10"),
              },

              r"Software\\Wine\\AppDefaults\\SteamConnectorHelper.exe": {
                  "Version": ("str", "win10"),
              },

              r"Software\\Nexon Launcher": {
                  "Install Directory": ("str", r"C:\Nexon\Launcher"),
                  "Region": ("str", "1"),
                  "User Data": (
                      "str",
                      '{"setup-id":"372e7640-20f4-419c-ada0-4ad0d76c33d9","time":1748271149}',
                  ),
              },

              r"Software\\Wine\\Direct3D": {
                  "cb_access_map_w": ("dword", 1),
                  "CSMT": ("str", "disabled"),
              },
          }


          # These paths are relative to HKLM inside system.reg.

          SYSTEM_PATCHES = {
              r"Software\\Classes\\Applications\\nexon_launcher.exe\\shell\\open": {
                  "FriendlyAppName": ("str", "Nexon Launcher"),
              },

              r"Software\\Classes\\nxl": {
                  None: ("str", "URL:nxl protocol"),
                  "URL Protocol": ("str", ""),
              },

              r"Software\\Classes\\nxl\\DefaultIcon": {
                  None: ("str", r"C:\Nexon\Launcher\nexon_launcher.exe"),
              },

              r"Software\\Classes\\nxl\\shell": {
                  None: ("str", ""),
              },

              r"Software\\Classes\\nxl\\shell\\open": {
                  None: ("str", ""),
                  "Friendly App Name": ("str", "Nexon Launcher"),
              },

              r"Software\\Classes\\nxl\\shell\\open\\command": {
                  None: (
                      "str",
                      r'"C:\Nexon\Launcher\nexon_launcher.exe" "%1"',
                  ),
              },

              r"Software\\Wow6432Node\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\Nexon Nexon Launcher": {
                  "DisplayIcon": (
                      "str",
                      r'"C:\Nexon\Launcher\logo.ico"',
                  ),
                  "DisplayName": (
                      "str",
                      "Nexon Launcher",
                  ),
                  "DisplayVersion": (
                      "str",
                      "2.3.0",
                  ),
                  "EstimatedSize": (
                      "dword",
                      0x2B48,
                  ),
                  "HelpLink": (
                      "str",
                      r'"http://www.nexon.net/legal/terms-of-use/"',
                  ),
                  "InstallLocation": (
                      "str",
                      r'"C:\Nexon\Launcher"',
                  ),
                  "NoModify": (
                      "dword",
                      1,
                  ),
                  "NoRepair": (
                      "dword",
                      1,
                  ),
                  "Publisher": (
                      "str",
                      "Nexon",
                  ),
                  "QuietUninstallString": (
                      "str",
                      r'"C:\Nexon\Launcher\uninstall.exe" /S',
                  ),
                  "UninstallString": (
                      "str",
                      r'"C:\Nexon\Launcher\uninstall.exe"',
                  ),
                  "URLInfoAbout": (
                      "str",
                      r'"http://www.nexon.net"',
                  ),
                  "URLUpdateInfo": (
                      "str",
                      r'"http://www.nexon.net"',
                  ),
                  "VersionMajor": (
                      "dword",
                      2,
                  ),
                  "VersionMinor": (
                      "dword",
                      3,
                  ),
              },
          }


          section_re = re.compile(r"^\[([^\]]+)\](?:\s+.*)?$")


          def find_section(lines, section):
              for index, line in enumerate(lines):
                  match = section_re.match(line)

                  if match and match.group(1) == section:
                      start = index

                      end = len(lines)

                      for next_index in range(index + 1, len(lines)):
                          if section_re.match(lines[next_index]):
                              end = next_index
                              break

                      return start, end

              return None


          def patch_hive(path, patches):
              print(f"Patching {path}")

              text = path.read_text(
                  encoding="utf-8",
                  errors="strict",
              )

              lines = text.splitlines()

              for section, values in patches.items():

                  current = find_section(lines, section)

                  if current is None:
                      if lines and lines[-1] != "":
                          lines.append("")

                      # Modification time is optional in Wine registry v2.
                      lines.append(f"[{section}]")

                      for name, (kind, value) in values.items():
                          lines.append(
                              render(
                                  name,
                                  kind,
                                  value,
                              )
                          )

                      continue

                  for name, (kind, value) in values.items():

                      desired = render(
                          name,
                          kind,
                          value,
                      )

                      token = value_name(name) + "="

                      start, end = find_section(
                          lines,
                          section,
                      )

                      replaced = False

                      for line_index in range(
                          start + 1,
                          end,
                      ):
                          if lines[line_index].startswith(token):
                              lines[line_index] = desired
                              replaced = True
                              break

                      if not replaced:
                          lines.insert(
                              end,
                              desired,
                          )

              path.write_text(
                  "\n".join(lines) + "\n",
                  encoding="utf-8",
              )


          def verify_hive(path, patches):
              text = path.read_text(
                  encoding="utf-8",
                  errors="strict",
              )

              for section, values in patches.items():

                  if f"[{section}]" not in text:
                      # Existing Wine-generated sections may include
                      # modification timestamps after the closing bracket.
                      section_found = False

                      for line in text.splitlines():
                          match = section_re.match(line)

                          if match and match.group(1) == section:
                              section_found = True
                              break

                      if not section_found:
                          raise RuntimeError(
                              f"Missing registry section {section} in {path}"
                          )

                  for name, (kind, value) in values.items():
                      wanted = render(
                          name,
                          kind,
                          value,
                      )

                      if wanted not in text:
                          raise RuntimeError(
                              f"Missing registry value {wanted} in {path}"
                          )

              print(f"Verified {path}")


          patch_hive(
              user_reg,
              USER_PATCHES,
          )

          patch_hive(
              system_reg,
              SYSTEM_PATCHES,
          )

          # Keep default-user settings consistent if this hive exists.
          if userdef_reg and userdef_reg.exists():
              patch_hive(
                  userdef_reg,
                  USER_PATCHES,
              )

          verify_hive(
              user_reg,
              USER_PATCHES,
          )

          verify_hive(
              system_reg,
              SYSTEM_PATCHES,
          )

          if userdef_reg and userdef_reg.exists():
              verify_hive(
                  userdef_reg,
                  USER_PATCHES,
              )

          print()
          print("MapleStory registry patch validation PASSED")
          PY

          echo
          echo "=== Repacking modified prefix ==="

          tar cJf prefixPack.txz \
            -C prefix_work \
            .

          test -s prefixPack.txz

          echo
          echo "=== Modified prefix pack ==="

          ls -lh prefixPack.txz
          sha256sum prefixPack.txz

          echo
          echo "=== Modified prefix contents ==="

          tar tJf prefixPack.txz \
            > modified-prefix-files.txt

          grep -E \
            '(^|/)(user|userdef|system)\.reg$' \
            modified-prefix-files.txt

          echo
          echo "Prefix registry patch PASSED"

      # ============================================================
      # 7. ADD ONLY vcruntime140_threads.dll TO THE PACKAGED PREFIX
      #
      # Known-good 1.6 runtime variable:
      #   - system32/vcruntime140_threads.dll
      #   - syswow64/vcruntime140_threads.dll
      #
      # We deliberately do NOT replace ucrtbase.dll or the rest of the
      # VC runtime set yet. Earlier MapleStory logs already showed several
      # v14 runtime DLLs loading, while vcruntime140_threads.dll was not
      # observed. This keeps the experiment narrow and reversible.
      # ============================================================

      - name: Add vcruntime140_threads.dll to packaged prefix
        shell: bash
        run: |
          set -euxo pipefail

          PAYLOAD="$GITHUB_WORKSPACE/maplestory_reference/files/vc_runtime"

          rm -rf prefix_runtime_work
          mkdir -p prefix_runtime_work

          tar -xJf prefixPack.txz \
            -C prefix_runtime_work

          DRIVE_C="$(find prefix_runtime_work -type d -name drive_c -print -quit)"

          if [ -z "$DRIVE_C" ]; then
            echo "ERROR: drive_c not found in prefix pack"
            exit 1
          fi

          mkdir -p \
            "$DRIVE_C/windows/system32" \
            "$DRIVE_C/windows/syswow64"

          cp -f \
            "$PAYLOAD/system32/vcruntime140_threads.dll" \
            "$DRIVE_C/windows/system32/vcruntime140_threads.dll"

          cp -f \
            "$PAYLOAD/syswow64/vcruntime140_threads.dll" \
            "$DRIVE_C/windows/syswow64/vcruntime140_threads.dll"

          cmp -s \
            "$PAYLOAD/system32/vcruntime140_threads.dll" \
            "$DRIVE_C/windows/system32/vcruntime140_threads.dll"

          cmp -s \
            "$PAYLOAD/syswow64/vcruntime140_threads.dll" \
            "$DRIVE_C/windows/syswow64/vcruntime140_threads.dll"

          tar cJf prefixPack.txz \
            -C prefix_runtime_work \
            .

          test -s prefixPack.txz

          echo
          echo "Packaged-prefix vcruntime140_threads.dll injection PASSED"

      # ============================================================
      # 8. STAGE REGISTRY-ONLY RECOVERY FOR THE EXISTING LIVE PREFIX
      #
      # The failed 1.7 nested regedit may have persisted some/all of the
      # ten VC runtime native,builtin overrides into the existing user.reg.
      # 2.0 restored the runtime files before its guest-side cmp failure,
      # but its wine.inf registry recovery never got a chance to run.
      #
      # 2.2 therefore changes ONLY those ten values in the live
      # Software\\Wine\\DllOverrides section. It derives their exact
      # baseline from untouched prefixPack-arm64ec-11.txz at build time.
      #
      # IMPORTANT:
      #   - No nested Wine/regedit invocation.
      #   - No wine.inf mutation.
      #   - No WINEDLLOVERRIDES.
      #   - No live VC runtime copying.
      #   - No esync / DXVK / Turnip changes.
      #   - Recovery intentionally also runs for TestD3D.
      # ============================================================

      - name: Stage 2.2 live-prefix VC DllOverrides recovery
        shell: bash
        run: |
          set -euxo pipefail

          ROOT="$HOME/compiled-files-aarch64"
          RECOVERY_ROOT="$ROOT/share/wine/maplestory_registry_recovery_2_2"

          test -x "$ROOT/lib/wine/aarch64-unix/wine"

          rm -rf recovery_registry_base "$RECOVERY_ROOT"
          mkdir -p recovery_registry_base "$RECOVERY_ROOT"

          tar -xJf prefixPack-base.txz \
            -C recovery_registry_base

          BASE_USER_REG="$(find recovery_registry_base -type f -name user.reg -print -quit)"
          test -n "$BASE_USER_REG"
          test -s "$BASE_USER_REG"

          # Extract only the ten values that 1.7 attempted to force.
          # baseline-values.txt contains the exact raw Wine-registry lines
          # present upstream; omitted values are intentionally absent.
          python3 - \
            "$BASE_USER_REG" \
            "$RECOVERY_ROOT/baseline-values.txt" \
            "$RECOVERY_ROOT/baseline-status.txt" <<'PYBASE'
          import re
          import sys
          from pathlib import Path

          user_reg = Path(sys.argv[1])
          values_out = Path(sys.argv[2])
          status_out = Path(sys.argv[3])

          section = r"Software\\Wine\\DllOverrides"
          targets = [
              "concrt140",
              "msvcp140",
              "msvcp140_1",
              "msvcp140_2",
              "msvcp140_atomic_wait",
              "msvcp140_codecvt_ids",
              "ucrtbase",
              "vcomp140",
              "vcruntime140",
              "vcruntime140_1",
          ]
          target_set = set(targets)

          lines = user_reg.read_text(encoding="utf-8", errors="strict").splitlines()
          section_re = re.compile(r"^\[([^\]]+)\](?:\s+.*)?$")
          value_re = re.compile(r'^"([^"]+)"=(.*)$')

          in_section = False
          found = {}

          for line in lines:
              match = section_re.match(line)
              if match:
                  in_section = match.group(1) == section
                  continue

              if not in_section:
                  continue

              match = value_re.match(line)
              if not match:
                  continue

              name = match.group(1).lower()
              if name not in target_set:
                  continue

              if name in found:
                  raise RuntimeError(f"Duplicate upstream DllOverrides value: {name}")

              found[name] = line

          baseline_lines = [found[name] for name in targets if name in found]

          values_out.write_text(
              "\n".join(baseline_lines) + ("\n" if baseline_lines else ""),
              encoding="utf-8",
          )

          status_lines = []
          for name in targets:
              if name in found:
                  status_lines.append(f"present {name} {found[name]}")
              else:
                  status_lines.append(f"absent {name}")

          status_out.write_text("\n".join(status_lines) + "\n", encoding="utf-8")

          print("=== Upstream VC DllOverrides baseline ===")
          print(status_out.read_text(encoding="utf-8"), end="")
          PYBASE

          test -f "$RECOVERY_ROOT/baseline-values.txt"
          test -s "$RECOVERY_ROOT/baseline-status.txt"

          cat > "$RECOVERY_ROOT/repair-user-reg.sh" <<'SHREPAIR'
          #!/bin/sh
          # Restore only the ten MapleStory VC runtime DllOverrides values in
          # a Wine user.reg file. This intentionally uses simple POSIX shell
          # operations available in GameNative's bionic guest.

          USER_REG="$1"
          BASELINE_VALUES="$2"

          if [ -z "$USER_REG" ] || [ -z "$BASELINE_VALUES" ]; then
              echo "[GN-MS-2.2] ERROR: repair helper missing arguments" >&2
              exit 91
          fi

          if [ ! -f "$USER_REG" ]; then
              echo "[GN-MS-2.2] ERROR: user.reg not found: $USER_REG" >&2
              exit 92
          fi

          if [ ! -f "$BASELINE_VALUES" ]; then
              echo "[GN-MS-2.2] ERROR: baseline-values.txt missing: $BASELINE_VALUES" >&2
              exit 93
          fi

          TMP="${USER_REG}.gamenative-2.2.tmp"
          rm -f "$TMP" || exit 94
          : > "$TMP" || exit 94

          IN_SECTION=0
          SECTION_FOUND=0

          while IFS= read -r LINE || [ -n "$LINE" ]; do
              case "$LINE" in
                  '[Software\\Wine\\DllOverrides]'*)
                      printf '%s\n' "$LINE" >> "$TMP" || exit 94
                      if [ -s "$BASELINE_VALUES" ]; then
                          cat "$BASELINE_VALUES" >> "$TMP" || exit 94
                      fi
                      IN_SECTION=1
                      SECTION_FOUND=1
                      continue
                      ;;
                  '['*)
                      IN_SECTION=0
                      ;;
              esac

              if [ "$IN_SECTION" -eq 1 ]; then
                  case "$LINE" in
                      \"[Cc][Oo][Nn][Cc][Rr][Tt]140\"=*|\
                      \"[Mm][Ss][Vv][Cc][Pp]140\"=*|\
                      \"[Mm][Ss][Vv][Cc][Pp]140_1\"=*|\
                      \"[Mm][Ss][Vv][Cc][Pp]140_2\"=*|\
                      \"[Mm][Ss][Vv][Cc][Pp]140_[Aa][Tt][Oo][Mm][Ii][Cc]_[Ww][Aa][Ii][Tt]\"=*|\
                      \"[Mm][Ss][Vv][Cc][Pp]140_[Cc][Oo][Dd][Ee][Cc][Vv][Tt]_[Ii][Dd][Ss]\"=*|\
                      \"[Uu][Cc][Rr][Tt][Bb][Aa][Ss][Ee]\"=*|\
                      \"[Vv][Cc][Oo][Mm][Pp]140\"=*|\
                      \"[Vv][Cc][Rr][Uu][Nn][Tt][Ii][Mm][Ee]140\"=*|\
                      \"[Vv][Cc][Rr][Uu][Nn][Tt][Ii][Mm][Ee]140_1\"=*)
                          # Drop the live value. The exact upstream baseline
                          # value (if one exists) was inserted at section start.
                          continue
                          ;;
                  esac
              fi

              printf '%s\n' "$LINE" >> "$TMP" || exit 94
          done < "$USER_REG"

          # If the live hive had no DllOverrides section but upstream has one
          # or more of our target values, append only those baseline values.
          if [ "$SECTION_FOUND" -eq 0 ] && [ -s "$BASELINE_VALUES" ]; then
              printf '\n[Software\\\\Wine\\\\DllOverrides]\n' >> "$TMP" || exit 94
