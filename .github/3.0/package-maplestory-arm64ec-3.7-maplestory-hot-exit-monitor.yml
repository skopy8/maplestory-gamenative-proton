          if start is None:
              if lines and lines[-1] != "":
                  lines.append("")
              lines.append(f"[{section}]")
              lines.extend(entries)
          else:
              target_names = {name.lower() for name in forced}
              kept = []
              for line in lines[start + 1:end]:
                  m = re.match(r'^"([^"]+)"=', line)
                  if m and m.group(1).lower() in target_names:
                      continue
