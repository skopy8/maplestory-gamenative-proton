          fi

          # Preserve user.reg's existing inode/mode by truncating and rewriting
          # the original file instead of replacing it with mv.
          cat "$TMP" > "$USER_REG" || exit 95
          rm -f "$TMP" || exit 95

          exit 0
          SHREPAIR

          chmod 755 "$RECOVERY_ROOT/repair-user-reg.sh"
          sh -n "$RECOVERY_ROOT/repair-user-reg.sh"

          # ----------------------------------------------------------
          # Build-time simulation of the exact repair helper.
          # Create a synthetic live user.reg with all ten 1.7 values forced
          # to native,builtin plus an unrelated sentinel override, run the
          # helper, then verify the ten values exactly match upstream and the
          # sentinel survives.
          # ----------------------------------------------------------

          cp "$BASE_USER_REG" recovery-user-reg-test.reg

          python3 - recovery-user-reg-test.reg <<'PYCONTAM'
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          section = r"Software\\Wine\\DllOverrides"
          forced = {
              "concrt140": "native,builtin",
