          echo "2.2 live-prefix registry-only recovery wrapper PASSED"

      # ============================================================
      # 9. STAGE 3.7 MAPLESTORY HOT-EXIT DIAGNOSTICS
      #
      # Observation-only follow-up to 3.2.
